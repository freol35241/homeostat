schema = 1

[unit]
name = "openwrt"
kind = "adapter"
description = "OpenWrt network adapter under test"

[runtime]
command = "uv run ../../adapters/openwrt.py"
restart = "always"
shutdown_grace_s = 5

[discovery]
mode = "static"
endpoint = "${HOMEOSTAT_OPENWRT}"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
discovery = { key = "home/discovery/openwrt" }

[params.poll_interval_s]
type = "int"
default = 1
constraint = { min = 1, max = 3600 }
editable_by = "owner"

[params.away_delay_s]
type = "int"
default = 2
constraint = { min = 0, max = 3600 }
editable_by = "family"

[entities]
dir = "entities/openwrt/"
