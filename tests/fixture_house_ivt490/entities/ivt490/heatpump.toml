schema = 1

[entity]
# id is the device's own MQTT base topic; deliberately not the entity
# name, so the tests prove binding goes through the id.
id = "ivt490_1"
capability = "climate"
room = "utility"

[write_policy]
mode = "arbitrated"
owner = "ivt490"

# The device's indoor-temperature feedback input is fed from the fusion's
# virtual sensor (docs/design.md, Device feeds): tests publish that
# entity's state directly and assert the forward on MQTT.
[inputs]
indoor_temperature_actual = { entity = "indoor_temperature", aspect = "temperature" }
