schema = 1

[entity]
# Deliberately NOT the file stem: go2rtc names the stream by this id, so a
# dashboard proxying by entity name would ask for a stream that does not
# exist and the player would go black with no error anywhere.
id = "porch_cam_native"
capability = "camera"
room = "livingroom"

[naming]
en = "porch camera"

[write_policy]
mode = "shared"
owner = "reflector"
