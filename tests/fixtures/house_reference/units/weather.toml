schema = 1

[unit]
name = "weather"
kind = "automation"
description = "Fetches an outdoor temperature forecast from the national service"

[runtime]
command = "uv run units/weather.py"
restart = "on-failure"

# A forecast for an entity this unit does not bind: `outdoor_temp` is the
# esphome adapter's device. A forecast is a source's claim about a
# series' future values, and the source that can make it is often not the
# binder (docs/design.md#forecasts). The last key segment names the
# source, so a second provider sits beside this one instead of
# overwriting it.
[bus.publishes]
curve = { key = "home/forecast/global/outdoor_temp/temperature/smhi" }
