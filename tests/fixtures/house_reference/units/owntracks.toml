schema = 1

[unit]
name = "owntracks"
kind = "adapter"
description = "OwnTracks phones over the MQTT broker"

[runtime]
command = "uv run units/owntracks.py"
restart = "always"
env = ["HOMEOSTAT_MQTT_CREDENTIALS"]

[discovery]
mode = "static"
endpoint = "mqtt://localhost:1883"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
discovery = { key = "home/discovery/owntracks" }

[entities]
dir = "entities/owntracks/"
