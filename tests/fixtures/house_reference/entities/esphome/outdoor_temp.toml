schema = 1

[entity]
id = "outdoor-temp-sensor.local"
capability = "sensor"
features = ["temperature", "humidity"]
room = "global"

[naming]
sv = "utomhustemperaturen"
en = "outdoor temperature"
aliases = []

[write_policy]
owner = "esphome"

# The station's rain gauge reports an amount per hour. esphome publishes
# every aspect of its entities under a wildcard, so any name is covered.
[aspects.precipitation]
interval_s = 3600
