# The family surface's views (docs/design.md#views-are-text).
# Each [[view]] is a nav entry. Without this file the dashboard renders
# its generated views. Health and "Not shown" (everything no view places)
# stay reachable from the rail whatever this file says.
schema = 1

[[view]]
name = "now"
widgets = [
  { kind = "tile", entity = "outdoor_temp" },            # the outdoor reading, big, with today's range
  { kind = "tile", entity = "downstairs_temperature" },
  { kind = "people" },
  { kind = "deviations" },
]

[[view]]
name = "outdoors"
widgets = [
  # a group draws its members on one card: the reading, then its 24 hours
  { kind = "group", label = "Outdoor", widgets = [
    { kind = "tile", entity = "outdoor_temp" },
    { kind = "chart", entity = "outdoor_temp", aspect = "temperature", hours = 24 },
  ] },
]

[[view]]
name = "downstairs"
widgets = [
  { kind = "unit", unit = "evening_lights" },           # its setpoint, and the lights it drives
  { kind = "unit", unit = "fused_temperature" },        # what it publishes, and what it reads
  # This chart's detail overlay offers "with sources", which draws the two
  # thermometers it is fused from beside it (docs/design.md#sources).
  { kind = "chart", entity = "downstairs_temperature", aspect = "temperature", hours = 24 },
  { kind = "room", room = "kitchen" },
  { kind = "room", room = "livingroom" },
  { kind = "room", room = "hallway" },
]

[[view]]
name = "setpoints"
kind = "setpoints"

# The step a control moves in. It is keyed by what the control sets, not
# by the widget that places it, so the same step applies on the room card,
# on a view and in the detail overlay. Without an entry the dashboard
# guesses one (a twentieth of the range), and the house may know better.
# It matters most for sliders, which a finger can move by accident.
[[control]]
entity = "livingroom_lamp"
aspect = "brightness"
step = 5

[[control]]
unit = "intrusion"
param = "cooldown_minutes"
step = 5
