schema = 1

[unit]
name = "onvif"
kind = "adapter"
description = "ONVIF camera adapter under test"

[runtime]
command = "uv run ../../../adapters/onvif.py"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_CAMERAS"]

[discovery]
mode = "mdns"
service = "_onvif._tcp"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }

# Short, so the rotation test waits seconds, not the default 40.
[params.resubscribe_after_s]
type = "int"
default = 3
constraint = { min = 1, max = 50 }
editable_by = "owner"

[entities]
dir = "entities/onvif/"
