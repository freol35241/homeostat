schema = 1

[unit]
name = "arbiter"
kind = "service"
description = "Arbiter for the arbitrated lock"

[runtime]
command = "uv run ../../../adapters/arbiter.py"
restart = "always"
shutdown_grace_s = 5

[bus.subscribes]
cmd = "home/cmd/**"
# Which entities are arbitrated, followed live across applies.
grants = "home/meta/system/grants"
grants_pending = "home/meta/system/grants_pending"
# Every unit's holds, which it resolves (docs/design.md#holds).
holds = "home/hold/**"

[bus.publishes]
arbiter = { key = "home/arbiter/**" }
# What it is holding, as state: one record per held aspect, put on change
# and deleted when the hold ends (docs/design.md#arbitrated-mode).
holds = { key = "home/hold/arbiter/**" }
# What it resolved per aspect: the applied hold and the holds beneath.
arbitration = { key = "home/arbitration/arbiter" }

[params.hold_minutes]
type = "float"
default = 30
editable_by = "family"

[naming]
sv = "skiljedomare"
en = "arbiter"
aliases = []
