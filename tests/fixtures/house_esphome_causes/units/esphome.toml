schema = 1

[unit]
name = "esphome"
kind = "adapter"
description = "ESPHome adapter under test, with a relay that reports its causes"

[runtime]
command = "uv run ../../../adapters/esphome.py"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_ESPHOME_DEVICES"]

[discovery]
mode = "mdns"
service = "_esphomelib._tcp"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
discovery = { key = "home/discovery/esphome" }
# A change a person made at the device, reported to the arbiter
# (docs/design.md#device-reported-causes).
reports = { key = "home/cmd/**", priority = "manual" }

[bus.subscribes]
commands = "home/cmd/{room}/{entity}/**"
forwarded = "home/arbiter/{room}/{entity}/**"
# Which aspects the family holds, so a rule's change clears the hold.
holds = "home/hold/**"

[entities]
dir = "entities/esphome/"
