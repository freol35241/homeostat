schema = 1

[entity]
id = "0x14"
capability = "button"
room = "hallway"

[write_policy]
owner = "zigbee"

[actions.single]
lamp = { set = { on = true }, hold = "none" }

# Not fine: a toggle of a non-boolean, undeclared features, a release of a
# lock without unlocks, a loose time and a button target.
[actions.double]
lamp = { toggle = "brightness" }

[actions.long]
lamp = { set = { brightness = [1, 2], color_temp = 300 } }
door = { hold = "release" }
remote = { toggle = "on" }

[actions.triple]
door = { set = { locked = true }, hold = "+6:00" }

# Not fine: a declared reading, which takes no command, and a value of the
# wrong type.
[actions.quadruple]
heater = { set = { indoor_temperature = 20, setpoint = "warm" } }
