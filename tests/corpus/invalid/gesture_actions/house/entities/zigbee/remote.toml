# Fine: a toggle, a set and a release.
[actions.single]
lamp = { toggle = "on" }

[actions.double]
door = { hold = "release", unlocks = true }

# Not fine, one each.
[actions.long]
nobody = { toggle = "on" }
lamp = { toggle = "colour" }
door = { set = { locked = false }, hold = "07:00" }
