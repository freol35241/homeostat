schema = 1

[unit]
name = "watcher"
kind = "automation"

[runtime]
command = "uv run units/watcher.py"
restart = "on-failure"

[bus.subscribes]
anything = "home/state/**/**"
numbered = "home/state/kitchen/lamp#1/**"

[bus.publishes]
locked = { key = "home/hold/watcher/kitchen/lamp/$light", capability = "light", priority = "automation" }
