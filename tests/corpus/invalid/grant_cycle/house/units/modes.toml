schema = 1

[unit]
name = "modes"
kind = "automation"

[runtime]
command = "uv run units/modes.py"
restart = "on-failure"

[bus.subscribes]
commands = "home/cmd/{room}/{entity}/**"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
# Commands the scene the scenes unit binds, while scenes commands ours.
scene = { key = "home/cmd/global/evening_scene/on", capability = "switch", priority = "automation" }

[entities]
dir = "entities/modes/"
