schema = 1

[unit]
name = "seer"
kind = "automation"

[runtime]
command = "uv run units/seer.py"
restart = "on-failure"

[bus.publishes]
# A forecast for something no entity describes: nothing gives it a label,
# a unit, or a place on a chart — the same hole the state rule closes.
ghost = { key = "home/forecast/den/ghost/price" }
wild = { key = "home/forecast/*/ghost/price" }
