    // hover-only reading: claiming the press there would fight the tap
    // the card exists for. The charts a reader actually scrubs — the
    // detail overlay's — sit in no such card.
    if (!wrap.closest('[data-action]')) {
      wrap.classList.add('scrubbable');
      var down = null;
      wrap.addEventListener('pointerdown', function (ev) {
        // A touch has no position until it moves, so the press itself has
        // to read: a tap showed nothing before this, and only a drag
        // worked. Capture keeps a finger that wanders off a 64px strip
        // scrubbing instead of dropping the gesture mid-read.
        if (wrap.setPointerCapture) wrap.setPointerCapture(ev.pointerId);
        down = { x: ev.clientX, y: ev.clientY };
        onMove(wrap, reg, ev);
      });
      // A tap pins the line under it; a drag is a scrub and pins nothing.
      // The two arrive as the same pointer sequence, so the only thing
      // separating them is how far the pointer travelled.
      wrap.addEventListener('pointerup', function (ev) {
        var moved = down && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > TAP_SLOP;
        down = null;
        if (moved || !reg.issues) return;
        var rect = wrap.getBoundingClientRect();
        if (!rect.width) return;
        var near = nearestIssue(
          reg, rect,
          ((ev.clientX - rect.left) / rect.width) * reg.width,
          ((ev.clientY - rect.top) / rect.height) * reg.height
        );
        overlay.pinned = near && overlay.pinned !== near.issue.issued ? near.issue.issued : null;
        renderOverlayContent();
      });
    }
    wrap.addEventListener('pointermove', function (ev) { onMove(wrap, reg, ev); });
    // pointerleave never fires for a lifted finger, and a gesture the
    // scroller claims arrives as pointercancel: either one would leave
    // the crosshair and the tooltip stranded on screen.
    wrap.addEventListener('pointerup', function () { onChartPointerLeave(wrap); });
    wrap.addEventListener('pointercancel', function () { onChartPointerLeave(wrap); });
    wrap.addEventListener('pointerleave', function () { onChartPointerLeave(wrap); });
  });
}

/* Which drawn issue the pointer is nearest, in BOTH dimensions.
 * Scrubbing has always found the nearest point by x alone, which is
 * right for one series and meaningless for a braid: x alone picks
 * whichever line happens to have a sample closest horizontally, ignoring
 * that the pointer may be nowhere near it. */
function nearestIssue(reg, rect, tx, ty) {
  if (!reg.issues || !reg.issues.length) return null;
  // Distance is measured in SCREEN pixels, not viewBox units. The
  // viewBox is stretched to the wrapper, so its x and y units are
  // nothing like the same size — at the full-window chart one x unit is
  // six times a y unit — and a circle of "nearness" in viewBox space is
  // a thin ellipse to the reader, who then cannot hit the line they are
  // pointing at.
  var sx = rect.width / reg.width, sy = rect.height / reg.height;
  var best = null, bestD = Infinity;
  reg.issues.forEach(function (f, n) {
    f.coords.forEach(function (p) {
      var dx = (p.x - tx) * sx, dy = (p.y - ty) * sy;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = { index: n, issue: f, point: p }; }
    });
  });
  // Far from every line is not a selection: a scrub across empty chart
  // should not drag a highlight along with it.
  return bestD <= NEAR_ISSUE * NEAR_ISSUE ? best : null;
}
// CSS pixels — what the reader sees, and roughly a fingertip.
var NEAR_ISSUE = 26;
// Pointer travel, in CSS pixels, past which a press is a scrub and not a
// tap. A thumb never holds perfectly still, so zero would mean nothing
// was ever tappable.
var TAP_SLOP = 8;

function onChartPointerMove(wrap, reg, ev) {
  var rect = wrap.getBoundingClientRect();
  if (rect.width === 0) return;
  var fx = (ev.clientX - rect.left) / rect.width;
  fx = Math.max(0, Math.min(1, fx));
  var tx = fx * reg.width;
  var svg = wrap.querySelector('svg');
  if (!svg) return;
  if (reg.issues) {
    onBraidPointerMove(wrap, reg, ev, rect, tx);
    return;
  }
  var c = reg.coords[0];
  reg.coords.forEach(function (p) { if (Math.abs(p.x - tx) < Math.abs(c.x - tx)) c = p; });
  var line = svg.querySelector('.chart-crosshair');
  var dot = wrap.querySelector('.chart-crosshair-dot');
  line.setAttribute('x1', c.x); line.setAttribute('x2', c.x);
  line.style.display = '';
  if (dot) {
    dot.style.left = (c.x / reg.width * 100).toFixed(2) + '%';
    dot.style.top = (c.y / reg.height * 100).toFixed(2) + '%';
    dot.style.display = '';
  }
  var px = rect.left + (c.x / reg.width) * rect.width;
  var py = rect.top + (c.y / reg.height) * rect.height;
  var span = reg.window ? reg.window.to - reg.window.from : 0;
  showChartTooltip(px, py, formatChartValue(reg.aspect, c.value), formatChartTime(c.ts, span));
  sourcesColumn(reg, tx);
}

/* Every source's reading at the instant under the pointer, written under
 * the chart. The tooltip is about the value the house believes; this is
 * about where that belief came from, which is the question the sources
 * were drawn to answer. */
function sourcesColumn(reg, tx) {
  var el = byId('sources-column');
  if (!el) return;
  if (!reg.contributors || tx === null) { el.textContent = ''; return; }
  var field = descriptorField(overlay.entity, overlay.aspect);
  var parts = [];
  reg.contributors.forEach(function (c) {
    var near = null;
    c.coords.forEach(function (p) {
      if (!near || Math.abs(p.x - tx) < Math.abs(near.x - tx)) near = p;
    });
    if (near) parts.push(c.label + ' ' + logic.formatAspect(overlay.aspect, field, near.value));
  });
  el.textContent = parts.join(' \u00b7 ');
}

/* Scrubbing a braid reads two things at once: the issue under the
 * pointer (highlighted, and named in the tooltip) and the whole column
 * at that instant (how many forecasts spoke about it, and how far apart
 * they were) — which is the one slice that cannot share this chart's
 * axis, delivered by the gesture rather than by a second control. */
function onBraidPointerMove(wrap, reg, ev, rect, tx) {
  var ty = ((ev.clientY - rect.top) / rect.height) * reg.height;
  var near = nearestIssue(reg, rect, tx, ty);
  wrap.querySelectorAll('.chart-issue').forEach(function (el) {
    el.classList.toggle('hovered', !!near && el.getAttribute('data-issue') === String(near.index));
  });
  var line = wrap.querySelector('.chart-crosshair');
  if (line) { line.setAttribute('x1', tx); line.setAttribute('x2', tx); line.style.display = ''; }
  var when = reg.window ? reg.window.from + (tx / reg.width) * (reg.window.to - reg.window.from) : null;
  var span = reg.window ? reg.window.to - reg.window.from : 0;
  if (!near) { hideChartTooltip(); braidColumn(reg, when); return; }
  var dot = wrap.querySelector('.chart-crosshair-dot');
  if (dot) {
    dot.style.left = (near.point.x / reg.width * 100).toFixed(2) + '%';
    dot.style.top = (near.point.y / reg.height * 100).toFixed(2) + '%';
    dot.style.display = '';
  }
  showChartTooltip(
    rect.left + (near.point.x / reg.width) * rect.width,
    rect.top + (near.point.y / reg.height) * rect.height,
    formatChartValue(reg.aspect, near.point.value),
    (near.issue.source ? near.issue.source + ' \u00b7 ' : '') +
      'issued ' + formatChartTime(near.issue.issued, span) + ' \u2014 for ' +
      formatChartClock(near.point.ts, span)
  );
  braidColumn(reg, when);
}

// The column reading, written under the chart rather than into the
// tooltip: the tooltip is about one forecast, this is about all of them.
function braidColumn(reg, when) {
  var el = byId('braid-column');
  if (!el) return;
  var col = when === null ? null : logic.columnAt(overlay.issues || [], when);
  if (!col) { el.textContent = ''; return; }
  var field = descriptorField(overlay.entity, overlay.aspect);
  el.textContent = formatChartClock(when) + ' \u00b7 ' + col.count + ' forecast' +
    (col.count === 1 ? '' : 's') + ' \u00b7 ' +
    logic.formatAspect(overlay.aspect, field, col.min) + ' to ' +
    logic.formatAspect(overlay.aspect, field, col.max);
}

function onTimelinePointerMove(wrap, reg, ev) {
  var rect = wrap.getBoundingClientRect();
  if (rect.width === 0) return;
  var fx = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  var t = reg.window.from + fx * (reg.window.to - reg.window.from);
  var run = null;
  reg.runs.forEach(function (r) { if (t >= r.start && t < r.end) run = r; });
  var line = wrap.querySelector('.chart-crosshair');
  if (!line) return;
  var x = fx * reg.width;
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  line.style.display = '';
  if (!run) { hideChartTooltip(); return; }
  // A run's two edges and how long it held: "since 14:32" alone could not
  // say whether a state lasted a minute or all afternoon, which is most
  // of what a timeline is read for. The last run has no end yet.
  var span = reg.window.to - reg.window.from;
  var ongoing = run.end >= reg.window.to;
  var when = ongoing
    ? 'since ' + formatChartTime(run.start, span)
    : formatChartTime(run.start, span) + ' → ' + formatChartClock(run.end, span);
  showChartTooltip(ev.clientX, rect.top, logic.formatAspect(reg.aspect || '', reg.field, run.value),
    when + ' · ' + fmtDuration(run.end - run.start));
}

function onChartPointerLeave(wrap) {
  var line = wrap.querySelector('.chart-crosshair');
  var dot = wrap.querySelector('.chart-crosshair-dot');
  if (line) line.style.display = 'none';
  if (dot) dot.style.display = 'none';
  hideChartTooltip();
  var col = byId('sources-column');
  if (col) col.textContent = '';
}

function showChartTooltip(x, y, valueText, timeText) {
  var tt = byId('chart-tooltip');
  byId('chart-tooltip-value').textContent = valueText;
  byId('chart-tooltip-time').textContent = timeText;
  tt.classList.add('show');
  var ttRect = tt.getBoundingClientRect();
  var left = x + 12;
  var top = y - ttRect.height - 10;
  if (left + ttRect.width > window.innerWidth - 8) left = x - ttRect.width - 12;
  if (left < 8) left = 8;
  if (top < 8) top = y + 12;
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}

function hideChartTooltip() {
  byId('chart-tooltip').classList.remove('show');
}

// ---- widget: entity capability rows (shared by Rooms and generic use) ----

// Controls render inert when this dashboard's manifest does not grant the
// entity's capability (model.commandable): the server refuses such a
// command anyway, and a live-looking control for it would misreport the
// grant table.
function controlDisabled(entity) { return !entity.commandable; }

function widgetForLight(entity) {
  var on = !!stateValue(entity.room, entity.name, 'on');
  var inert = controlDisabled(entity);
  var html = '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' +
    '<span class="toggle ' + (on ? 'on' : '') + (inert ? ' disabled' : '') + '"' + (inert ? '' : ' data-action="toggle-light"') + ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-value="' + (!on) + '"><span class="knob"></span></span>' +
    '</div>';

  if (entity.features && entity.features.indexOf('brightness') !== -1) {
    var b = stateValue(entity.room, entity.name, 'brightness');
    var bkey = entity.room + '/' + entity.name + '/brightness';
    var pct = typeof b === 'number' ? Math.round((b / 254) * 100) : 0;
    if (localState.sliderDrag[bkey] !== undefined) pct = localState.sliderDrag[bkey];
    var nudgeAttrs = ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '"' + (inert || typeof b !== 'number' ? ' disabled' : '');
    html += '<div class="slider-row entity-sub"><span class="slabel">brightness</span>' +
      '<button class="step-btn" data-action="brightness-step"' + nudgeAttrs + ' data-delta="-10" aria-label="dimmer">&minus;</button>' +
      '<input type="range" min="0" max="100" value="' + pct + '"' + (inert ? ' disabled' : '') + ' data-action="slider" data-kind="brightness" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
      '<span class="sval">' + pct + '%</span>' +
      '<button class="step-btn" data-action="brightness-step"' + nudgeAttrs + ' data-delta="10" aria-label="brighter">+</button></div>';
  }
  if (entity.features && entity.features.indexOf('color_temp') !== -1) {
    var ct = stateValue(entity.room, entity.name, 'color_temp');
    var ctkey = entity.room + '/' + entity.name + '/color_temp';
    var mired = typeof ct === 'number' ? ct : 300;
    if (localState.sliderDrag[ctkey] !== undefined) mired = localState.sliderDrag[ctkey];
    var kelvin = Math.round(1e6 / mired / 100) * 100;
    html += '<div class="slider-row entity-sub"><span class="slabel">color temp</span>' +
      '<input type="range" min="150" max="500" value="' + mired + '"' + (inert ? ' disabled' : '') + ' data-action="slider" data-kind="color_temp" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
      '<span class="sval">' + kelvin + ' K</span></div>';
  }
  return html;
}

function widgetForPresence(entity) {
  var occ = presenceValue(entity);
  var seenKey = entity.room + '/' + entity.name;
  var lastSeen = store.lastSeen[seenKey];
  var label = occ ? 'Motion' : 'Clear';
  var extra = lastSeen ? '<span class="faint" title="' + esc(new Date(lastSeen).toLocaleString()) + '"> &middot; ' + esc(relTime(lastSeen)) + '</span>' : '';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' +
    '<span><span class="status-dot ' + (occ ? 'dot-on' : 'dot-off') + '"></span>' + esc(label) + extra + '</span>' +
    '</div>';
}

function widgetForLock(entity) {
  var locked = !!stateValue(entity.room, entity.name, 'locked');
  var badge = entity.write_mode === 'arbitrated' ? '<span class="badge-arbitrated">ARBITRATED</span>' : '';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + badge + '</span>' +
    '<span class="toggle ' + (locked ? 'on' : '') + (controlDisabled(entity) ? ' disabled' : '') + '"' + (controlDisabled(entity) ? '' : ' data-action="toggle-lock"') + ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-value="' + (!locked) + '"><span class="knob"></span></span>' +
    '</div>';
}

function widgetForClimate(entity, big) {
  var setpoint = stateValue(entity.room, entity.name, 'setpoint');
  var hasSetpoint = typeof setpoint === 'number';
  var readout = hasSetpoint ? setpoint.toFixed(1) + '°' : '—';
  var indoor = stateValue(entity.room, entity.name, 'indoor_temperature');
  var feed = stateValue(entity.room, entity.name, 'feed_temperature');
  var nowParts = [];
  if (typeof indoor === 'number') nowParts.push(indoor.toFixed(1) + '° now');
  if (typeof feed === 'number') nowParts.push(feed.toFixed(1) + '° feed');
  var badge = entity.write_mode === 'arbitrated' ? '<span class="badge-arbitrated">ARBITRATED</span>' : '';
  var disabledAttr = hasSetpoint && !controlDisabled(entity) ? '' : ' disabled';
  if (big) {
    // the overlay and the dial widget: the vocabulary's setpoint on a
    // dial, bounds the capability's usual (the adapter enforces its own)
    return renderDial('climate-step', ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '"', {
      value: setpoint, display: readout, min: 5, max: 30, step: 0.5,
      disabled: !!disabledAttr, current: nowParts.join(' · ')
    });
  }
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + badge + '</span>' +
    '<span style="display:flex;align-items:center;gap:10px;">' +
    (nowParts.length ? '<span class="faint">' + esc(nowParts.join(' · ')) + '</span>' : '') +
    '<span class="stepper">' +
    '<button class="step-btn" data-action="climate-step" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-delta="-0.5"' + disabledAttr + '>&minus;</button>' +
    '<span class="stepper-value">' + esc(readout) + '</span>' +
    '<button class="step-btn" data-action="climate-step" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-delta="0.5"' + disabledAttr + '>+</button>' +
    '</span></span></div>';
}

// A sensor's card: one sparkline row per reading, each tapping through to
// that aspect's history. Which readings, in what order, is the descriptor's
// say (dashboard-logic.js, sensorCardPlan, #56): a thermometer lists
// temperature and humidity, not its link quality. A multi-aspect sensor
// gets a head row with the entity name that opens the entity detail — the
// aspect rows are the only other affordance, and they lead to a chart. The
// overlay, which is that detail, renders the rows without the head.
function widgetForSensor(entity, withHead) {
  var rows = logic.sensorCardPlan(entity, store.state, store.aspects[entity.name]);
  if (rows.length === 0) {
    return '<div class="entity-row"><span class="entity-name">' + esc(entity.label) + '</span><span class="faint">no data</span></div>';
  }
  var multi = rows.length > 1;
  var attrs = ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '"';
  var head = multi && withHead !== false
    ? '<div class="entity-row row-clickable" data-action="entity-detail"' + attrs + '>' +
      '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span></div>'
    : '';
  return head + rows.map(function (r) {
    var sk = entity.name + '|' + r.aspect;
    ensureHistory(entity.name, r.aspect); // fetched once (guarded), on first render while visible
    var s = localState.sparklines[sk];
    var sparkHtml = s && s.loaded ? buildChart('room-' + sk, s.points, { height: 28, sizeClass: 'chart-row', aspect: r.aspect, area: true, window: s.window }) : '';
    var name = multi ? r.label : entity.label;
    return '<div class="entity-row row-clickable' + (multi ? ' sensor-reading' : '') + '" data-action="history-detail"' + attrs + ' data-aspect="' + esc(r.aspect) + '">' +
      '<span class="entity-name" title="' + esc(name) + '">' + esc(name) + '</span>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
      (sparkHtml ? '<span style="width:80px;">' + sparkHtml + '</span>' : '') +
      '<span class="muted' + (r.stale ? ' stale' : '') + '">' + esc(r.display) + '</span></span>' +
      '</div>';
  }).join('');
}

function widgetGeneric(entity) {
  var prefix = 'home/state/' + entity.room + '/' + entity.name + '/';
  var rows = [];
  Object.keys(store.state).forEach(function (k) {
    if (k.indexOf(prefix) === 0) {
      var aspect = k.slice(prefix.length);
      rows.push('<div class="aspect-row">' + esc(aspect) + ': ' + esc(logic.formatAspect(aspect, null, store.state[k])) + '</div>');
    }
  });
  if (rows.length === 0) rows.push('<div class="aspect-row faint">no data</div>');
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" style="flex-direction:column;align-items:flex-start;">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' + rows.join('') + '</div>';
}

function widgetForCamera(entity) {
  // No poster: a still frame means transcoding H.264 to JPEG, which is a
  // transcoder in the image for a thumbnail (docs/design.md, Cameras —
  // the plane split is a pure remux). The failing <img> rendered as a
  // black rectangle indistinguishable from a dark room, which is worse
  // than saying plainly the picture is a tap away. Motion still reads
  // here, from the event plane, which is the part that matters at a
  // glance. The live view opens in the detail overlay — never N always-on
  // streams.
  var motion = stateValue(entity.room, entity.name, 'motion');
  var badge = motion === true ? '<span class="badge-motion">MOTION</span>' : '';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" style="flex-direction:column;align-items:stretch;gap:6px;">' +
    '<span style="display:flex;justify-content:space-between;align-items:center;">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' + badge + '</span>' +
    '<span class="camera-tap">&#9654; tap to view</span>' +
    '</div>';
}

// The room-card row for an entity whose adapter published an aspect
// descriptor (#32): name and the first family control on one line, the
// headline readings underneath — never the readout-wrapped-around-a-
// stepper row the undescribed climate widget degrades to in a narrow
// column. Which readings are headline is dashboard-logic.js's cardPlan.
function widgetForDescribed(entity) {
  var plan = logic.cardPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity));
  var badge = entity.write_mode === 'arbitrated' ? '<span class="badge-arbitrated">ARBITRATED</span>' : '';
  var control = plan.controls.length ? renderAspectControl(entity, plan.controls[0]) : '';
  var readings = plan.readings.map(function (r) {
    return '<span class="card-reading' + (r.stale ? ' stale' : '') + '" title="' + esc(r.aspect) + '">' +
      esc(r.label) + ' <b>' + esc(r.display) + '</b></span>';
  }).join('<span class="sep">&middot;</span>');
  // The badge rides the readings line: inside the ellipsed name it clips
  // to a stub in a narrow column, and the head line belongs to the control.
  return '<div class="entity-row described-card row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<div class="described-head"><span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' + control + '</div>' +
    (readings || badge ? '<div class="described-readings">' + readings + (badge ? '<span class="card-badge">' + badge + '</span>' : '') + '</div>' : '') +
    '</div>';
}

function widgetForEntity(entity) {
  var described = !!store.aspects[entity.name];
  if (described && (entity.capability === 'climate' || !BESPOKE_WIDGET[entity.capability])) return widgetForDescribed(entity);
  if (entity.capability === 'light' || entity.capability === 'switch') return widgetForLight(entity);
  if (entity.capability === 'presence') return widgetForPresence(entity);
  if (entity.capability === 'lock') return widgetForLock(entity);
  if (entity.capability === 'climate') return widgetForClimate(entity);
  if (entity.capability === 'sensor') return widgetForSensor(entity);
  if (entity.capability === 'camera') return widgetForCamera(entity);
  return widgetGeneric(entity);
}

var CAP_ORDER = { light: 0, lock: 1, presence: 2, climate: 3, sensor: 4, camera: 5 };
// Capabilities whose card widget is the capability's own (a toggle, a
// sparkline, a poster) rather than the descriptor-driven row.
var BESPOKE_WIDGET = { light: true, switch: true, presence: true, lock: true, sensor: true, camera: true };
function capRank(entity) {
  var r = CAP_ORDER[entity.capability];
  return r === undefined ? 6 : r;
}

// ---- relative time ----

function relTime(ms) {
  var diff = Math.max(0, Date.now() - ms);
  var mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins === 1) return '1 min ago';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins / 60);
  if (hrs === 1) return '1 hr ago';
  return hrs + ' hr ago';
}

// ---- widget: map (person entities) ----
//
// The map is a view over every person entity, not a per-entity row (see
// docs/design.md, "Map and person entities"). Leaflet's map object is
// stateful (pan/zoom, tile cache) and must not be recreated on every
// state-delta render, so its container is a detached DOM node kept in
// mapState and moved into a fresh slot each render, rather than rebuilt
// from an HTML string like the rest of the view.

var mapState = { container: null, map: null, tileLayer: null, markers: {}, circles: {}, fitted: false };

function personEntities() {
  return (store.model.entities || []).filter(function (e) { return e.capability === 'person'; });
}

function personLatLon(entity) {
  var lat = stateValue(entity.room, entity.name, 'lat');
  var lon = stateValue(entity.room, entity.name, 'lon');
  if (typeof lat !== 'number' || typeof lon !== 'number') return null;
  return [lat, lon];
}

function mapThemeName() {
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function personDivIcon(entity) {
  return L.divIcon({
    className: 'person-marker',
    html: '<div class="person-marker-dot"></div><div class="person-marker-label">' + esc(entity.label) + '</div>',
    iconSize: [12, 12],
    iconAnchor: [6, 6]
  });
}

function personPopupHtml(entity) {
  var battery = stateValue(entity.room, entity.name, 'battery');
  var fixedAt = stateValue(entity.room, entity.name, 'fixed_at');
  var parts = [];
  if (typeof battery === 'number') parts.push('battery ' + Math.round(battery) + '%');
  if (typeof fixedAt === 'number') parts.push(relTime(fixedAt * 1000));
  return '<b>' + esc(entity.label) + '</b>' + (parts.length ? '<br>' + esc(parts.join(' · ')) : '');
}

function ensureMap() {
  if (mapState.map) return;
  if (!mapState.container) {
    mapState.container = document.createElement('div');
    mapState.container.id = 'person-map';
    mapState.container.className = 'map-wrap';
  }
  // No default setView: a center/zoom is set only once real fixes exist
  // (updateMapMarkers), so no coordinate is ever hardcoded. Layers added
  // before that point just wait for it (Leaflet defers via whenReady).
  mapState.map = L.map(mapState.container);
  if (store.model.tiles) {
    mapState.tileLayer = protomapsL.leafletLayer({ url: '/tiles.pmtiles', theme: mapThemeName() }).addTo(mapState.map);
  }
}

function updateMapMarkers(persons) {
  var map = mapState.map;
  var bounds = [];
  var seen = {};
  persons.forEach(function (e) {
    var key = e.room + '/' + e.name;
    seen[key] = true;
    var latlon = personLatLon(e);
    if (!latlon) {
      if (mapState.markers[key]) { map.removeLayer(mapState.markers[key]); delete mapState.markers[key]; }
      if (mapState.circles[key]) { map.removeLayer(mapState.circles[key]); delete mapState.circles[key]; }
      return;
    }
    bounds.push(latlon);
    var marker = mapState.markers[key];
    if (!marker) {
      marker = L.marker(latlon, { icon: personDivIcon(e) }).addTo(map);
      mapState.markers[key] = marker;
    } else {
      marker.setLatLng(latlon);
    }
    marker.bindPopup(personPopupHtml(e));

    var accuracy = stateValue(e.room, e.name, 'accuracy');
    var circle = mapState.circles[key];
    if (typeof accuracy === 'number') {
      if (!circle) {
        mapState.circles[key] = L.circle(latlon, { radius: accuracy, color: 'var(--accent)', weight: 1, fillOpacity: .1 }).addTo(map);
      } else {
        circle.setLatLng(latlon);
        circle.setRadius(accuracy);
      }
    } else if (circle) {
      map.removeLayer(circle);
      delete mapState.circles[key];
    }
  });

  Object.keys(mapState.markers).forEach(function (key) {
    if (seen[key]) return;
    map.removeLayer(mapState.markers[key]);
    delete mapState.markers[key];
    if (mapState.circles[key]) { map.removeLayer(mapState.circles[key]); delete mapState.circles[key]; }
  });

  // Fit once, when fixes first appear — repeating this on every later
  // delta would fight anyone panning the map.
  if (bounds.length && !mapState.fitted) {
    if (bounds.length === 1) map.setView(bounds[0], 16);
    else map.fitBounds(bounds, { maxZoom: 16, padding: [24, 24] });
    mapState.fitted = true;
  }
}

function mountMap(persons) {
  var slot = byId('map-slot');
  if (!slot) return;
  ensureMap();
  slot.appendChild(mapState.container);
  updateMapMarkers(persons);
  mapState.map.invalidateSize();
}

function renderMapCard(persons) {
  var noFix = persons.filter(function (e) { return !personLatLon(e); });
  var hint = store.model.tiles ? '' : '<div class="map-hint">no tile extract configured</div>';
  var noFixHtml = noFix.length
    ? '<div class="map-nofix">' + noFix.map(function (e) { return esc(e.label); }).join(', ') + ' &mdash; no fix yet</div>'
    : '';
  return '<div class="card span-all"><div class="card-label">Map</div>' +
    '<div id="map-slot"></div>' + hint + noFixHtml + '</div>';
}

// ---- widgets ----
//
// A view is a list of widgets (dashboard.toml, or the generated views'
// implicit lists), each a card built from what the page already renders.
// The dashboard owns every one of these; a widget places, never draws.

// Signal tiles: one per reading of the entity, or the one reading named.
// Which readings, in what order, is the descriptor's say — the same rows
// as the entity's sensor card (dashboard-logic.js, sensorCardPlan).
function widgetTiles(entity, aspect) {
  var rows = logic.sensorCardPlan(entity, store.state, store.aspects[entity.name]);
  if (aspect) rows = rows.filter(function (r) { return r.aspect === aspect; });
  return rows.map(function (r) {
    var sk = entity.name + '|' + r.aspect;
    ensureHistory(entity.name, r.aspect);
    var s = localState.sparklines[sk];
    var forecast = forecastsOf(entity, r.aspect);
    var spark = s && s.loaded ? buildChart('tile-' + sk, s.points, { height: 36, sizeClass: 'chart-tile', aspect: r.aspect, area: true, window: s.window, forecast: forecast }) : '';
    // A horizon says where a reading is going; today's range says where
    // it has been. The forecast wins the line when there is one, because
    // a number you can still act on beats one you cannot. A tile is
    // family-tier and has room for ONE claim, so with several sources it
    // falls back to the range rather than picking a provider to believe
    // — comparing them is owner work and lives in the overlay.
    var caption = forecast.length === 1
      ? horizonCaption(r.aspect, descriptorField(entity, r.aspect), forecast[0].forecast, Date.now())
      : (s && s.loaded ? minMaxCaption(s.points) : '');
    // The separator is the character, not the entity: the whole label is
    // upper-cased below, and "&MIDDOT;" is not one.
    var tileLabel = esc(entity.label) + (rows.length > 1 ? ' \u00b7 ' + esc(r.label) : '');
    return '<div class="card tile clickable" data-action="history-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-aspect="' + esc(r.aspect) + '">' +
      '<div class="card-label" title="' + esc(entity.label) + '">' + tileLabel.toUpperCase() + '</div>' +
      '<div class="big' + (r.stale ? ' stale' : '') + '">' + esc(r.display) + '</div>' + spark +
      '<div class="caption">' + esc(caption) + '</div></div>';
  }).join('');
}

// One aspect's history over a window, as a card.
function widgetChart(entity, aspect, hours) {
  var key = entity.name + '|' + aspect + '|' + hours;
  var field = descriptorField(entity, aspect);
  // The same rule as the detail overlay: a described enum or boolean is
  // runs, so the card draws a timeline and asks the recorder for changes.
  var shape = logic.historyShape(stateValue(entity.room, entity.name, aspect), field);
  var s = localState.charts[key];
  if (!s) {
    localState.charts[key] = { points: [], loaded: false, loading: true };
    fetchHistory(entity.name, aspect, hours, shape).then(function (loaded) {
      localState.charts[key] = loaded;
      scheduleRender();
    });
    s = localState.charts[key];
  }
  var value = stateValue(entity.room, entity.name, aspect);
  var chart = !s.loaded ? ''
    : shape === 'timeline'
      ? buildTimeline('chart-' + key, s.points, { height: 64, sizeClass: 'chart-timeline', aspect: aspect, field: field, window: s.window })
      : buildChart('chart-' + key, s.points, { height: 120, sizeClass: 'chart-card', aspect: aspect, area: true, gridlines: true, yLabels: true, window: s.window, forecast: forecastsOf(entity, aspect) });
  return '<div class="card tile clickable span-all" data-action="history-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-aspect="' + esc(aspect) + '">' +
    '<div class="card-label">' + esc(entity.label + ' · ' + ((field && field.label) || aspect)).toUpperCase() + ' <span class="faint">' + esc(hours >= 48 ? Math.round(hours / 24) + 'd' : hours + 'h') + '</span></div>' +
    '<div class="big">' + esc(logic.formatAspect(aspect, field, value)) + '</div>' + chart + '</div>';
}

// People: the person entities, home or away from their presence aspect;
// failing that, when they were last seen. Motion sensors are rooms'
// business, not people.
function widgetPeople(persons) {
  if (persons.length === 0) return '';
  var pRows = persons.map(function (e) {
    var st = logic.personStatus(store.state, e);
    var detail = st.home === true ? 'Home' : st.home === false ? 'Away'
      : st.seenAt !== undefined ? 'last fix ' + relTime(st.seenAt) : 'no signal';
    return '<div class="row-clickable" data-action="entity-detail" data-room="' + esc(e.room) + '" data-entity="' + esc(e.name) + '" style="display:flex;align-items:center;gap:6px;padding:3px 0;">' +
      '<span class="status-dot ' + (st.home === true ? 'dot-on' : 'dot-off') + '"></span>' +
      '<span>' + esc(e.label) + ' &middot; ' + esc(detail) + '</span></div>';
  }).join('');
  return '<div class="card tile"><div class="card-label">People</div>' + pRows + '</div>';
}

// Out of the ordinary — the rules live in dashboard-logic.js; here each
// record's target maps onto the tap wiring.
function widgetDeviations() {
  var deviations = logic.computeDeviations(
    store.model, store.state, store.health, store.config, store.aspects
  );

  function deviationAttrs(target) {
    if (target.type === 'unit') {
      return 'data-action="unit-detail" data-unit="' + esc(target.unit) + '"';
    }
    if (target.type === 'entity') {
      return 'data-action="entity-detail" data-room="' + esc(target.room) +
        '" data-entity="' + esc(target.entity) + '"';
    }
    if (target.type === 'setpoint') {
      return 'data-action="goto-setpoint" data-unit="' + esc(target.unit) +
        '" data-param="' + esc(target.param) + '"';
    }
    return 'data-action="goto-rooms"';
  }

  var devHtml;
  if (deviations.length === 0) {
    devHtml = '<div class="equilibrium"><span class="eq-dot"></span>In equilibrium.</div>';
  } else {
    devHtml = deviations.map(function (d) {
      return '<div class="dev-row row-clickable" ' + deviationAttrs(d.target) + '>' +
        '<div class="dev-main"><div class="title" title="' + esc(d.title) + '">' + esc(d.title) + '</div>' +
        (d.detail ? '<div class="detail">' + esc(d.detail) + '</div>' : '') + '</div>' +
        (d.button ? '<button class="dev-btn" data-action="' + d.button.action + '">' + esc(d.button.label) + '</button>' : '') +
        '<div class="dev-tag">' + esc(d.tag) + '</div></div>';
    }).join('');
  }
  return '<div class="card span-all"><div class="card-label">Out of the ordinary' + (deviations.length ? ' — ' + deviations.length : '') + '</div>' + devHtml + '</div>';
}

// A unit's family-editable parameters as one card.
function widgetParams(unit) {
  var params = unit.params || {};
  var rows = Object.keys(params).filter(function (p) { return familyEditable(params[p]); })
    .map(function (p) { return renderParamRow(unit.name, p, params[p], true); });
  return '<div class="card"><div class="card-label">' + esc(unit.label) + '</div>' +
    (rows.length ? rows.join('') : '<div class="empty-hint">No family-editable parameters.</div>') + '</div>';
}

// A thermostat dial as a card: the described temperature command named
// (or the first one), else the climate capability's own setpoint. An
// entity with neither falls back to its own row.
function widgetDial(entity, aspect) {
  var rows = [];
  logic.aspectPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity)).forEach(function (s) {
    s.rows.forEach(function (r) { rows.push(r); });
  });
  var row = rows.filter(function (r) { return r.control && r.control.kind === 'dial' && (!aspect || r.aspect === aspect); })[0];
  var body = row ? renderAspectControl(entity, row, true)
    : entity.capability === 'climate' ? widgetForClimate(entity, true)
    : widgetForEntity(entity);
  return '<div class="card clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<div class="card-label" title="' + esc(entity.label) + '">' + esc(entity.label).toUpperCase() + (row ? ' &middot; ' + esc(row.label).toUpperCase() : '') + '</div>' + body + '</div>';
}

// ---- widget: burner ----
//
// The `burner` vocabulary as one card (docs/design.md, Burners and
// interlocks): its two commands — the family lever `on` and the output
// `power_level` — over the two temperatures an interlock reads, each with
// its day. Nothing dialectal: run-state codes and a firmware's own
// readings stay in the entity's overlay, which the card taps through to.
// A descriptor keeps the firmware's field name in parentheses — "flue
// (smoke_temp)" — which the overlay shows and a card has no room for, the
// same trim the room card makes (dashboard-logic.js, cardPlan).
function shortLabel(label) { return label.replace(/\s*\([^)]*\)$/, ''); }

var BURNER_READINGS = ['flue_temperature', 'boiler_temperature'];
var BURNER_COMMANDS = ['on', 'power_level'];

function widgetBurner(entity) {
  var rows = {};
  logic.aspectPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity))
    .forEach(function (s) { s.rows.forEach(function (r) { rows[r.aspect] = r; }); });

  var lit = rows.on && rows.on.value === true;
  var state = rows.available && rows.available.value === false ? 'offline'
    : !rows.on || rows.on.value === undefined ? 'no signal'
    : lit ? 'burning' : 'idle';

  var controls = BURNER_COMMANDS.map(function (aspect) {
    var r = rows[aspect];
    if (!r) return '';
    return '<div class="burner-control"><span>' + esc(shortLabel(r.label)) + '</span>' +
      (r.control ? renderAspectControl(entity, r) : aspectValueSpan(r)) + '</div>';
  }).join('');

  var readings = BURNER_READINGS.map(function (aspect) {
    var r = rows[aspect];
    if (!r) return '';
    ensureHistory(entity.name, aspect);
    var sk = entity.name + '|' + aspect;
    var hist = localState.sparklines[sk];
    var spark = hist && hist.loaded
      ? buildChart('burner-' + sk, hist.points, { height: 36, sizeClass: 'chart-tile', aspect: aspect, area: true, window: hist.window })
      : '';
    return '<div class="burner-reading row-clickable" data-action="history-detail" data-room="' + esc(entity.room) +
      '" data-entity="' + esc(entity.name) + '" data-aspect="' + esc(aspect) + '">' +
      '<div class="burner-reading-head"><span>' + esc(shortLabel(r.label)) + '</span><b>' + esc(r.display) + '</b></div>' +
      spark + '</div>';
  }).join('');

  // The head taps through to the entity: the run-state codes and the
  // device's own readings live there, and the card does not repeat them.
  return '<div class="card burner-card">' +
    '<div class="burner-head row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) +
    '" data-entity="' + esc(entity.name) + '">' +
    '<div class="card-label" style="margin:0;" title="' + esc(entity.label) + '">' + esc(entity.label).toUpperCase() + '</div>' +
    '<span class="burner-state' + (lit ? ' lit' : '') + '">' + esc(state) + '</span></div>' +
    controls + readings + '</div>';
}

// An entity's own row — its control or its readings — as a card.
function widgetEntity(entity) {
  return '<div class="card">' + widgetForEntity(entity) + '</div>';
}

// A unit's card (dashboard-logic.js, unitCardPlan): head, then the
// relations the manifest and the grant table already state. Each section
// is drawn only when it has members; the labels are the page's words, not
// the manifest's, and the card can say nothing the manifest did not.
function widgetUnit(unitName) {
  var plan = logic.unitCardPlan(store.model, unitName);
  if (!plan) return '';
  var u = plan.unit;
  var h = store.health['home/health/' + u.name] || {};
  var status = h.status || 'stopped';
  var html = '<div class="card unit-card">' +
    '<div class="unit-head row-clickable" data-action="unit-detail" data-unit="' + esc(u.name) + '">' +
    '<div><div class="unit-name" title="' + esc(u.label) + '">' + esc(u.label) + '</div>' +
    (u.description ? '<div class="unit-desc">' + esc(u.description) + '</div>' : '') + '</div>' +
    '<span class="status-badge" title="' + esc(healthTooltip(h)) + '"><span class="status-glyph status-' + esc(status) + '">' + statusGlyph(status) + '</span>' + esc(status) + '</span></div>';
  var section = function (label, body) {
    return body ? '<div class="section-label">' + label + '</div>' + body : '';
  };
  // its own card: the param name alone, the unit is the head
  html += section('Setpoints', plan.params.map(function (p) { return renderParamRow(u.name, p, u.params[p], true); }).join(''));
  html += section('Publishes', plan.publishes.map(widgetForEntity).join(''));
  // Drives and From are the unit's wiring, not its surface: a line saying
  // how much of it there is, and the fields themselves when asked for.
  var wiring = plan.drives.length + plan.sources.length;
  if (wiring) {
    var open = !!localState.relations[u.name];
    var summary = [];
    if (plan.drives.length) summary.push('drives ' + plan.drives.length);
    if (plan.sources.length) summary.push('reads ' + plan.sources.length);
    html += '<button class="group-toggle" data-action="toggle-relations" data-unit="' + esc(u.name) + '">' +
      esc(summary.join(' · ')) + ' ' + (open ? '&#9662;' : '&#9656;') + '</button>';
    if (open) {
      html += section('Drives', plan.drives.map(relationRow).join(''));
      html += section('From', plan.sources.map(relationRow).join(''));
    }
  }
  return html + '</div>';
}

// One relation: an entity's field and what it reads right now. The card
// states the relation; a tap opens the entity, which is where one acts —
// so a driven light does not drag its whole card into the wiring list.
function relationRow(f) {
  var e = f.entity;
  var field = f.aspect ? descriptorField(e, f.aspect) : null;
  var label = e.label + (f.aspect ? ' · ' + ((field && field.label) || f.aspect) : '');
  var value = f.aspect
    ? logic.formatAspect(f.aspect, field, stateValue(e.room, e.name, f.aspect))
    : '';
  return '<div class="rel-row row-clickable" data-action="entity-detail" data-room="' + esc(e.room) +
    '" data-entity="' + esc(e.name) + '"><span>' + esc(label) + '</span>' +
    '<span class="rel-value">' + esc(value) + '</span></div>';
}

// The room card: every entity in the room, controls first.
function renderRoomCard(room, ents) {
  var sorted = ents.slice().sort(function (a, b) { return capRank(a) - capRank(b); });
  var title = room === 'global' ? 'House' : titleCase(room);
  return '<div class="card room-card"><h3 title="' + esc(title) + '">' + esc(title) + '</h3>' + sorted.map(widgetForEntity).join('') + '</div>';
}

function entitiesInRoom(room) {
  return (store.model.entities || []).filter(function (e) { return e.room === room; });
}

function unitByName(name) {
  return (store.model.units || []).filter(function (u) { return u.name === name; })[0];
}

// The compositor: a view's widgets, in order, in one grid. The map is
// mounted after the markup lands (Leaflet owns its container).
function renderWidgets(title, widgets) {
  var persons = personEntities();
  var wantMap = false;
  // One widget's card. A group calls this for each of its members, which
  // is the whole of "a group holds widgets": a member renders exactly as
  // it would on the view itself.
  function card(w) {
    if (w.kind === 'tile') {
      var te = findEntityByName(w.entity);
      return te ? widgetTiles(te, w.aspect) : '';
    }
    if (w.kind === 'chart') {
      var ce = findEntityByName(w.entity);
      return ce ? widgetChart(ce, w.aspect, w.hours || 24) : '';
    }
    if (w.kind === 'entity') {
      var ee = findEntityByName(w.entity);
      return ee ? widgetEntity(ee) : '';
    }
    if (w.kind === 'dial') {
      var de = findEntityByName(w.entity);
      return de ? widgetDial(de, w.aspect) : '';
    }
    if (w.kind === 'burner') {
      var bu = findEntityByName(w.entity);
      return bu ? widgetBurner(bu) : '';
    }
    if (w.kind === 'room') return renderRoomCard(w.room, entitiesInRoom(w.room));
    if (w.kind === 'unit') return widgetUnit(w.unit);
    if (w.kind === 'params') {
      var pu = unitByName(w.unit);
      return pu ? widgetParams(pu) : '';
    }
    if (w.kind === 'people') return widgetPeople(persons);
    if (w.kind === 'deviations') return widgetDeviations();
    if (w.kind === 'map' && persons.length > 0) {
      wantMap = true;
      return renderMapCard(persons);
    }
    if (w.kind === 'group') return widgetGroup(w, card);
    return '';
  }
  var cards = widgets.map(card).join('');
  var html = '<h1 class="view-title">' + esc(title) + '</h1>';
  html += cards ? '<div class="grid">' + cards + '</div>' : '<div class="card"><div class="empty-hint">Nothing to show yet.</div></div>';
  byId('view').innerHTML = html;
  if (wantMap) mountMap(persons);
}

// A group is one card over its members: its label, then each member's own
// card, whose chrome the CSS removes inside a group — a dial with the
// traces that explain it reads as one thing. One level deep; the core
// refuses a group inside a group.
function widgetGroup(w, card) {
  var body = (w.widgets || []).map(card).join('');
  if (!body) return '';
  return '<div class="card group-card">' +
    (w.label ? '<div class="card-label">' + esc(w.label).toUpperCase() + '</div>' : '') +
    body + '</div>';
}

function findEntityByName(name) {
  return (store.model.entities || []).filter(function (e) { return e.name === name; })[0];
}

// ---- view: Now ----
//
// The error signal, not an inventory: people, what is out of the
// ordinary, and the map when anyone has a location. A reading earns a
// tile only by being placed in dashboard.toml.
function renderNow() {
  renderWidgets('Now', [{ kind: 'people' }, { kind: 'deviations' }, { kind: 'map' }]);
}

// ---- view: Not shown ----
//
// The complement of every placement in dashboard.toml (dashboard-logic.js,
// placement): what the family cannot reach from the nav, by room, each
// row its normal widget so it is usable here and not merely listed.
function renderNotShown() {
  var unplaced = logic.placement(store.model);
  var byRoom = {};
  unplaced.entities.forEach(function (e) {
    if (!byRoom[e.room]) byRoom[e.room] = [];
    byRoom[e.room].push(e);
  });
  var rooms = Object.keys(byRoom).sort(function (a, b) {
    // the pseudo-rooms last: the house's own things, and people
    var pa = a === 'global' || a === 'person', pb = b === 'global' || b === 'person';
    return pa === pb ? (a < b ? -1 : 1) : (pa ? 1 : -1);
  });
  var cards = rooms.map(function (room) { return renderRoomCard(room, byRoom[room]); });
  if (unplaced.params.length) {
    cards.push('<div class="card"><h3>Setpoints</h3>' + unplaced.params.map(function (p) {
      return renderParamRow(p.unit, p.param, p.spec);
    }).join('') + '</div>');
  }
  var html = '<h1 class="view-title">Not shown</h1>';
  html += '<div class="muted" style="margin:-8px 0 16px;max-width:62ch;">Everything no view in <code>dashboard.toml</code> places. Placing it there removes it from here.</div>';
  html += cards.length ? '<div class="grid">' + cards.join('') + '</div>' : '<div class="card"><div class="empty-hint">Every entity and setpoint is on a view.</div></div>';
  byId('view').innerHTML = html;
}

// ---- view: Setpoints ----

function paramConstraintCaption(p) {
  var c = p.constraint || {};
  if (p.type === 'time' && (c.after || c.before)) return (c.after || '') + '–' + (c.before || '');
  if ((p.type === 'int' || p.type === 'float') && (c.min !== undefined || c.max !== undefined)) {
    return (c.min !== undefined ? c.min : '') + '–' + (c.max !== undefined ? c.max : '');
  }
  if (p.type === 'enum' && p.values) return p.values.join(' / ');
  return '';
}

function currentParamValue(unitName, pname, p) {
  var key = 'home/config/' + unitName + '/' + pname;
  if (key in store.config) return store.config[key];
  return p.default;
}

function renderParamControl(unitName, pname, p) {
  var value = currentParamValue(unitName, pname, p);
  var id = 'param-' + unitName + '-' + pname;
  if (p.type === 'time') {
    return '<input type="time" id="' + id + '" value="' + esc(value) + '" data-action="param-time" data-unit="' + esc(unitName) + '" data-param="' + esc(pname) + '">';
  }
  if (p.type === 'bool') {
    var on = !!value;
    return '<span class="toggle ' + (on ? 'on' : '') + '" data-action="param-toggle" data-unit="' + esc(unitName) + '" data-param="' + esc(pname) + '" data-value="' + (!on) + '"><span class="knob"></span></span>';
  }
  if (p.type === 'enum' && p.values && p.values.length > logic.SELECT_ABOVE) {
    return '<select class="control" id="' + id + '" data-action="param-select" data-unit="' + esc(unitName) + '" data-param="' + esc(pname) + '">' + p.values.map(function (v) {
      return '<option value="' + esc(v) + '"' + (v === value ? ' selected' : '') + '>' + esc(v) + '</option>';
    }).join('') + '</select>';
  }
  if (p.type === 'enum' && p.values) {
    return '<div class="seg">' + p.values.map(function (v) {
      return '<button data-action="param-enum" data-unit="' + esc(unitName) + '" data-param="' + esc(pname) + '" data-value="' + esc(v) + '" class="' + (v === value ? 'active' : '') + '">' + esc(v) + '</button>';
    }).join('') + '</div>';
  }
  if (p.type === 'int' || p.type === 'float') {
    var c = p.constraint || {};
    var min = c.min !== undefined ? c.min : 0;
    var max = c.max !== undefined ? c.max : 100;
    var step = p.type === 'float' ? 'any' : '1';
    var slideKey = unitName + '|' + pname;
    var shown = localState.sliderDrag[slideKey] !== undefined ? localState.sliderDrag[slideKey] : value;
    return '<div class="slider-row" style="padding-left:0;">' +
      '<input type="range" min="' + esc(min) + '" max="' + esc(max) + '" step="' + step + '" value="' + esc(shown) + '" data-action="param-slider" data-unit="' + esc(unitName) + '" data-param="' + esc(pname) + '">' +
      '<span class="sval">' + esc(shown) + '</span></div>';
  }
  // string fallback
  return '<input type="text" id="' + id + '" value="' + esc(value === undefined ? '' : value) + '" data-action="param-text" data-unit="' + esc(unitName) + '" data-param="' + esc(pname) + '">';
}

function familyEditable(p) { return p.editable_by === 'family'; }

// shared by the Setpoints view and the unit-detail overlay. A param the
// family cannot edit renders its live value against the manifest default
// instead of a control: visible, not writable (/api/param is the gate).
function renderParamRow(unitName, pname, p, bare) {
  var body;
  if (familyEditable(p)) {
    body = '<div>' + renderParamControl(unitName, pname, p) + '</div>';
  } else {
    var value = currentParamValue(unitName, pname, p);
    var offDefault = JSON.stringify(value) !== JSON.stringify(p.default);
    body = '<div class="param-readonly">' + esc(String(value)) +
      (offDefault ? ' <span class="faint">(default ' + esc(String(p.default)) + ')</span>' : '') +
      ' <span class="tier-badge">' + esc(p.editable_by || 'owner') + '</span></div>';
  }
  return '<div class="param-row" id="paramrow-' + unitName + '-' + pname + '"><div class="param-head">' +
    '<span class="name" title="' + esc(unitLabel(unitName)) + ' · ' + esc(pname) + '">' + (bare ? '' : esc(unitLabel(unitName)) + ' · ') + esc(pname) + '</span></div>' +
    body +
    '<div class="param-caption" title="' + esc(JSON.stringify(p.constraint || {})) + '">' + esc(paramConstraintCaption(p)) + '</div></div>';
}

// Setpoints is the family's levers: family-editable params only. Owner
// params show read-only in the unit overlay (Health -> unit).
function renderSetpoints() {
  var rows = [];
  (store.model.units || []).forEach(function (u) {
    var params = u.params || {};
    Object.keys(params).forEach(function (pname) {
      if (familyEditable(params[pname])) rows.push(renderParamRow(u.name, pname, params[pname]));
    });
  });
  var html = '<h1 class="view-title">Setpoints</h1>';
  if (rows.length === 0) {
    html += '<div class="card"><div class="empty-hint">No family-editable parameters.</div></div>';
  } else {
    html += '<div class="card">' + rows.join('') + '</div>';
  }
  byId('view').innerHTML = html;
}

function flashParamRow(unitName, pname) {
  var rowEl = byId('paramrow-' + unitName + '-' + pname);
  if (!rowEl) return;
  rowEl.classList.remove('flash-highlight');
  void rowEl.offsetWidth; // restart the animation
  rowEl.classList.add('flash-highlight');
}

// ---- view: Rooms ----

function allZoneNames() {
  var zones = store.model.zones || {};
  var out = [];
  Object.keys(zones).forEach(function (zone) {
    out.push(zone);
  });
  return out;
}

function roomsInZone(zone) {
  var zones = store.model.zones || {};
  return zones[zone] || [];
}

function renderRooms() {
  var zones = allZoneNames();
  var chips = ['<button class="chip ' + (store.roomsFilter === 'all' ? 'active' : '') + '" data-action="zone-filter" data-zone="all">Whole house</button>'];
  zones.forEach(function (z) {
    chips.push('<button class="chip ' + (store.roomsFilter === z ? 'active' : '') + '" data-action="zone-filter" data-zone="' + esc(z) + '">' + esc(titleCase(z)) + '</button>');
  });

  var allowedRooms = null;
  if (store.roomsFilter !== 'all') {
    allowedRooms = roomsInZone(store.roomsFilter);
  }

  var byRoom = {};
  (store.model.entities || []).forEach(function (e) {
    if (!e.room) return;
    if (e.capability === 'person') return; // the map is their widget, not a room card
    if (allowedRooms && allowedRooms.indexOf(e.room) === -1) return;
    if (!byRoom[e.room]) byRoom[e.room] = [];
    byRoom[e.room].push(e);
  });

  var roomNames = Object.keys(byRoom).sort();
  var cards = roomNames.map(function (room) { return renderRoomCard(room, byRoom[room]); });

  var html = '<h1 class="view-title">Rooms</h1>';
  html += '<div class="chips">' + chips.join('') + '</div>';
  if (cards.length === 0) {
    html += '<div class="card"><div class="empty-hint">No rooms with entities yet.</div></div>';
  } else {
    html += '<div class="grid">' + cards.join('') + '</div>';
  }
  byId('view').innerHTML = html;
}

// ---- view: Health ----

function renderEventRow(ev) {
  var unit = unitNameFromHealthKey(ev.key);
  var extra = Object.keys(ev.value || {}).filter(function (k) { return k !== 'kind'; })
    .map(function (k) { return k + '=' + JSON.stringify(ev.value[k]); }).join(' ');
  var t = new Date((ev.ts || 0) * 1000);
  var tStr = isNaN(t.getTime()) ? '' : t.toLocaleTimeString();
  var tFull = isNaN(t.getTime()) ? '' : t.toLocaleString();
  return '<div class="event-row"><span class="ts" title="' + esc(tFull) + '">' + esc(tStr) + '</span>' +
    esc(unitLabel(unit)) + ' — ' + esc((ev.value && ev.value.kind) || 'event') +
    (extra ? ' (' + esc(extra) + ')' : '') + '</div>';
}

function renderLogLine(entry) {
  var t = new Date((entry.ts_us || 0) / 1000);
  var tStr = isNaN(t.getTime()) ? '' : t.toLocaleTimeString();
  var tFull = isNaN(t.getTime()) ? '' : t.toLocaleString();
  var cls = entry.stream === 'stderr' ? 'log-line stderr' : 'log-line';
  return '<div class="' + cls + '"><span class="ts" title="' + esc(tFull) + '">' + esc(tStr) + '</span>' +
    esc(entry.line) + '</div>';
}

function renderHealth() {
  var units = store.model.units || [];
  var cards = units.map(function (u) {
    var key = 'home/health/' + u.name;
    var h = store.health[key] || {};
    var status = h.status || 'stopped';
    var meta = [];
    if (h.restarts !== undefined && h.restarts !== null) meta.push('restarts: ' + h.restarts);
    if (h.last_exit_code !== undefined && h.last_exit_code !== null) meta.push('last exit: ' + h.last_exit_code);
    return '<div class="card health-card clickable" data-action="unit-detail" data-unit="' + esc(u.name) + '"><div class="health-head">' +
      '<span class="name" title="' + esc(u.label) + '">' + esc(u.label) + '</span>' +
      '<span class="status-badge" title="' + esc(healthTooltip(h)) + '"><span class="status-glyph status-' + esc(status) + '">' + statusGlyph(status) + '</span>' + esc(status) + '</span></div>' +
      (meta.length ? '<div class="health-meta">' + esc(meta.join(' · ')) + '</div>' : '') +
      '</div>';
  });

  var events = store.events.slice().sort(function (a, b) { return b.ts - a.ts; });
  var eventRows = events.map(renderEventRow);

  var html = '<h1 class="view-title">Health</h1>';
  html += '<div class="grid">' + cards.join('') + '</div>';
  html += '<div class="card event-feed"><div class="card-label">Events</div>';
  html += eventRows.length ? eventRows.join('') : '<div class="empty-hint">No events yet this session.</div>';
  html += '</div>';
  byId('view').innerHTML = html;
}

// ---- view dispatch ----

var GENERATED = { now: renderNow, setpoints: renderSetpoints, rooms: renderRooms };

function renderView() {
  var current = currentView();
  var view = logic.viewsOf(store.model).filter(function (v) { return v.name === current; })[0];
  if (current === 'health') renderHealth();
  else if (current === 'notshown') renderNotShown();
  else if (view && view.kind) GENERATED[view.kind]();
  else if (view) renderWidgets(view.label, view.widgets);
  wireChartInteractions(byId('view'));
}

function render() {
  renderShell();
  renderView();
  if (overlay.open) renderOverlayContent();
  markPendingControls();
}

/* The aspect a control commands. Most carry it explicitly; the three
 * single-aspect actions imply it, and their markup predates this. The
 * light sliders name theirs `data-kind`. */
var CONTROL_ASPECTS = {
  'toggle-light': 'on',
  'toggle-lock': 'locked',
  'climate-step': 'setpoint',
  'brightness-step': 'brightness'
};

function controlAspect(el) {
  var action = el.getAttribute('data-action');
  if (CONTROL_ASPECTS[action]) return CONTROL_ASPECTS[action];
  if (action === 'slider') return el.getAttribute('data-kind');
  return el.getAttribute('data-aspect');
}

/* Chrome applied after every render rather than baked into each control's
 * markup: the views rebuild their HTML wholesale, so the pending state has
 * to be re-applied to the new nodes anyway, and doing it in one pass keeps
 * it out of a dozen render paths. */
function markPendingControls() {
  var nodes = document.querySelectorAll('[data-action][data-room][data-entity]');
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var aspect = controlAspect(el);
    if (!aspect) continue;
    var entry = logic.pendingFor(pending, el.getAttribute('data-room'),
      el.getAttribute('data-entity'), aspect);
    // A range input is exempt from the freeze. The missing-feedback
    // problem is a tap that appears to do nothing; a slider already moves
    // under the finger, and taking it away mid-gesture is worse than the
    // silence. It is still tracked, so a refusal or a timeout still says
    // so.
    if (el.tagName !== 'INPUT') el.classList.toggle('cmd-pending', !!entry);
    if (entry) el.setAttribute('aria-busy', 'true');
    else el.removeAttribute('aria-busy');
  }
}

// ---- detail overlay: open/close plumbing ----

/* Whether the detail overlay covers the window. A per-viewer
 * convenience, so it lives in localStorage rather than on the bus: it is
 * not house state, nobody else's browser should learn it, and a reader
 * who widened it once means it next time too. Every access is guarded —
 * a private window or blocked site data throws on the property itself,
 * and a chart is not worth a blank page. */
var WIDE_KEY = 'homeostat.overlay.wide';

function overlayWide() {
  try {
    return window.localStorage.getItem(WIDE_KEY) === '1';
  } catch (e) {
    return false;
  }
}

function setOverlayWide(wide) {
  try {
    window.localStorage.setItem(WIDE_KEY, wide ? '1' : '0');
  } catch (e) {
    // no storage: the choice still applies to this overlay, just not the next
  }
  applyOverlayWide(wide);
}

function applyOverlayWide(wide) {
  byId('overlay-panel').classList.toggle('wide', wide);
  byId('overlay-wide').setAttribute('aria-pressed', wide ? 'true' : 'false');
  // The charts read their own width from the DOM, so they have to be
  // rebuilt rather than merely restyled.
  if (overlay.open) renderOverlayContent();
}

function showOverlay() {
  var wasOpen = overlay.open;
  overlay.open = true;
  applyOverlayWide(overlayWide());
  renderOverlayContent();
  byId('overlay-backdrop').classList.add('show');
  var panel = byId('overlay-panel');
  panel.classList.add('show');
  if (!wasOpen) {
    history.pushState({ homeostatOverlay: true }, '', location.pathname + location.search + location.hash);
  }
  panel.focus();
}

function hideOverlayUI() {
  overlay.open = false;
  overlay.type = null;
  mountCameraLive(null);  // hiding the panel only drops a class; the stream would outlive it
  byId('overlay-backdrop').classList.remove('show');
  byId('overlay-panel').classList.remove('show');
}

function closeOverlay() {
  if (history.state && history.state.homeostatOverlay) {
    history.back(); // triggers popstate below, which actually hides the panel
  } else {
    hideOverlayUI();
  }
}

window.addEventListener('popstate', function (e) {
  if (!e.state || !e.state.homeostatOverlay) {
    hideOverlayUI();
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && overlay.open) closeOverlay();
});

// ---- detail overlay: open <type> ----

function openHistoryDetail(room, entityName, aspect) {
  var entity = findEntity(room, entityName);
  if (!entity) return;
  overlay.type = 'history';
  overlay.entity = entity;
  overlay.aspect = aspect;
  // The descriptor's kind decides the shape where it has one, and its
  // word is final — an enum coded as integers is runs, not a curve.
  // Undescribed, the live value's type decides; without a value yet (a
  // fresh page, a sensor that has not reported) that is a guess the
  // first points fetched settle (fetchHistoryRange).
  var live = stateValue(room, entityName, aspect);
  var field = descriptorField(entity, aspect);
  var described = !!(field && (field.kind === 'boolean' || field.kind === 'enum'));
  overlay.shape = logic.historyShape(live, field);
  overlay.shapeSettled = described || live !== undefined;
  overlay.range = 24;
  overlay.rangeData = {};
  overlay.cmdData = {};
  overlay.said = false;
  overlay.issues = [];
  overlay.pinned = null;
  overlay.lastPoints = null;
  // Sources are this entity's, so the toggle and the fetched contributor
  // history do not survive into the next overlay.
  overlay.withSources = false;
  overlay.sourceData = {};
  overlay.sourceEvents = {};
  fetchHistoryRange(entityName, aspect, 24, overlay.shape);
  showOverlay();
}

function openEntityDetail(room, entityName) {
  var entity = findEntity(room, entityName);
  if (!entity) return;
  overlay.type = 'entity';
  overlay.entity = entity;
  overlay.expanded = {};
  showOverlay();
}

function openUnitDetail(unitName) {
  overlay.type = 'unit';
  overlay.unit = unitName;
  fetchUnitLog(unitName);
  showOverlay();
}

// ---- detail overlay: render <type> ----

function renderOverlayContent() {
  if (!overlay.open) return;
  var r;
  if (overlay.type === 'history') r = renderHistoryDetailBody();
  else if (overlay.type === 'entity') r = renderEntityDetailBody();
  else if (overlay.type === 'unit') r = renderUnitDetailBody();
  else r = { title: '', body: '' };
  byId('overlay-title').textContent = r.title;
  // Every state delta re-runs this, so the swap happens either side of
  // the mount rather than over it. Carrying the player across an
  // innerHTML swap is not enough: detaching a <video-rtc> and putting it
  // back re-runs its connectedCallback, which seeks to the live edge and
  // calls play() — a stutter and a flash of native controls per delta.
  byId('overlay-head').innerHTML = r.body;
  byId('overlay-rest').innerHTML = r.rest || '';
  mountCameraLive(r.camera);
  wireChartInteractions(byId('overlay-body'));
}

// The live player for `name`, or none. Mounting is idempotent: the same
// camera leaves the running element untouched, which is the whole point.
function mountCameraLive(name) {
  var mount = byId('overlay-mount');
  var live = mount.firstElementChild;
  if (live && live.getAttribute('data-entity') === name) return;
  mount.innerHTML = '';  // a different camera, or none: drop the stream
  if (!name) return;
  live = document.createElement('video-rtc');
  live.setAttribute('data-entity', name);
  live.mode = 'mse';
  live.src = '/api/camera/' + encodeURIComponent(name) + '/live';
  mount.appendChild(live);
}

function statItem(label, value, aspect) {
  return statText(label, value === null ? '—' : formatChartValue(aspect, value));
}

function statText(label, text) {
  return '<div class="stat-item"><div class="stat-value">' + esc(text) + '</div><div class="stat-label">' + label + '</div></div>';
}

function fmtDuration(ms) {
  var mins = Math.round(ms / 60000);
  if (mins < 60) return mins + ' min';
  var h = Math.floor(mins / 60), m = mins % 60;
  if (h < 48) return m ? h + ' h ' + m + ' min' : h + ' h';
  return Math.round(h / 24) + ' d';
}

function rangeStats(points) {
  var vals = (points || []).map(function (p) { return p.value; }).filter(function (v) { return typeof v === 'number'; });
  if (vals.length === 0) return { latest: null, min: null, max: null, avg: null };
  var sum = 0;
  vals.forEach(function (v) { sum += v; });
  return {
    latest: points[points.length - 1].value,
    min: Math.min.apply(null, vals),
    max: Math.max.apply(null, vals),
    avg: sum / vals.length
  };
}

function renderHistoryDetailBody() {
  var entity = overlay.entity, aspect = overlay.aspect;
  var multi = aspectsFor(entity).length > 1;
  var label = entity.label + (multi ? ' · ' + titleCase(aspect) : '');

  var chips = RANGE_PRESETS.map(function (rp) {
    return '<button data-action="range-chip" data-hours="' + rp.hours + '" class="' + (overlay.range === rp.hours ? 'active' : '') + '">' + rp.label + '</button>';
  }).join('');
  // The second row appears only where there is a future to have said
  // anything about, so an ordinary sensor's overlay is unchanged.
  var modeChips = forecastsOf(entity, aspect).length
    ? '<div class="seg" style="margin-top:8px;">' +
      '<button data-action="forecast-mode" data-said="0" class="' + (overlay.said ? '' : 'active') + '">now</button>' +
      '<button data-action="forecast-mode" data-said="1" class="' + (overlay.said ? 'active' : '') + '">what we said</button>' +
      '</div>'
    : '';
  // And a row for what the value is derived from, where anything is
  // declared. Owner work like the braid, so it lives here rather than on
  // a tile: a family wants the temperature, not which sensor was low.
  var sourceChips = overlay.shape !== 'timeline' && contributorsOf(entity, aspect).length
    ? '<div class="seg" style="margin-top:8px;">' +
      '<button data-action="source-mode" data-on="0" class="' + (overlay.withSources ? '' : 'active') + '">value</button>' +
      '<button data-action="source-mode" data-on="1" class="' + (overlay.withSources ? 'active' : '') + '">with sources</button>' +
      '</div>'
    : '';

  var rd = overlay.rangeData[overlay.range];
  var loaded = !!(rd && rd.loaded);
  var points = loaded ? rd.points : (overlay.lastPoints || []);
  var win = rd && rd.window ? rd.window : { from: Date.now() - overlay.range * 3600e3, to: Date.now() };
  var field = descriptorField(entity, aspect);
  // The viewBox height is baked when the chart is built, so a taller
  // chart is a rebuild, not a restyle — which is why toggling the width
  // re-renders rather than just swapping a class.
  var wide = overlayWide();
  var chartHtml, statsHtml;
  if (overlay.shape === 'timeline') {
    chartHtml = buildTimeline('detail-chart', points, { height: wide ? 96 : 64, sizeClass: wide ? 'chart-timeline-wide' : 'chart-timeline', aspect: aspect, field: field, window: win });
    var tl = logic.timelineStats(logic.timelineRuns(points, win.from, win.to));
    statsHtml = '<div class="stat-row">' +
      statText('Now', tl.latest === null ? '—' : logic.formatAspect(aspect, field, tl.latest)) +
      (tl.onMs === null ? '' : statText('On', fmtDuration(tl.onMs) + ' of ' + fmtDuration(win.to - win.from))) +
      statText('Changes', String(tl.changes)) + '</div>';
  } else {
    chartHtml = buildChart('detail-chart', points, {
      height: wide ? 440 : 220, sizeClass: wide ? 'chart-detail-wide' : 'chart-detail',
      aspect: aspect, gridlines: true, area: true, yLabels: true, window: win,
      // In "what we said" the current belief steps aside: drawing it over
      // the braid would make one issue look special for no reason.
      forecast: overlay.said ? null : forecastsOf(entity, aspect),
      issues: overlay.said ? overlay.issues : null,
      pinned: overlay.pinned,
      // Contributors stand down behind the braid: two greys on one chart,
      // one per issue and one per source, would read as one set of lines.
      contributors: overlay.said ? null : drawnSources(entity, aspect, overlay.range)
    });
    var stats = rangeStats(points);
    statsHtml = '<div class="stat-row">' +
      statItem('Latest', stats.latest, aspect) + statItem('Min', stats.min, aspect) +
      statItem('Max', stats.max, aspect) + statItem('Avg', stats.avg, aspect) + '</div>';
  }

  // The four stats describe the RECORDED window the chips select, so a
  // drawn forecast can peak above the MAX beside it — which reads as a
  // contradiction unless the horizon says its own extreme out loud.
  // One caption per source: "where the horizon goes" is a claim, and
  // averaging two providers into one sentence would state a horizon
  // neither of them predicted.
  var horizonHtml = '';
  if (!overlay.said) {
    var beliefs = forecastsOf(entity, aspect);
    horizonHtml = beliefs.map(function (b) {
      var ahead = horizonCaption(aspect, field, b.forecast, Date.now());
      if (!ahead) return '';
      var who = beliefs.length > 1 ? esc(b.source) + ' · ' : '';
      return '<div class="chart-note">ahead · ' + who + esc(ahead) + '</div>';
    }).join('');
  }
  var braidHtml = '';
  if (overlay.said) {
    braidHtml = '<div class="chart-note" id="braid-column"></div>' +
      '<div class="chart-note">' + esc(
        overlay.issuesLoading ? 'reading what we said\u2026'
          : overlay.issues.length
            ? overlay.issues.length + ' forecast' + (overlay.issues.length === 1 ? '' : 's') +
              (function () {
                // Issues from several providers in one braid would make
                // "they disagree" and "it drifted" look the same, so the
                // count says how many sources are mixed in.
                var seen = {};
                overlay.issues.forEach(function (f) { if (f.source) seen[f.source] = 1; });
                var n = Object.keys(seen).length;
                return n > 1 ? ' from ' + n + ' sources' : '';
              })() +
              ' kept for this window' + (overlay.issues.length >= BRAID_ISSUES ? ' (newest ' + BRAID_ISSUES + ')' : '') +
              (overlay.pinned ? ' \u00b7 one pinned \u2014 tap it again to release' : ' \u00b7 tap a line to pin it')
            : 'nothing kept for this window \u2014 the recorder may not subscribe home/forecast/**'
      ) + '</div>';
  }
  // The legend doubles as the scrub readout: with no cursor it names the
  // sources, with one it says what each read at that instant. Colour
  // cannot tell them apart — they are all the same grey, deliberately —
  // so naming them is the identification.
  var legendHtml = '';
  var drawn = overlay.said ? null : drawnSources(entity, aspect, overlay.range);
  if (drawn) {
    var usage = sourceUsageNow(entity, aspect, overlay.range,
                               contributorsOf(entity, aspect));
    legendHtml = '<div class="chart-note source-legend" id="sources-legend">' +
      drawn.map(function (c) {
        // A contributor that has dropped out still draws — the line
        // stopping IS the diagnosis — but it must not read as live.
        // Two different ways to be out: its own device is gone, or the
        // computation is choosing not to use it.
        var down = stateValue(contributorRoom(c), c.entity, 'available') === false;
        var use = usage[c.name];
        var excluded = use && use.used === false;
        var since = excluded && use.since
          ? ' since ' + formatChartClock(use.since / 1000)
          : '';
        return '<span' + (c.note ? ' title="' + esc(c.note) + '"' : '') + '>' +
          esc(c.label) +
          (down ? ' \u00b7 unavailable' : '') +
          (excluded ? ' \u00b7 not used' + since : '') +
          (c.note ? ' \u00b7 ' + esc(c.note) : '') + '</span>';
      }).join('') + '</div>' +
      '<div class="chart-note" id="sources-column"></div>';
  } else if (overlay.withSources && !overlay.said && contributorsOf(entity, aspect).length) {
    legendHtml = '<div class="chart-note">reading the sources\u2026</div>';
  }
  var body = '<div class="seg">' + chips + '</div>' + modeChips + sourceChips +
    '<div class="' + (loaded ? '' : 'chart-loading') + '">' + chartHtml + statsHtml + horizonHtml + '</div>' +
    legendHtml + braidHtml + commandStrip(aspect, field, win);
  return { title: label, body: body };
}

/* What was asked, under what happened. An aspect nothing ever commanded
 * has no strip at all — this is the recorder's cmd series, so the strip
 * appears exactly where there is an audit to show. */
function commandStrip(aspect, field, win) {
  var cd = overlay.cmdData[overlay.range];
  if (!cd || !cd.loaded || !cd.points.length) return '';
  var runs = logic.timelineRuns(cd.points, win.from, win.to);
  var latest = cd.points[cd.points.length - 1];
  return '<div class="card-label" style="margin-top:20px;">Commanded</div>' +
    buildTimeline('detail-cmd', cd.points, { height: 28, sizeClass: 'chart-commands', aspect: aspect, field: field, window: win }) +
    '<div class="chart-note">' + esc(runs.length + (runs.length === 1 ? ' command' : ' commands') +
      ' · last ' + logic.formatAspect(aspect, field, latest.value) + ' at ' + formatChartTime(latest.ts)) + '</div>';
}

// One planned row of an entity's detail: the label and the value, plus the
// control the descriptor declared — the param-control shapes, wired to
// /api/cmd instead of /api/param. A numeric row without a control taps
// through to its history.
function renderAspectRow(entity, r) {
  var attrs = ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-aspect="' + esc(r.aspect) + '"';
  var value = aspectValueSpan(r);
  if (!r.control) {
    // a chart for a number, a timeline for a bool or a string
    return '<div class="aspect-row described row-clickable" data-action="history-detail"' + attrs + '>' +
      '<span class="aspect-label">' + esc(r.label) + '</span>' + value + '</div>';
  }
  // The label taps through to history even though the row carries a
  // control. A commanded aspect is exactly the one whose past a reader
  // wants — and until now it was the one aspect with no way to reach it,
  // because the row's click belongs to the control. The control's own
  // buttons still win: closest('[data-action]') takes the innermost.
  var dial = r.control.kind === 'dial';
  return '<div class="aspect-row described' + (dial ? ' dial-row' : '') + '">' +
    '<span class="aspect-label linked" data-action="history-detail"' + attrs + '>' + esc(r.label) + '</span>' +
    renderAspectControl(entity, r, true) + '</div>';
}

function aspectValueSpan(r) {
  return '<span class="aspect-value' + (r.stale ? ' stale' : '') + '" title="' + esc(r.aspect) + '">' + esc(r.display) + '</span>' +
    (r.stale ? '<span class="stale-mark">stale</span>' : '');
}

// A thermostat dial: the target on a 240° arc from min to max, the
// current reading beneath it when the entity has one, ± at the arc's
// ends. The buttons carry the same action attributes as the compact
// stepper, so the pending/held/timeout stages (#94) apply unchanged.
function renderDial(action, attrs, o) {
  var span = (o.max - o.min) || 1;
  var f = typeof o.value === 'number' ? Math.max(0, Math.min(1, (o.value - o.min) / span)) : 0;
  var point = function (deg) {
    var a = deg * Math.PI / 180;
    return { x: 60 + 46 * Math.cos(a), y: 60 + 46 * Math.sin(a) };
  };
  var arc = function (fromDeg, toDeg) {
    var a = point(fromDeg), b = point(toDeg);
    return 'M ' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' A 46 46 0 ' + (toDeg - fromDeg > 180 ? 1 : 0) + ' 1 ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
  };
  var end = -210 + 240 * f;
  var knob = point(end);
  var disabled = o.disabled ? ' disabled' : '';
  return '<div class="dial">' +
    '<svg viewBox="0 0 120 120" aria-hidden="true"><path class="dial-track" d="' + arc(-210, 30) + '"/>' +
    (f > 0 ? '<path class="dial-arc" d="' + arc(-210, end) + '"/>' : '') +
    '<circle class="dial-knob" cx="' + knob.x.toFixed(1) + '" cy="' + knob.y.toFixed(1) + '" r="6"/></svg>' +
    '<div class="dial-readout"><div class="dial-target">' + esc(o.display) + '</div>' +
    (o.current ? '<div class="dial-current">' + esc(o.current) + '</div>' : '') + '</div>' +
    '<div class="dial-buttons">' +
    '<button class="step-btn" data-action="' + action + '"' + attrs + ' data-delta="' + esc(-o.step) + '"' + disabled + ' aria-label="lower">&minus;</button>' +
    '<button class="step-btn" data-action="' + action + '"' + attrs + ' data-delta="' + esc(o.step) + '"' + disabled + ' aria-label="raise">+</button>' +
    '</div></div>';
}

// The first temperature reading the entity has that is not itself the
// commanded aspect — what the dial shows as "now".
function currentTemperatureOf(entity, except) {
  var rows = [];
  logic.aspectPlan(entity, store.state, store.aspects[entity.name], false).forEach(function (s) {
    s.rows.forEach(function (r) { rows.push(r); });
  });
  var field = function (r) { return descriptorField(entity, r.aspect); };
  var hit = rows.filter(function (r) {
    return r.aspect !== except && r.numeric && !r.control &&
      ((field(r) && field(r).kind === 'temperature') || (!field(r) && r.aspect.indexOf('temperature') !== -1));
  })[0];
  return hit ? hit.display + ' now' : '';
}

// The control markup for a planned row with a control: the param-control
// shapes wired to /api/cmd. `big` is the overlay and the dial widget; a
// room card gets every control's compact form (a dial's is a stepper).
function renderAspectControl(entity, r, big) {
