      marker = L.marker(latlon, { icon: personDivIcon(e) }).addTo(map);
      mapState.markers[key] = marker;
    } else {
      marker.setLatLng(latlon);
    }
    marker.bindPopup(personPopupHtml(e));

    var accuracy = stateValue(e.room, e.name, 'accuracy');
    var circle = mapState.circles[key];
    if (typeof accuracy === 'number') {
      if (!circle) {
        mapState.circles[key] = L.circle(latlon, { radius: accuracy, color: 'var(--accent)', weight: 1, fillOpacity: .1 }).addTo(map);
      } else {
        circle.setLatLng(latlon);
        circle.setRadius(accuracy);
      }
    } else if (circle) {
      map.removeLayer(circle);
      delete mapState.circles[key];
    }
  });

  Object.keys(mapState.markers).forEach(function (key) {
    if (seen[key]) return;
    map.removeLayer(mapState.markers[key]);
    delete mapState.markers[key];
    if (mapState.circles[key]) { map.removeLayer(mapState.circles[key]); delete mapState.circles[key]; }
  });

  // Fit once, when fixes first appear — repeating this on every later
  // delta would fight anyone panning the map.
  if (bounds.length && !mapState.fitted) {
    if (bounds.length === 1) map.setView(bounds[0], 16);
    else map.fitBounds(bounds, { maxZoom: 16, padding: [24, 24] });
    mapState.fitted = true;
  }
}

function mountMap(persons) {
  var slot = byId('map-slot');
  if (!slot) return;
  ensureMap();
  slot.appendChild(mapState.container);
  updateMapMarkers(persons);
  mapState.map.invalidateSize();
}

function renderMapCard(persons) {
  var noFix = persons.filter(function (e) { return !personLatLon(e); });
  var hint = store.model.tiles ? '' : html`<div class="map-hint">no tile extract configured</div>`;
  var noFixHtml = noFix.length
    ? html`<div class="map-nofix">${noFix.map(function (e) { return e.label; }).join(', ')} &mdash; no fix yet</div>`
    : '';
  return html`<div class="card span-all"><div class="card-label">Map</div>
    <div id="map-slot"></div>${hint}${noFixHtml}</div>`;
}

// ---- widgets ----
//
// A view is a list of widgets (dashboard.toml, or the generated views'
// implicit lists), each a card built from what the page already renders.
// The dashboard owns every one of these; a widget places, never draws.

// Signal tiles: one per reading of the entity, or the one reading named.
// Which readings, in what order, is the descriptor's say — the same rows
// as the entity's sensor card (dashboard-logic.js, sensorCardPlan).
function widgetTiles(entity, aspect) {
  var rows = logic.sensorCardPlan(entity, store.state, store.aspects[entity.name]);
  if (aspect) rows = rows.filter(function (r) { return r.aspect === aspect; });
  return html`${rows.map(function (r) {
    var sk = entity.name + '|' + r.aspect;
    ensureHistory(entity.name, r.aspect);
    var s = localState.sparklines[sk];
    var forecast = liveForecastsOf(entity, r.aspect);
    var spark = s && s.loaded ? buildChart('tile-' + sk, s.points, { height: 36, sizeClass: 'chart-tile', aspect: r.aspect, area: true, window: s.window, forecast: forecast }) : '';
    // A horizon says where a reading is going; today's range says where
    // it has been. The forecast wins the line when there is one, because
    // a number you can still act on beats one you cannot. A tile is
    // family-tier and has room for ONE claim, so with several sources it
    // falls back to the range rather than picking a provider to believe
    // — comparing them is owner work and lives in the overlay.
    // A belief carries when it was said, always; a stale one is marked,
    // because a caption the reader has to do arithmetic on is not a
    // caption a phone can be read from in three seconds.
    var ahead = forecast.length === 1
      ? horizonCaption(r.aspect, descriptorField(entity, r.aspect), forecast[0].forecast, Date.now())
      : '';
    var aged = forecast.length === 1 && logic.forecastFreshness(forecast[0].forecast, Date.now()).stale;
    var caption = forecast.length === 1
      ? [ahead, issuedCaption(forecast[0].forecast)].filter(Boolean).join(' \u00b7 ')
      : '';
    // With no belief to draw — or several, which a tile has no room to
    // tell apart — the caption is today's range.
    if (!caption && s && s.loaded) caption = minMaxCaption(s.points);
    // The separator is the character, not the entity: the label is text,
    // escaped whole, so "&middot;" here would print as itself.
    var tileLabel = entity.label + (rows.length > 1 ? ' \u00b7 ' + r.label : '');
    return html`<div class="card tile clickable" data-action="history-detail" data-room="${entity.room}" data-entity="${entity.name}" data-aspect="${r.aspect}">
      <div class="card-label" title="${entity.label}">${tileLabel.toUpperCase()}</div>
      <div class="big${r.stale ? ' stale' : ''}">${r.display}</div>${spark}
      <div class="caption">${caption}${aged ? html`<span class="stale-mark">stale</span>` : ''}</div></div>`;
  })}`;
}

// One aspect's history over a window, as a card.
function widgetChart(entity, aspect, hours) {
  var key = entity.name + '|' + aspect + '|' + hours;
  var field = descriptorField(entity, aspect);
  // The same rule as the detail overlay: a described enum or boolean is
  // runs, so the card draws a timeline and asks the recorder for changes.
  var shape = logic.historyShape(stateValue(entity.room, entity.name, aspect), field);
  var s = localState.charts[key];
  if (!s) {
    localState.charts[key] = { points: [], loaded: false, loading: true };
    fetchHistory(entity.name, aspect, hours, shape).then(function (loaded) {
      localState.charts[key] = loaded;
      scheduleRender();
    });
    s = localState.charts[key];
  }
  var value = stateValue(entity.room, entity.name, aspect);
  var beliefs = shape === 'timeline' ? [] : liveForecastsOf(entity, aspect);
  var chart = !s.loaded ? ''
    : shape === 'timeline'
      ? buildTimeline('chart-' + key, s.points, { height: 64, sizeClass: 'chart-timeline', aspect: aspect, field: field, window: s.window })
      : buildChart('chart-' + key, s.points, { height: 120, sizeClass: 'chart-card', aspect: aspect, area: true, gridlines: true, yLabels: true, window: s.window, forecast: beliefs });
  // The same rule as a tile: a drawn belief says when it was said. One
  // line for one source; with several, the overlay names each.
  var beliefCaption = beliefs.length === 1
    ? html`<div class="caption">${issuedCaption(beliefs[0].forecast)}
      ${logic.forecastFreshness(beliefs[0].forecast, Date.now()).stale
        ? html`<span class="stale-mark">stale</span>` : ''}</div>`
    : '';
  return html`<div class="card tile clickable span-all" data-action="history-detail" data-room="${entity.room}" data-entity="${entity.name}" data-aspect="${aspect}">
    <div class="card-label">${(entity.label + ' · ' + ((field && field.label) || aspect)).toUpperCase()} <span class="faint">${hours >= 48 ? Math.round(hours / 24) + 'd' : hours + 'h'}</span></div>
    <div class="big">${logic.formatAspect(aspect, field, value)}</div>${chart}${beliefCaption}</div>`;
}

// People: the person entities, home or away from their presence aspect;
// failing that, when they were last seen. Motion sensors are rooms'
// business, not people.
function widgetPeople(persons) {
  if (persons.length === 0) return '';
  var pRows = persons.map(function (e) {
    var st = logic.personStatus(store.state, e);
    var detail = st.home === true ? 'Home' : st.home === false ? 'Away'
      : st.seenAt !== undefined ? 'last fix ' + relTime(st.seenAt) : 'no signal';
    return html`<div class="row-clickable" data-action="entity-detail" data-room="${e.room}" data-entity="${e.name}" style="display:flex;align-items:center;gap:6px;padding:3px 0;">
      <span class="status-dot ${st.home === true ? 'dot-on' : 'dot-off'}"></span>
      <span>${e.label} &middot; ${detail}</span></div>`;
  });
  return html`<div class="card tile"><div class="card-label">People</div>${pRows}</div>`;
}

// Out of the ordinary — the rules live in dashboard-logic.js; here each
// record's target maps onto the tap wiring.
function widgetDeviations() {
  var deviations = logic.computeDeviations(
    store.model, store.state, store.health, store.config, store.aspects, store.holds
  );
  // A hold ends on its own, and nothing arrives on the bus to say so — the
  // arbiter republishes, but a browser that missed it (or a clock a second
  // ahead) would leave the row standing. Re-render at the earliest
  // deadline drawn, and the row simply is not there next time.
  scheduleHoldExpiry(deviations);

  function deviationAttrs(target) {
    if (target.type === 'unit') {
      return html`data-action="unit-detail" data-unit="${target.unit}"`;
    }
    if (target.type === 'entity') {
      return html`data-action="entity-detail" data-room="${target.room}" data-entity="${target.entity}"`;
    }
    if (target.type === 'setpoint') {
      return html`data-action="goto-setpoint" data-unit="${target.unit}" data-param="${target.param}"`;
    }
    return html`data-action="goto-rooms"`;
  }

  var devHtml;
  if (deviations.length === 0) {
    devHtml = html`<div class="equilibrium"><span class="eq-dot"></span>In equilibrium.</div>`;
  } else {
    devHtml = deviations.map(function (d) {
      return html`<div class="dev-row row-clickable" ${deviationAttrs(d.target)}>
        <div class="dev-main"><div class="title" title="${d.title}">${d.title}</div>
        ${d.detail ? html`<div class="detail">${d.detail}</div>` : ''}</div>
        ${d.button ? html`<button class="dev-btn" data-action="${d.button.action}">${d.button.label}</button>` : ''}
        <div class="dev-tag">${d.tag}</div></div>`;
    });
  }
  return html`<div class="card span-all"><div class="card-label">Out of the ordinary${deviations.length ? ' — ' + deviations.length : ''}</div>${devHtml}</div>`;
}

// A unit's family-editable parameters as one card.
function widgetParams(unit) {
  var params = unit.params || {};
  var rows = Object.keys(params).filter(function (p) { return familyEditable(params[p]); })
    .map(function (p) { return renderParamRow(unit.name, p, params[p], true); });
  return html`<div class="card"><div class="card-label">${unit.label}</div>
    ${rows.length ? rows : html`<div class="empty-hint">No family-editable parameters.</div>`}</div>`;
}

// A thermostat dial as a card: the described temperature command named
// (or the first one), else the climate capability's own setpoint. An
// entity with neither falls back to its own row.
function widgetDial(entity, aspect) {
  var rows = [];
  logic.aspectPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity), houseControls()).forEach(function (s) {
    s.rows.forEach(function (r) { rows.push(r); });
  });
  var row = rows.filter(function (r) { return r.control && r.control.kind === 'dial' && (!aspect || r.aspect === aspect); })[0];
  var body = row ? renderAspectControl(entity, row, true)
    : entity.capability === 'climate' ? widgetForClimate(entity, true)
    : widgetForEntity(entity);
  return html`<div class="card clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <div class="card-label" title="${entity.label}">${entity.label.toUpperCase()}${row ? html` &middot; ${row.label.toUpperCase()}` : ''}</div>${body}</div>`;
}

// ---- widget: burner ----
//
// The `burner` vocabulary as one card
// (docs/design.md#burners-and-interlocks): its two commands — the family
// lever `on` and the output `power_level` — over the two temperatures an
// interlock reads, each with its day. Nothing dialectal: run-state codes
// and a firmware's own readings stay in the entity's overlay, which the
// card taps through to.
// A descriptor keeps the firmware's field name in parentheses — "flue
// (smoke_temp)" — which the overlay shows and a card has no room for, the
// same trim the room card makes (dashboard-logic.js, cardPlan).
function shortLabel(label) { return label.replace(/\s*\([^)]*\)$/, ''); }

var BURNER_READINGS = ['flue_temperature', 'boiler_temperature'];
var BURNER_COMMANDS = ['on', 'power_level'];

function widgetBurner(entity) {
  var rows = {};
  logic.aspectPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity), houseControls())
    .forEach(function (s) { s.rows.forEach(function (r) { rows[r.aspect] = r; }); });

  var lit = rows.on && rows.on.value === true;
  var state = rows.available && rows.available.value === false ? 'offline'
    : !rows.on || rows.on.value === undefined ? 'no signal'
    : lit ? 'burning' : 'idle';

  var controls = BURNER_COMMANDS.map(function (aspect) {
    var r = rows[aspect];
    if (!r) return '';
    return html`<div class="burner-control"><span>${shortLabel(r.label)}</span>
      ${r.control ? renderAspectControl(entity, r) : aspectValueSpan(r)}</div>`;
  });

  var readings = BURNER_READINGS.map(function (aspect) {
    var r = rows[aspect];
    if (!r) return '';
    ensureHistory(entity.name, aspect);
    var sk = entity.name + '|' + aspect;
    var hist = localState.sparklines[sk];
    var spark = hist && hist.loaded
      ? buildChart('burner-' + sk, hist.points, { height: 36, sizeClass: 'chart-tile', aspect: aspect, area: true, window: hist.window })
      : '';
    return html`<div class="burner-reading row-clickable" data-action="history-detail" data-room="${entity.room}" data-entity="${entity.name}" data-aspect="${aspect}">
      <div class="burner-reading-head"><span>${shortLabel(r.label)}</span><b>${r.display}</b></div>
      ${spark}</div>`;
  });

  // The head taps through to the entity: the run-state codes and the
  // device's own readings live there, and the card does not repeat them.
  return html`<div class="card burner-card">
    <div class="burner-head row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <div class="card-label" style="margin:0;" title="${entity.label}">${entity.label.toUpperCase()}</div>
    <span class="burner-state${lit ? ' lit' : ''}">${state}</span></div>
    ${controls}${readings}</div>`;
}

// An entity's own row — its control or its readings — as a card.
function widgetEntity(entity) {
  return html`<div class="card">${widgetForEntity(entity)}</div>`;
}

// A unit's card (dashboard-logic.js, unitCardPlan): head, then the
// relations the manifest and the grant table already state. Each section
// is drawn only when it has members; the labels are the page's words, not
// the manifest's, and the card can say nothing the manifest did not.
function widgetUnit(unitName) {
  var plan = logic.unitCardPlan(store.model, unitName);
  if (!plan) return '';
  var u = plan.unit;
  var h = store.health['home/health/' + u.name] || {};
  var status = h.status || 'stopped';
  var parts = [html`<div class="unit-head row-clickable" data-action="unit-detail" data-unit="${u.name}">
    <div><div class="unit-name" title="${u.label}">${u.label}</div>
    ${u.description ? html`<div class="unit-desc">${u.description}</div>` : ''}</div>
    <span class="status-badge" title="${healthTooltip(h)}"><span class="status-glyph status-${status}">${statusGlyph(status)}</span>${status}</span></div>`];
  var section = function (label, rows) {
    return rows.length ? html`<div class="section-label">${label}</div>${rows}` : '';
  };
  // its own card: the param name alone, the unit is the head
  parts.push(section('Setpoints', plan.params.map(function (p) { return renderParamRow(u.name, p, u.params[p], true); })));
  parts.push(section('Publishes', plan.publishes.map(widgetForEntity)));
  // Drives and From are the unit's wiring, not its surface: a line saying
  // how much of it there is, and the fields themselves when asked for.
  var wiring = plan.drives.length + plan.sources.length;
  if (wiring) {
    var open = !!localState.relations[u.name];
    var summary = [];
    if (plan.drives.length) summary.push('drives ' + plan.drives.length);
    if (plan.sources.length) summary.push('reads ' + plan.sources.length);
    parts.push(html`<button class="group-toggle" data-action="toggle-relations" data-unit="${u.name}">
      ${summary.join(' · ')} ${open ? '\u25be' : '\u25b8'}</button>`);
    if (open) {
      parts.push(section('Drives', plan.drives.map(relationRow)));
      parts.push(section('From', plan.sources.map(relationRow)));
    }
  }
  return html`<div class="card unit-card">${parts}</div>`;
}

// One relation: an entity's field and what it reads right now. The card
// states the relation; a tap opens the entity, which is where one acts —
// so a driven light does not drag its whole card into the wiring list.
function relationRow(f) {
  var e = f.entity;
  var field = f.aspect ? descriptorField(e, f.aspect) : null;
  var label = e.label + (f.aspect ? ' · ' + ((field && field.label) || f.aspect) : '');
  var value = f.aspect
    ? logic.formatAspect(f.aspect, field, stateValue(e.room, e.name, f.aspect))
    : '';
  return html`<div class="rel-row row-clickable" data-action="entity-detail" data-room="${e.room}" data-entity="${e.name}"><span>${label}</span>
    <span class="rel-value">${value}</span></div>`;
}

// The room card: every entity in the room, controls first.
function renderRoomCard(room, ents) {
  var sorted = ents.slice().sort(function (a, b) { return capRank(a) - capRank(b); });
  var title = room === 'global' ? 'House' : titleCase(room);
  return html`<div class="card room-card"><h3 title="${title}">${title}</h3>${sorted.map(widgetForEntity)}</div>`;
}

function entitiesInRoom(room) {
  return (store.model.entities || []).filter(function (e) { return e.room === room; });
}

function unitByName(name) {
  return (store.model.units || []).filter(function (u) { return u.name === name; })[0];
}

// The compositor: a view's widgets, in order, in one grid. The map is
// mounted after the markup lands (Leaflet owns its container).
function renderWidgets(title, widgets) {
  var persons = personEntities();
  var wantMap = false;
  // One widget's card. A group calls this for each of its members, which
  // is the whole of "a group holds widgets": a member renders exactly as
  // it would on the view itself.
  function card(w) {
    if (w.kind === 'tile') {
      var te = findEntityByName(w.entity);
      return te ? widgetTiles(te, w.aspect) : '';
    }
    if (w.kind === 'chart') {
      var ce = findEntityByName(w.entity);
      return ce ? widgetChart(ce, w.aspect, w.hours || 24) : '';
    }
    if (w.kind === 'entity') {
      var ee = findEntityByName(w.entity);
      return ee ? widgetEntity(ee) : '';
    }
    if (w.kind === 'dial') {
      var de = findEntityByName(w.entity);
      return de ? widgetDial(de, w.aspect) : '';
    }
    if (w.kind === 'burner') {
      var bu = findEntityByName(w.entity);
      return bu ? widgetBurner(bu) : '';
    }
    if (w.kind === 'room') return renderRoomCard(w.room, entitiesInRoom(w.room));
    if (w.kind === 'unit') return widgetUnit(w.unit);
    if (w.kind === 'params') {
      var pu = unitByName(w.unit);
      return pu ? widgetParams(pu) : '';
    }
    if (w.kind === 'people') return widgetPeople(persons);
    if (w.kind === 'deviations') return widgetDeviations();
    if (w.kind === 'map' && persons.length > 0) {
      wantMap = true;
      return renderMapCard(persons);
    }
    if (w.kind === 'group') return widgetGroup(w, card);
    return '';
  }
  var cards = html`${widgets.map(card)}`;
  byId('view').innerHTML = html`<h1 class="view-title">${title}</h1>
    ${String(cards) ? html`<div class="grid">${cards}</div>` : html`<div class="card"><div class="empty-hint">Nothing to show yet.</div></div>`}`;
  if (wantMap) mountMap(persons);
}

// A group is one card over its members: its label, then each member's own
// card, whose chrome the CSS removes inside a group — a dial with the
// traces that explain it reads as one thing. One level deep; the core
// refuses a group inside a group.
function widgetGroup(w, card) {
  var body = html`${(w.widgets || []).map(card)}`;
  if (!String(body)) return '';
  return html`<div class="card group-card">
    ${w.label ? html`<div class="card-label">${w.label.toUpperCase()}</div>` : ''}
    ${body}</div>`;
}

function findEntityByName(name) {
  return (store.model.entities || []).filter(function (e) { return e.name === name; })[0];
}

// ---- view: Now ----
//
// The error signal, not an inventory: people, what is out of the
// ordinary, and the map when anyone has a location. A reading earns a
// tile only by being placed in dashboard.toml.
function renderNow() {
  renderWidgets('Now', [{ kind: 'people' }, { kind: 'deviations' }, { kind: 'map' }]);
}

// ---- view: Not shown ----
//
// The complement of every placement in dashboard.toml (dashboard-logic.js,
// placement): what the family cannot reach from the nav, by room, each
// row its normal widget so it is usable here and not merely listed.
function renderNotShown() {
  var unplaced = logic.placement(store.model);
  var byRoom = {};
  unplaced.entities.forEach(function (e) {
    if (!byRoom[e.room]) byRoom[e.room] = [];
    byRoom[e.room].push(e);
  });
  var rooms = Object.keys(byRoom).sort(function (a, b) {
    // the pseudo-rooms last: the house's own things, and people
    var pa = a === 'global' || a === 'person', pb = b === 'global' || b === 'person';
    return pa === pb ? (a < b ? -1 : 1) : (pa ? 1 : -1);
  });
  var cards = rooms.map(function (room) { return renderRoomCard(room, byRoom[room]); });
  if (unplaced.params.length) {
    cards.push(html`<div class="card"><h3>Setpoints</h3>${unplaced.params.map(function (p) {
      return renderParamRow(p.unit, p.param, p.spec);
    })}</div>`);
  }
  byId('view').innerHTML = html`<h1 class="view-title">Not shown</h1>
    <div class="muted" style="margin:-8px 0 16px;max-width:62ch;">Everything no view in <code>dashboard.toml</code> places. Placing it there removes it from here.</div>
    ${cards.length ? html`<div class="grid">${cards}</div>` : html`<div class="card"><div class="empty-hint">Every entity and setpoint is on a view.</div></div>`}`;
}

// ---- view: Setpoints ----

function paramConstraintCaption(p) {
  var c = p.constraint || {};
  if (p.type === 'time' && (c.after || c.before)) return (c.after || '') + '–' + (c.before || '');
  if ((p.type === 'int' || p.type === 'float') && (c.min !== undefined || c.max !== undefined)) {
    return (c.min !== undefined ? c.min : '') + '–' + (c.max !== undefined ? c.max : '');
  }
  if (p.type === 'enum' && p.values) return p.values.join(' / ');
  return '';
}

function currentParamValue(unitName, pname, p) {
  var key = 'home/config/' + unitName + '/' + pname;
  if (key in store.config) return store.config[key];
  return p.default;
}

function renderParamControl(unitName, pname, p) {
  var value = currentParamValue(unitName, pname, p);
  var id = 'param-' + unitName + '-' + pname;
  if (p.type === 'time') {
    return html`<input type="time" id="${id}" value="${value}" data-action="param-time" data-unit="${unitName}" data-param="${pname}">`;
  }
  if (p.type === 'bool') {
    var on = !!value;
    return html`<span class="toggle ${on ? 'on' : ''}" data-action="param-toggle" data-unit="${unitName}" data-param="${pname}" data-value="${!on}"><span class="knob"></span></span>`;
  }
  if (p.type === 'enum' && p.values && p.values.length > logic.SELECT_ABOVE) {
    return html`<select class="control" id="${id}" data-action="param-select" data-unit="${unitName}" data-param="${pname}">${p.values.map(function (v) {
      return html`<option value="${v}"${v === value ? html` selected` : ''}>${v}</option>`;
    })}</select>`;
  }
  if (p.type === 'enum' && p.values) {
    return html`<div class="seg">${p.values.map(function (v) {
      return html`<button data-action="param-enum" data-unit="${unitName}" data-param="${pname}" data-value="${v}" class="${v === value ? 'active' : ''}">${v}</button>`;
    })}</div>`;
  }
  if (p.type === 'int' || p.type === 'float') {
    var c = p.constraint || {};
    var min = c.min !== undefined ? c.min : 0;
    var max = c.max !== undefined ? c.max : 100;
    var declared = logic.declaredStep(houseControls(), { unit: unitName, param: pname });
    var step = declared ? String(declared) : (p.type === 'float' ? 'any' : '1');
    var slideKey = unitName + '|' + pname;
    var shown = localState.sliderDrag[slideKey] !== undefined ? localState.sliderDrag[slideKey] : value;
    return html`<div class="slider-row" style="padding-left:0;">
      <input type="range" min="${min}" max="${max}" step="${step}" value="${shown}" data-action="param-slider" data-unit="${unitName}" data-param="${pname}">
      <span class="sval">${shown}</span></div>`;
  }
  // string fallback
  return html`<input type="text" id="${id}" value="${value === undefined ? '' : value}" data-action="param-text" data-unit="${unitName}" data-param="${pname}">`;
}

// What the manifest says this parameter is, so a value nudged off it can
// be put back by reading rather than by remembering. A slider is easy to
// move by accident and there is nothing to undo it with; the number it
// came from is the next best thing, and it is house text the page already
// has. A param with no default has nothing to say here.
function paramDefaultCaption(p) {
  if (p.default === undefined || p.default === null) return '';
  return 'default ' + String(p.default);
}

function familyEditable(p) { return p.editable_by === 'family'; }

// shared by the Setpoints view and the unit-detail overlay. A param the
// family cannot edit renders its live value against the manifest default
// instead of a control: visible, not writable (/api/param is the gate).
function renderParamRow(unitName, pname, p, bare) {
  var body;
  if (familyEditable(p)) {
    body = html`<div>${renderParamControl(unitName, pname, p)}</div>`;
  } else {
    var value = currentParamValue(unitName, pname, p);
    var offDefault = JSON.stringify(value) !== JSON.stringify(p.default);
    body = html`<div class="param-readonly">${String(value)}
      ${offDefault ? html` <span class="faint">(default ${String(p.default)})</span>` : ''} <span class="tier-badge">${p.editable_by || 'owner'}</span></div>`;
  }
  return html`<div class="param-row" id="paramrow-${unitName}-${pname}"><div class="param-head">
    <span class="name" title="${unitLabel(unitName)} · ${pname}">${bare ? '' : unitLabel(unitName) + ' · '}${pname}</span></div>
    ${body}
    <div class="param-caption" title="${JSON.stringify(p.constraint || {})}">
    ${[paramConstraintCaption(p), paramDefaultCaption(p)].filter(Boolean).join(' \u00b7 ')}
    </div></div>`;
}

// Setpoints is the family's levers: family-editable params only. Owner
// params show read-only in the unit overlay (Health -> unit).
function renderSetpoints() {
  var rows = [];
  (store.model.units || []).forEach(function (u) {
    var params = u.params || {};
    Object.keys(params).forEach(function (pname) {
      if (familyEditable(params[pname])) rows.push(renderParamRow(u.name, pname, params[pname]));
    });
  });
  byId('view').innerHTML = html`<h1 class="view-title">Setpoints</h1>
    ${rows.length === 0
      ? html`<div class="card"><div class="empty-hint">No family-editable parameters.</div></div>`
      : html`<div class="card">${rows}</div>`}`;
}

function flashParamRow(unitName, pname) {
  var rowEl = byId('paramrow-' + unitName + '-' + pname);
  if (!rowEl) return;
  rowEl.classList.remove('flash-highlight');
  void rowEl.offsetWidth; // restart the animation
  rowEl.classList.add('flash-highlight');
}

// ---- view: Rooms ----

function allZoneNames() {
  var zones = store.model.zones || {};
  var out = [];
  Object.keys(zones).forEach(function (zone) {
    out.push(zone);
  });
  return out;
}

function roomsInZone(zone) {
  var zones = store.model.zones || {};
  return zones[zone] || [];
}

function renderRooms() {
  var zones = allZoneNames();
  var chips = [html`<button class="chip ${store.roomsFilter === 'all' ? 'active' : ''}" data-action="zone-filter" data-zone="all">Whole house</button>`];
  zones.forEach(function (z) {
    chips.push(html`<button class="chip ${store.roomsFilter === z ? 'active' : ''}" data-action="zone-filter" data-zone="${z}">${titleCase(z)}</button>`);
  });

  var allowedRooms = null;
  if (store.roomsFilter !== 'all') {
    allowedRooms = roomsInZone(store.roomsFilter);
  }

  var byRoom = {};
  (store.model.entities || []).forEach(function (e) {
    if (!e.room) return;
    if (e.capability === 'person') return; // the map is their widget, not a room card
    if (allowedRooms && allowedRooms.indexOf(e.room) === -1) return;
    if (!byRoom[e.room]) byRoom[e.room] = [];
    byRoom[e.room].push(e);
  });

  var roomNames = Object.keys(byRoom).sort();
  var cards = roomNames.map(function (room) { return renderRoomCard(room, byRoom[room]); });

  byId('view').innerHTML = html`<h1 class="view-title">Rooms</h1>
    <div class="chips">${chips}</div>
    ${cards.length === 0
      ? html`<div class="card"><div class="empty-hint">No rooms with entities yet.</div></div>`
      : html`<div class="grid">${cards}</div>`}`;
}

// ---- view: Health ----

function renderEventRow(ev) {
  var unit = unitNameFromHealthKey(ev.key);
  var extra = Object.keys(ev.value || {}).filter(function (k) { return k !== 'kind'; })
    .map(function (k) { return k + '=' + JSON.stringify(ev.value[k]); }).join(' ');
  var t = new Date((ev.ts || 0) * 1000);
  var tStr = isNaN(t.getTime()) ? '' : t.toLocaleTimeString();
  var tFull = isNaN(t.getTime()) ? '' : t.toLocaleString();
  return html`<div class="event-row"><span class="ts" title="${tFull}">${tStr}</span>
    ${unitLabel(unit)} — ${(ev.value && ev.value.kind) || 'event'}${extra ? ' (' + extra + ')' : ''}</div>`;
}

function renderLogLine(entry) {
  var t = new Date((entry.ts_us || 0) / 1000);
  var tStr = isNaN(t.getTime()) ? '' : t.toLocaleTimeString();
  var tFull = isNaN(t.getTime()) ? '' : t.toLocaleString();
  var cls = entry.stream === 'stderr' ? 'log-line stderr' : 'log-line';
  return html`<div class="${cls}"><span class="ts" title="${tFull}">${tStr}</span>${entry.line}</div>`;
}

function renderHealth() {
  var units = store.model.units || [];
  var cards = units.map(function (u) {
    var key = 'home/health/' + u.name;
    var h = store.health[key] || {};
    var status = h.status || 'stopped';
    var meta = [];
    if (h.restarts !== undefined && h.restarts !== null) meta.push('restarts: ' + h.restarts);
    if (h.last_exit_code !== undefined && h.last_exit_code !== null) meta.push('last exit: ' + h.last_exit_code);
    return html`<div class="card health-card clickable" data-action="unit-detail" data-unit="${u.name}"><div class="health-head">
      <span class="name" title="${u.label}">${u.label}</span>
      <span class="status-badge" title="${healthTooltip(h)}"><span class="status-glyph status-${status}">${statusGlyph(status)}</span>${status}</span></div>
      ${meta.length ? html`<div class="health-meta">${meta.join(' · ')}</div>` : ''}
      </div>`;
  });

  var events = store.events.slice().sort(function (a, b) { return b.ts - a.ts; });
  var eventRows = events.map(renderEventRow);

  byId('view').innerHTML = html`<h1 class="view-title">Health</h1>
    <div class="grid">${cards}</div>
    <div class="card event-feed"><div class="card-label">Events</div>
    ${eventRows.length ? eventRows : html`<div class="empty-hint">No events yet this session.</div>`}
    </div>`;
}

// ---- view dispatch ----

var GENERATED = { now: renderNow, setpoints: renderSetpoints, rooms: renderRooms };

function renderView() {
  var current = currentView();
  var view = logic.viewsOf(store.model).filter(function (v) { return v.name === current; })[0];
  if (current === 'health') renderHealth();
  else if (current === 'notshown') renderNotShown();
  else if (view && view.kind) GENERATED[view.kind]();
  else if (view) renderWidgets(view.label, view.widgets);
  // A view the nav names is text in the house repo, and says so: the
  // button opens that text. Health and Not shown are chrome, never text.
  var title = byId('view').querySelector('h1.view-title');
  if (view && title && logic.viewText(store.model, view.name)) {
    title.insertAdjacentHTML('beforeend', html`<button class="view-text-btn" data-action="view-text" data-view-name="${view.name}" title="The text in dashboard.toml that makes this view">Text</button>`);
  }
  wireChartInteractions(byId('view'));
}

function render() {
  renderShell();
  renderView();
  if (overlay.open) renderOverlayContent();
  markPendingControls();
}

/* The aspect a control commands. Most carry it explicitly; these actions
 * imply it. The light sliders name theirs `data-kind`. */
var CONTROL_ASPECTS = {
  'toggle-light': 'on',
  'toggle-lock': 'locked',
  'climate-step': 'setpoint',
  'brightness-step': 'brightness'
};

function controlAspect(el) {
  var action = el.getAttribute('data-action');
  if (CONTROL_ASPECTS[action]) return CONTROL_ASPECTS[action];
  if (action === 'slider') return el.getAttribute('data-kind');
  return el.getAttribute('data-aspect');
}

// The actions that send a command; anything else carrying room and entity
// (a row that opens a detail, a label that opens history) is not a control.
var COMMAND_ACTIONS = {
  'toggle-light': 1, 'toggle-lock': 1, 'climate-step': 1, 'brightness-step': 1,
  'aspect-step': 1, 'aspect-enum': 1, 'aspect-select': 1, 'aspect-slider': 1, 'slider': 1
};

/* Chrome applied after every render rather than baked into each control's
 * markup: the views rebuild their HTML wholesale, so the pending state has
 * to be re-applied to the new nodes anyway, and doing it in one pass keeps
 * it out of a dozen render paths.
 *
 * A control with a command in flight shows the request as a request: the
 * value it asked for in the value slot (or the toggle's knob where it was
 * asked to go, outlined dashed), and a line under it saying which stage
 * the command is in. It keeps taking taps — a toggle tapped again asks to
 * go back, a stepper tapped again steps on from the request — because
 * freezing it until the device answers would make several steps
 * impossible. The line stays a while after the command ends, saying how
 * it ended. */
function markPendingControls() {
  var old = document.querySelectorAll('.cmd-status');
  for (var o = 0; o < old.length; o++) old[o].remove();
  var nodes = document.querySelectorAll('[data-action][data-room][data-entity]');
  var said = [];
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var action = el.getAttribute('data-action');
    if (!COMMAND_ACTIONS[action]) continue;
    var aspect = controlAspect(el);
    if (!aspect) continue;
    var room = el.getAttribute('data-room');
    var entity = el.getAttribute('data-entity');
    var key = logic.pendingKey(room, entity, aspect);
    var entry = pending[key];
    el.classList.remove('cmd-pending');
    if (entry) el.setAttribute('aria-busy', 'true');
    else el.removeAttribute('aria-busy');
    var row = el.closest('.dial, .slider-row, .aspect-row, .entity-row') || el.parentNode;
    if (entry) showRequest(el, row, room, entity, aspect, entry.value);
    if (said.indexOf(row) !== -1) continue;
    var status = commandStatus(key);
    if (!status) continue;
    said.push(row);
    var line = document.createElement('div');
    line.className = 'cmd-status tone-' + status.tone;
    line.setAttribute('data-cmd-status', key);
    line.setAttribute('role', 'status');
    line.textContent = status.text;
    row.insertAdjacentElement('afterend', line);
  }
}

// The asked-for value, painted as asked rather than as done.
function showRequest(el, row, room, entity, aspect, value) {
  if (el.classList.contains('toggle')) {
    el.classList.toggle('on', value === true);
    el.setAttribute('data-value', String(value !== true)); // a second tap asks to go back
    el.classList.add('cmd-pending');
  } else if (el.getAttribute('data-action') === 'aspect-enum') {
    var mine = el.getAttribute('data-value') === JSON.stringify(value);
    el.classList.toggle('active', mine);
    if (mine) el.classList.add('cmd-pending');
  } else if (el.tagName === 'SELECT') {
    el.value = JSON.stringify(value);
    el.classList.add('cmd-pending');
  } else if (el.tagName !== 'INPUT') {
    var slot = row.querySelector('.stepper-value, .dial-target, .sval');
    if (slot) {
      slot.textContent = formatCmdValue(room, entity, aspect, value);
      slot.classList.add('cmd-target');
    }
  }
}

// ---- detail overlay: open/close plumbing ----

/* Whether the detail overlay covers the window. A per-viewer
 * convenience, so it lives in localStorage rather than on the bus: it is
 * not house state, nobody else's browser should learn it, and a reader
 * who widened it once means it next time too. Every access is guarded —
 * a private window or blocked site data throws on the property itself,
 * and a chart is not worth a blank page. */
var WIDE_KEY = 'homeostat.overlay.wide';

function overlayWide() {
  try {
    return window.localStorage.getItem(WIDE_KEY) === '1';
  } catch (e) {
    return false;
  }
}

function setOverlayWide(wide) {
  try {
    window.localStorage.setItem(WIDE_KEY, wide ? '1' : '0');
  } catch (e) {
    // no storage: the choice still applies to this overlay, just not the next
  }
  applyOverlayWide(wide);
}

function applyOverlayWide(wide) {
  byId('overlay-panel').classList.toggle('wide', wide);
  byId('overlay-wide').setAttribute('aria-pressed', wide ? 'true' : 'false');
  // The charts read their own width from the DOM, so they have to be
  // rebuilt rather than merely restyled.
  if (overlay.open) renderOverlayContent();
}

function showOverlay() {
  var wasOpen = overlay.open;
  overlay.open = true;
  applyOverlayWide(overlayWide());
  renderOverlayContent();
  byId('overlay-backdrop').classList.add('show');
  var panel = byId('overlay-panel');
  panel.classList.add('show');
  if (!wasOpen) {
    history.pushState({ homeostatOverlay: true }, '', location.pathname + location.search + location.hash);
  }
  panel.focus();
}

function hideOverlayUI() {
  overlay.open = false;
  overlay.type = null;
  mountCameraLive(null);  // hiding the panel only drops a class; the stream would outlive it
  byId('overlay-backdrop').classList.remove('show');
  byId('overlay-panel').classList.remove('show');
}

function closeOverlay() {
  if (history.state && history.state.homeostatOverlay) {
    history.back(); // triggers popstate below, which actually hides the panel
  } else {
    hideOverlayUI();
  }
}

window.addEventListener('popstate', function (e) {
  if (!e.state || !e.state.homeostatOverlay) {
    hideOverlayUI();
  }
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && overlay.open) closeOverlay();
  else if (e.key === 'Escape' && statusSheetOpen) {
    statusSheetOpen = false;
    renderShell();
    byId('topbar-status').focus();
  }
});

// ---- detail overlay: open <type> ----

function openHistoryDetail(room, entityName, aspect) {
  var entity = findEntity(room, entityName);
  if (!entity) return;
  overlay.type = 'history';
  overlay.entity = entity;
  overlay.aspect = aspect;
  // The descriptor's kind decides the shape where it has one, and its
  // word is final — an enum coded as integers is runs, not a curve.
  // Undescribed, the live value's type decides; without a value yet (a
  // fresh page, a sensor that has not reported) that is a guess the
  // first points fetched settle (fetchHistoryRange).
  var live = stateValue(room, entityName, aspect);
  var field = descriptorField(entity, aspect);
  var described = !!(field && (field.kind === 'boolean' || field.kind === 'enum'));
  overlay.shape = logic.historyShape(live, field);
  overlay.shapeSettled = described || live !== undefined;
  overlay.range = 24;
  overlay.rangeData = {};
  overlay.cmdData = {};
  overlay.layer = '';
  overlay.issues = [];
  overlay.pinned = null;
  overlay.sourcePinned = null;
  overlay.lastPoints = null;
  // Sources are this entity's, so the layer and the fetched contributor
  // history do not survive into the next overlay.
  overlay.sourceData = {};
  overlay.sourceEvents = {};
  fetchHistoryRange(entityName, aspect, 24, overlay.shape);
  showOverlay();
}

function openEntityDetail(room, entityName) {
  var entity = findEntity(room, entityName);
  if (!entity) return;
  overlay.type = 'entity';
  overlay.entity = entity;
  overlay.expanded = {};
  showOverlay();
}

function openViewText(name) {
  overlay.type = 'text';
  overlay.viewName = name;
  showOverlay();
}

function openUnitDetail(unitName) {
  overlay.type = 'unit';
  overlay.unit = unitName;
  fetchUnitLog(unitName);
  showOverlay();
}

// ---- detail overlay: render <type> ----

/* The text behind a view: the dashboard.toml block that makes it, with
 * the widget kinds that name what is on screen. Read-only, deliberately —
 * the dashboard never writes the house (docs/design.md#views-are-text)
 * — but it gives what someone points at a name they can use, with a
 * person or with an agent working in the house repo. */
function renderViewTextBody() {
  var view = logic.viewsOf(store.model).filter(function (v) { return v.name === overlay.viewName; })[0];
  var text = logic.viewText(store.model, overlay.viewName) || '';
  var docs = 'https://github.com/freol35241/homeostat/blob/main/docs/';
  return {
    title: (view ? view.label : overlay.viewName) + ' · as text',
    body: html`<div class="view-text-note">This view is this block of <code>dashboard.toml</code> at the house root, rendered from what the house parsed (its comments are not kept).</div>
      <pre class="view-text">${text}</pre>
      <div class="view-text-note">Change it in the file, yourself or with an agent in the house repo; <code>homeostat plan</code> checks it before anything changes. <a href="${docs}widgets.md" target="_blank" rel="noopener">What each widget looks like</a> · <a href="${docs}manifest.md#dashboard-views-dashboardtoml" target="_blank" rel="noopener">every field</a></div>`
  };
}

function renderOverlayContent() {
  if (!overlay.open) return;
  var r;
  if (overlay.type === 'history') r = renderHistoryDetailBody();
  else if (overlay.type === 'entity') r = renderEntityDetailBody();
  else if (overlay.type === 'unit') r = renderUnitDetailBody();
  else if (overlay.type === 'text') r = renderViewTextBody();
  else r = { title: '', body: '' };
  byId('overlay-title').textContent = r.title;
  // Every state delta re-runs this, so the swap happens either side of
  // the mount rather than over it. Carrying the player across an
  // innerHTML swap is not enough: detaching a <video-rtc> and putting it
  // back re-runs its connectedCallback, which seeks to the live edge and
  // calls play() — a stutter and a flash of native controls per delta.
  byId('overlay-head').innerHTML = r.body;
  byId('overlay-rest').innerHTML = r.rest || '';
  mountCameraLive(r.camera);
  wireChartInteractions(byId('overlay-body'));
  wireSourceLegend(byId('overlay-body'));
  // The overlay re-renders on its own (opening, a fetch landing, a group
  // toggled), and its controls are as much the command's as the view's.
  markPendingControls();
}

/* Which line is which, on demand: pointing at a source in the legend
 * lights its line and stands the others down, and a tap holds that until
 * it is tapped again. Emphasis, not colour — a contributor owning a hue
 * would compete with the accent the computed value keeps
 * (docs/design.md#charts-forecasts-and-sources). */
function wireSourceLegend(root) {
  var scope = root || document;
  var entries = scope.querySelectorAll('.source-legend span[data-source]');
  if (!entries.length) return;
  // The pin belongs to the overlay, not to this wiring. Live state
  // re-renders the panel — a forecast re-issue is enough — which throws
  // away these nodes and every class on them, and a fresh closure would
  // take its highlight from whatever the pointer happens to be over: a
  // pin that quietly moves to another source, or vanishes, while the
  // reader is still reading. Same reason the braid's pin lives in
  // `overlay.pinned`.
  var sticky = overlay.sourcePinned || null;
  var marks = scope.querySelectorAll('.chart-contributor, .source-legend span');
  var highlight = function (name) {
    marks.forEach(function (el) {
      var own = el.getAttribute('data-source');
      el.classList.toggle('hi', !!name && own === name);
      el.classList.toggle('dim', !!name && own !== name);
    });
  };
  entries.forEach(function (el) {
    var name = el.getAttribute('data-source');
    el.addEventListener('pointerenter', function () { if (!sticky) highlight(name); });
    el.addEventListener('pointerleave', function () { if (!sticky) highlight(null); });
    el.addEventListener('click', function () {
      sticky = sticky === name ? null : name;
      overlay.sourcePinned = sticky;
      highlight(sticky);
    });
  });
  // Re-apply on every wiring, so a re-render restores the pin rather than
  // dropping it.
  highlight(sticky);
}

// The live player for `name`, or none. Mounting is idempotent: the same
// camera leaves the running element untouched, which is the whole point.
function mountCameraLive(name) {
  var mount = byId('overlay-mount');
  var live = mount.firstElementChild;
  if (live && live.getAttribute('data-entity') === name) return;
  mount.innerHTML = '';  // a different camera, or none: drop the stream
  if (!name) return;
  live = document.createElement('video-rtc');
  live.setAttribute('data-entity', name);
  live.mode = 'mse';
  live.src = '/api/camera/' + encodeURIComponent(name) + '/live';
  mount.appendChild(live);
}

function statItem(label, value, aspect) {
  return statText(label, value === null ? '—' : formatChartValue(aspect, value));
}

function statText(label, text) {
  return html`<div class="stat-item"><div class="stat-value">${text}</div><div class="stat-label">${label}</div></div>`;
}

function fmtDuration(ms) {
  var mins = Math.round(ms / 60000);
  if (mins < 60) return mins + ' min';
  var h = Math.floor(mins / 60), m = mins % 60;
  if (h < 48) return m ? h + ' h ' + m + ' min' : h + ' h';
  return Math.round(h / 24) + ' d';
}

function rangeStats(points) {
  var vals = (points || []).map(function (p) { return p.value; }).filter(function (v) { return typeof v === 'number'; });
  if (vals.length === 0) return { latest: null, min: null, max: null, avg: null };
  var sum = 0;
  vals.forEach(function (v) { sum += v; });
  return {
    latest: points[points.length - 1].value,
    min: Math.min.apply(null, vals),
    max: Math.max.apply(null, vals),
    avg: sum / vals.length
  };
}

function renderHistoryDetailBody() {
  var entity = overlay.entity, aspect = overlay.aspect;
  var multi = aspectsFor(entity).length > 1;
  var label = entity.label + (multi ? ' · ' + titleCase(aspect) : '');

  var chips = RANGE_PRESETS.map(function (rp) {
    return html`<button data-action="range-chip" data-hours="${rp.hours}" class="${overlay.range === rp.hours ? 'active' : ''}">${rp.label}</button>`;
  });
  // One row for what is drawn beside the record: the several opinions
  // behind the value's past, or the several claims about its future.
  // Both are owner work, which is why they live here and not on a tile —
  // a family wants the temperature, not which sensor read low — and only
  // one can be drawn at a time, so they are one control and not two
  // (docs/design.md#charts-forecasts-and-sources). A chip appears only
  // where the house has the thing it names, so an ordinary sensor's
  // overlay has no such row.
  var layers = [{ id: '', label: 'value' }];
  if (overlay.shape !== 'timeline' && contributorsOf(entity, aspect).length) {
    layers.push({ id: 'sources', label: 'sources' });
  }
  if (forecastsOf(entity, aspect).length) {
    layers.push({ id: 'forecasts', label: 'forecasts' });
  }
  var layerChips = layers.length > 1
    ? html`<div class="seg" style="margin-top:8px;">${layers.map(function (l) {
      return html`<button data-action="chart-layer" data-layer="${l.id}" class="${overlay.layer === l.id ? 'active' : ''}">${l.label}</button>`;
    })}</div>`
    : '';

  var rd = overlay.rangeData[overlay.range];
  var loaded = !!(rd && rd.loaded);
  var points = loaded ? rd.points : (overlay.lastPoints || []);
  var win = rd && rd.window ? rd.window : { from: Date.now() - overlay.range * 3600e3, to: Date.now() };
  var field = descriptorField(entity, aspect);
  // The viewBox height is baked when the chart is built, so a taller
  // chart is a rebuild, not a restyle — which is why toggling the width
  // re-renders rather than just swapping a class.
  var wide = overlayWide();
  var chartHtml, statsHtml;
  if (overlay.shape === 'timeline') {
    chartHtml = buildTimeline('detail-chart', points, { height: wide ? 96 : 64, sizeClass: wide ? 'chart-timeline-wide' : 'chart-timeline', aspect: aspect, field: field, window: win });
    var tl = logic.timelineStats(logic.timelineRuns(points, win.from, win.to));
    statsHtml = html`<div class="stat-row">
      ${statText('Now', tl.latest === null ? '—' : logic.formatAspect(aspect, field, tl.latest))}
      ${tl.onMs === null ? '' : statText('On', fmtDuration(tl.onMs) + ' of ' + fmtDuration(win.to - win.from))}
      ${statText('Changes', String(tl.changes))}</div>`;
  } else {
    chartHtml = buildChart('detail-chart', points, {
      height: wide ? 440 : 220, sizeClass: wide ? 'chart-detail-wide' : 'chart-detail',
      aspect: aspect, gridlines: true, area: true, yLabels: true, window: win,
      // Under `forecasts` the current belief steps aside: drawing it over
      // the braid would make one issue look special for no reason.
      forecast: overlay.layer === 'forecasts' ? null : liveForecastsOf(entity, aspect),
      issues: overlay.layer === 'forecasts' ? overlay.issues : null,
      pinned: overlay.pinned,
      // Contributors stand down behind the braid: two greys on one chart,
      // one per issue and one per source, would read as one set of lines.
      contributors: overlay.layer === 'forecasts' ? null : drawnSources(entity, aspect, overlay.range)
    });
    var stats = rangeStats(points);
    statsHtml = html`<div class="stat-row">
      ${statItem('Latest', stats.latest, aspect)}${statItem('Min', stats.min, aspect)}
      ${statItem('Max', stats.max, aspect)}${statItem('Avg', stats.avg, aspect)}</div>`;
  }

  // The four stats describe the RECORDED window the chips select, so a
  // drawn forecast can peak above the MAX beside it — which reads as a
  // contradiction unless the horizon says its own extreme out loud.
  // One caption per source: "where the horizon goes" is a claim, and
  // averaging two providers into one sentence would state a horizon
  // neither of them predicted.
  var horizonHtml = '';
  if (overlay.layer !== 'forecasts') {
    var beliefs = forecastsOf(entity, aspect);
    horizonHtml = beliefs.map(function (b) {
      var fresh = logic.forecastFreshness(b.forecast, Date.now());
      var who = beliefs.length > 1 ? b.source + ' · ' : '';
      var issued = issuedCaption(b.forecast);
      // A claim whose horizon has run out is not drawn here, so this note
      // is the only thing that distinguishes "this producer stopped" from
      // "this aspect has no forecast" — the braid beside it is where the
      // spent claim itself can still be read.
      if (fresh.expired) {
        return html`<div class="chart-note">spent · ${who}ran out ${formatChartTime(b.forecast.to)}${issued ? ' · ' + issued : ''}</div>`;
      }
      var ahead = horizonCaption(aspect, field, b.forecast, Date.now());
      if (!ahead && !issued) return '';
      return html`<div class="chart-note">ahead · ${who}${ahead ? ahead + (issued ? ' · ' : '') : ''}${issued}
        ${fresh.stale ? html`<span class="stale-mark">stale</span>` : ''}</div>`;
    });
  }
  var braidHtml = '';
  if (overlay.layer === 'forecasts') {
    braidHtml = html`<div class="chart-note" id="braid-column"></div>
      <div class="chart-note">${
        overlay.issuesLoading ? 'reading the forecasts\u2026'
          : overlay.issues.length
            ? overlay.issues.length + ' forecast' + (overlay.issues.length === 1 ? '' : 's') +
              (function () {
                // Issues from several providers in one braid would make
                // "they disagree" and "it drifted" look the same, so the
                // count says how many sources are mixed in.
                var seen = {};
                overlay.issues.forEach(function (f) { if (f.source) seen[f.source] = 1; });
                var n = Object.keys(seen).length;
                return n > 1 ? ' from ' + n + ' sources' : '';
              })() +
              ' kept for this window' + (overlay.issues.length >= BRAID_ISSUES ? ' (newest ' + BRAID_ISSUES + ')' : '') +
              (overlay.pinned ? ' \u00b7 one pinned \u2014 tap it again to release' : ' \u00b7 tap a line to pin it')
            : 'nothing kept for this window \u2014 the recorder may not subscribe home/forecast/**'
      }</div>`;
  }
  // The legend doubles as the scrub readout: with no cursor it names the
  // sources, with one it says what each read at that instant. Colour
  // cannot tell them apart — they are all the same grey, deliberately —
  // so naming them is the identification.
  var legendHtml = '';
  var drawn = overlay.layer === 'forecasts' ? null : drawnSources(entity, aspect, overlay.range);
  if (drawn) {
    var usage = sourceUsageNow(entity, aspect, overlay.range,
                               contributorsOf(entity, aspect));
    legendHtml = html`<div class="chart-note source-legend" id="sources-legend">${
      drawn.map(function (c) {
        // A contributor that has dropped out still draws — the line
        // stopping IS the diagnosis — but it must not read as live.
        // Two different ways to be out: its own device is gone, or the
        // computation is choosing not to use it.
        var down = stateValue(contributorRoom(c), c.entity, 'available') === false;
        var use = usage[c.name];
        var excluded = use && use.used === false;
        var since = excluded && use.since
          ? ' since ' + formatChartClock(use.since / 1000)
          : '';
        return html`<span data-source="${c.name}"${c.note ? html` title="${c.note}"` : ''}>
          ${c.label}
          ${down ? ' \u00b7 unavailable' : ''}
          ${excluded ? ' \u00b7 not used' + since : ''}
          ${c.note ? ' \u00b7 ' + c.note : ''}</span>`;
      })}</div>
      <div class="chart-note" id="sources-column"></div>`;
  } else if (overlay.layer === 'sources' && contributorsOf(entity, aspect).length) {
    legendHtml = html`<div class="chart-note">reading the sources\u2026</div>`;
  }
  var body = html`<div class="seg">${chips}</div>${layerChips}
    <div class="${loaded ? '' : 'chart-loading'}">${chartHtml}${statsHtml}${horizonHtml}</div>
    ${legendHtml}${braidHtml}${commandStrip(aspect, field, win)}`;
  return { title: label, body: body };
}

/* What was asked, under what happened. An aspect nothing ever commanded
 * has no strip at all — this is the recorder's cmd series, so the strip
 * appears exactly where there is an audit to show. */
function commandStrip(aspect, field, win) {
  var cd = overlay.cmdData[overlay.range];
  if (!cd || !cd.loaded || !cd.points.length) return '';
  var runs = logic.timelineRuns(cd.points, win.from, win.to);
  var latest = cd.points[cd.points.length - 1];
  return html`<div class="card-label" style="margin-top:20px;">Commanded</div>
    ${buildTimeline('detail-cmd', cd.points, { height: 28, sizeClass: 'chart-commands', aspect: aspect, field: field, window: win })}
    <div class="chart-note">${runs.length + (runs.length === 1 ? ' command' : ' commands') +
      ' · last ' + logic.formatAspect(aspect, field, latest.value) + ' at ' + formatChartTime(latest.ts)}</div>`;
}

// One planned row of an entity's detail: the label and the value, plus the
// control the descriptor declared — the param-control shapes, wired to
// /api/cmd instead of /api/param. A numeric row without a control taps
// through to its history.
function renderAspectRow(entity, r) {
  var attrs = html` data-room="${entity.room}" data-entity="${entity.name}" data-aspect="${r.aspect}"`;
  var value = aspectValueSpan(r);
  // Possession, wherever the aspect is: an arbiter lease is in force here,
  // so an automation's wish for it is being refused. `Now` says so only
  // when the hold displaced somebody; the control says so whenever it is
  // held, because this is where a person stands when they wonder why the
  // house is not driving it (docs/design.md#views-are-text).
  var hold = logic.holdOn(store.holds, entity.room, entity.name, r.aspect, Date.now());
  var heldMark = hold
    ? html`<span class="stale-mark" title="${'held by ' + hold.actor + ' at the ' + hold.priority + ' band'}">held</span>`
    : '';
  if (!r.control) {
    // a chart for a number, a timeline for a bool or a string
    return html`<div class="aspect-row described row-clickable" data-action="history-detail"${attrs}>
      <span class="aspect-label">${r.label}</span>${value}${heldMark}</div>`;
  }
  // The label taps through to history even though the row carries a
  // control. A commanded aspect is exactly the one whose past a reader
  // wants, and the row's click belongs to the control, so the label is
  // the only way to reach it. The control's own buttons still win:
  // closest('[data-action]') takes the innermost.
  var dial = r.control.kind === 'dial';
  return html`<div class="aspect-row described${dial ? ' dial-row' : ''}">
    <span class="aspect-label linked" data-action="history-detail"${attrs}>${r.label}${heldMark}</span>
    ${renderAspectControl(entity, r, true)}</div>`;
}

function aspectValueSpan(r) {
  return html`<span class="aspect-value${r.stale ? ' stale' : ''}" title="${r.aspect}">${r.display}</span>
    ${r.stale ? html`<span class="stale-mark">stale</span>` : ''}`;
}

// A thermostat dial: the target on a 240° arc from min to max, the
// current reading beneath it when the entity has one, ± at the arc's
// ends. The buttons carry the same action attributes as the compact
// stepper, so the pending/held/timeout stages apply unchanged.
function renderDial(action, attrs, o) {
  var span = (o.max - o.min) || 1;
  var f = typeof o.value === 'number' ? Math.max(0, Math.min(1, (o.value - o.min) / span)) : 0;
  var point = function (deg) {
    var a = deg * Math.PI / 180;
    return { x: 60 + 46 * Math.cos(a), y: 60 + 46 * Math.sin(a) };
  };
  var arc = function (fromDeg, toDeg) {
    var a = point(fromDeg), b = point(toDeg);
    return 'M ' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + ' A 46 46 0 ' + (toDeg - fromDeg > 180 ? 1 : 0) + ' 1 ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
  };
  var end = -210 + 240 * f;
  var knob = point(end);
  var disabled = o.disabled ? html` disabled` : '';
  return html`<div class="dial">
    <svg viewBox="0 0 120 120" aria-hidden="true"><path class="dial-track" d="${arc(-210, 30)}"/>
    ${f > 0 ? html`<path class="dial-arc" d="${arc(-210, end)}"/>` : ''}
    <circle class="dial-knob" cx="${knob.x.toFixed(1)}" cy="${knob.y.toFixed(1)}" r="6"/></svg>
    <div class="dial-readout"><div class="dial-target">${o.display}</div>
    ${o.current ? html`<div class="dial-current">${o.current}</div>` : ''}</div>
    <div class="dial-buttons">
    <button class="step-btn" data-action="${action}"${attrs} data-delta="${-o.step}"${disabled} aria-label="lower">&minus;</button>
    <button class="step-btn" data-action="${action}"${attrs} data-delta="${o.step}"${disabled} aria-label="raise">+</button>
    </div></div>`;
}

// The first temperature reading the entity has that is not itself the
// commanded aspect — what the dial shows as "now".
function currentTemperatureOf(entity, except) {
  var rows = [];
  logic.aspectPlan(entity, store.state, store.aspects[entity.name], false, houseControls()).forEach(function (s) {
    s.rows.forEach(function (r) { rows.push(r); });
  });
  var field = function (r) { return descriptorField(entity, r.aspect); };
  var hit = rows.filter(function (r) {
    return r.aspect !== except && r.numeric && !r.control &&
      ((field(r) && field(r).kind === 'temperature') || (!field(r) && r.aspect.indexOf('temperature') !== -1));
  })[0];
  return hit ? hit.display + ' now' : '';
}

// The control markup for a planned row with a control: the param-control
// shapes wired to /api/cmd. `big` is the overlay and the dial widget; a
// room card gets every control's compact form (a dial's is a stepper).
function renderAspectControl(entity, r, big) {
  var attrs = html` data-room="${entity.room}" data-entity="${entity.name}" data-aspect="${r.aspect}"`;
  var value = aspectValueSpan(r);
  var c = r.control;
  var control;
  var disabledAttr = c.disabled ? html` disabled` : '';
  if (c.kind === 'readonly') {
    control = html`${value}<span class="tier-badge">${c.tier}</span>`;
  } else if (c.kind === 'dial' && big) {
    control = renderDial('aspect-step', attrs, {
      value: r.value, display: r.display, min: c.min, max: c.max, step: c.step,
      disabled: c.disabled || !r.numeric, current: currentTemperatureOf(entity, r.aspect)
    });
  } else if (c.kind === 'select') {
    control = html`<select class="control" data-action="aspect-select"${attrs}${disabledAttr}>${c.values.map(function (v) {
      return html`<option value="${JSON.stringify(v.value)}"${v.value === r.value ? html` selected` : ''}>${v.label}</option>`;
    })}</select>`;
  } else if (c.kind === 'stepper' || c.kind === 'dial') {
    var stepOff = r.numeric && !c.disabled ? '' : html` disabled`;
    control = html`<span class="stepper">
      <button class="step-btn" data-action="aspect-step"${attrs} data-delta="${-c.step}"${stepOff}>&minus;</button>
      <span class="stepper-value">${r.display}</span>
      <button class="step-btn" data-action="aspect-step"${attrs} data-delta="${c.step}"${stepOff}>+</button></span>`;
  } else if (c.kind === 'segment') {
    control = html`<div class="seg">${c.values.map(function (v) {
      return html`<button data-action="aspect-enum"${attrs} data-value="${JSON.stringify(v.value)}" class="${v.value === r.value ? 'active' : ''}"${disabledAttr}>${v.label}</button>`;
    })}</div>`;
  } else if (c.kind === 'slider') {
    var slideKey = entity.name + '|' + r.aspect;
    var shown = localState.sliderDrag[slideKey] !== undefined ? localState.sliderDrag[slideKey] : r.value;
    var nudgeOff = c.coarse && r.numeric && !c.disabled ? '' : html` disabled`;
    control = html`<div class="slider-row" style="padding-left:0;">
      <button class="step-btn" data-action="aspect-step"${attrs} data-delta="${-c.coarse}"${nudgeOff} aria-label="lower">&minus;</button>
      <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${shown}" data-action="aspect-slider"${attrs}${disabledAttr}>
      <span class="sval">${shown}</span>
      <button class="step-btn" data-action="aspect-step"${attrs} data-delta="${c.coarse}"${nudgeOff} aria-label="raise">+</button></div>`;
  } else {
    control = value;
  }
  return control;
}

function renderEntityDetailBody() {
  var entity = overlay.entity;
  var meta = titleCase(entity.room) + ' · ' + titleCase(entity.capability) +
    ((entity.features && entity.features.length) ? ' · ' + entity.features.map(titleCase).join(', ') : '');
  var badge = entity.write_mode === 'arbitrated' ? html`<span class="badge-arbitrated">ARBITRATED</span>` : '';
  var ownerLine = html`Owned by ${unitLabel(entity.owner)} · ${entity.write_mode}${badge}`;

  // Sections come from the adapter's aspect descriptor when it published
  // one (dashboard-logic.js, aspectPlan); an undescribed entity gets the
  // one flat State list. A described climate's declared commands render
  // in their own group, so its Controls row is not repeated.
  var descriptor = store.aspects[entity.name];
  var plan = logic.aspectPlan(entity, store.state, descriptor, !controlDisabled(entity), houseControls());
  var sections = plan.map(function (section) {
    var open = !section.collapsed || overlay.expanded[section.group];
    var head = section.collapsed
      ? html`<button class="group-toggle" data-action="toggle-group" data-group="${section.group}">
        ${section.label} (${section.rows.length}) ${open ? '\u25be' : '\u25b8'}</button>`
      : html`<div class="card-label" style="margin-top:20px;">${section.label}</div>`;
    return html`${head}${open ? section.rows.map(function (r) { return renderAspectRow(entity, r); }) : ''}`;
  });
  if (sections.length === 0) sections.push(html`<div class="card-label" style="margin-top:20px;">State</div><div class="aspect-row faint">no data</div>`);

  // A camera's detail is the live view (mounted imperatively in
  // renderOverlayContent — a custom element can't ride innerHTML), not a
  // Controls row: cameras take no commands. Its sections move to `rest`,
  // below the mount, so the player keeps its place above them.
  var middle = '', rest = html`${sections}`, camera = null;
  if (entity.capability === 'camera') {
    camera = entity.name;
    middle = html`<div class="card-label" style="margin-top:20px;">Live</div>`;
  } else if (entity.capability === 'sensor') {
    // A described sensor's readings are its sections, each tapping through
    // to its history; an undescribed one keeps the sparkline rows here.
    if (!descriptor) middle = html`<div class="card-label" style="margin-top:20px;">Controls</div>${widgetForSensor(entity, false)}`;
  } else if (!descriptor || BESPOKE_WIDGET[entity.capability]) {
    // A capability with its own widget (a toggle, a slider) keeps it here
    // whether or not the adapter described the rest of its aspects: the
    // descriptor never declares commands for the capability's vocabulary.
    middle = html`<div class="card-label" style="margin-top:20px;">Controls</div>
      ${entity.capability === 'climate' ? widgetForClimate(entity, true) : widgetForEntity(entity)}`;
  }
  var head = html`<div class="muted" style="margin-top:2px;">${meta}</div>
    <div class="muted" style="margin-top:6px;">${ownerLine}</div>${middle}`;
  // Without a camera everything is one half and the mount stays empty.
  return camera
    ? { title: entity.label, body: head, rest: rest, camera: camera }
    : { title: entity.label, body: html`${head}${rest}` };
}

function renderUnitDetailBody() {
  var unit = unitsByName()[overlay.unit] || { name: overlay.unit, label: overlay.unit, kind: '', description: '', params: {} };
  var hkey = 'home/health/' + unit.name;
  var h = store.health[hkey] || {};
  var status = h.status || 'stopped';

  var fieldRows = html`<div class="aspect-row"><span class="muted">status:</span> ${statusChipHtml(status)}</div>
    <div class="aspect-row"><span class="muted">pid:</span> ${fmtOrDash(h.pid)}</div>
    <div class="aspect-row"><span class="muted">restarts:</span> ${fmtOrDash(h.restarts)}</div>
    <div class="aspect-row"><span class="muted">backoff_ms:</span> ${fmtOrDash(h.backoff_ms)}</div>
    <div class="aspect-row"><span class="muted">last_exit_code:</span> ${fmtOrDash(h.last_exit_code)}</div>`;

  var params = unit.params || {};
  var paramRows = Object.keys(params).map(function (pname) {
    return renderParamRow(unit.name, pname, params[pname]);
  });
  var paramsHtml = paramRows.length ? paramRows : html`<div class="empty-hint">No parameters.</div>`;

  var events = store.events.filter(function (ev) { return unitNameFromHealthKey(ev.key) === unit.name; });
  var eventRows = events.map(renderEventRow);
  var eventsHtml = eventRows.length ? eventRows : html`<div class="empty-hint">No events yet this session.</div>`;

  var log = overlay.log || { lines: [], loaded: false, loading: false };
  var logRows = log.lines.map(renderLogLine);
  var logHtml = log.loading ? html`<div class="empty-hint">Loading&hellip;</div>` :
    (logRows.length ? logRows : html`<div class="empty-hint">No output captured.</div>`);

  var body = html`<div class="muted">${titleCase(unit.kind || '')}</div>
    ${unit.description ? html`<div style="margin-top:4px;">${unit.description}</div>` : ''}
    <div class="card-label" style="margin-top:20px;">Health</div>${fieldRows}
    <div class="card-label" style="margin-top:20px;">Params</div>${paramsHtml}
    <div class="card-label" style="margin-top:20px;">Events</div><div class="event-feed">${eventsHtml}</div>
    <div class="card-label" style="margin-top:20px;">Log</div><div class="log-feed">${logHtml}</div>`;
  return { title: unit.label, body: body };
}

// ---- interaction: delegated events ----

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');

  if (action === 'lights-off') {
    sendLightsOff();
    return;
  }
  if (action === 'toggle-light') {
    var room = el.getAttribute('data-room');
    var entity = el.getAttribute('data-entity');
    var value = el.getAttribute('data-value') === 'true';
    sendCmd(room, entity, 'on', value);
    return;
  }
  if (action === 'toggle-lock') {
    var lockRoom = el.getAttribute('data-room');
    var lockEntity = el.getAttribute('data-entity');
    var lockValue = el.getAttribute('data-value') === 'true';
    sendCmd(lockRoom, lockEntity, 'locked', lockValue);
    return;
  }
  if (action === 'climate-step') {
    var stepRoom = el.getAttribute('data-room');
    var stepEntity = el.getAttribute('data-entity');
    var current = stepBase(stepRoom, stepEntity, 'setpoint');
    if (typeof current !== 'number') return; // no fabricated default to step from
    var delta = parseFloat(el.getAttribute('data-delta'));
    var next = Math.round((current + delta) * 10) / 10;
    stepCmd(stepRoom, stepEntity, 'setpoint', next);
    return;
  }
  if (action === 'brightness-step') {
    var bRoom = el.getAttribute('data-room');
    var bEntity = el.getAttribute('data-entity');
    var bCurrent = stepBase(bRoom, bEntity, 'brightness');
    if (typeof bCurrent !== 'number') return;
    var bPct = Math.max(0, Math.min(100, Math.round(bCurrent / 254 * 100) + parseInt(el.getAttribute('data-delta'), 10)));
    stepCmd(bRoom, bEntity, 'brightness', Math.round(bPct / 100 * 254));
    return;
  }
  if (action === 'aspect-step') {
    var aRoom = el.getAttribute('data-room');
    var aEntity = el.getAttribute('data-entity');
    var aAspect = el.getAttribute('data-aspect');
    var aCurrent = stepBase(aRoom, aEntity, aAspect);
    if (typeof aCurrent !== 'number') return; // no fabricated default to step from
    var aNext = Math.round((aCurrent + parseFloat(el.getAttribute('data-delta'))) * 100) / 100;
    var aField = descriptorField(findEntity(aRoom, aEntity) || {}, aAspect);
    var aBounds = (aField && aField.command && aField.command.constraint) || {};
    if (typeof aBounds.min === 'number') aNext = Math.max(aBounds.min, aNext);
    if (typeof aBounds.max === 'number') aNext = Math.min(aBounds.max, aNext);
    stepCmd(aRoom, aEntity, aAspect, aNext);
    return;
  }
  if (action === 'aspect-enum') {
    sendCmd(el.getAttribute('data-room'), el.getAttribute('data-entity'), el.getAttribute('data-aspect'),
      JSON.parse(el.getAttribute('data-value')));
    return;
  }
  if (action === 'toggle-relations') {
    var relUnit = el.getAttribute('data-unit');
    localState.relations[relUnit] = !localState.relations[relUnit];
    render();
    return;
  }
  if (action === 'toggle-group') {
    var group = el.getAttribute('data-group');
    overlay.expanded[group] = !overlay.expanded[group];
    renderOverlayContent();
    return;
  }
  if (action === 'param-toggle') {
    var unit = el.getAttribute('data-unit');
    var param = el.getAttribute('data-param');
    var val = el.getAttribute('data-value') === 'true';
    sendParam(unit, param, val, function () { scheduleRender(); });
    return;
  }
  if (action === 'param-enum') {
    var unit2 = el.getAttribute('data-unit');
    var param2 = el.getAttribute('data-param');
    var val2 = el.getAttribute('data-value');
    sendParam(unit2, param2, val2, function () { scheduleRender(); });
    return;
  }
  if (action === 'zone-filter') {
    store.roomsFilter = el.getAttribute('data-zone');
    renderView();
    return;
  }
  if (action === 'history-detail') {
    openHistoryDetail(el.getAttribute('data-room'), el.getAttribute('data-entity'), el.getAttribute('data-aspect'));
    return;
  }
  if (action === 'entity-detail') {
    openEntityDetail(el.getAttribute('data-room'), el.getAttribute('data-entity'));
    return;
  }
  if (action === 'unit-detail') {
    openUnitDetail(el.getAttribute('data-unit'));
    return;
  }
  if (action === 'view-text') {
    openViewText(el.getAttribute('data-view-name'));
    return;
  }
  // Deviation taps land on whichever view shows the thing
  // (dashboard-logic.js, viewFor); with none, the unit overlay holds every
  // param and Not shown holds every unplaced light.
  if (action === 'goto-rooms') {
    store.view = logic.viewFor({ type: 'rooms' }, logic.viewsOf(store.model)) || 'notshown';
    renderShell();
    renderView();
    return;
  }
  if (action === 'goto-setpoint') {
    var gUnit = el.getAttribute('data-unit');
    var gParam = el.getAttribute('data-param');
    var gView = logic.viewFor({ type: 'setpoint', unit: gUnit }, logic.viewsOf(store.model));
    if (!gView) {
      openUnitDetail(gUnit);
      return;
    }
    store.view = gView;
    renderShell();
    renderView();
    flashParamRow(gUnit, gParam);
    return;
  }
  if (action === 'chart-layer') {
    // Choosing one layer is what puts the other away: two sets of thin
    // grey lines on one chart read as one set.
    overlay.layer = el.getAttribute('data-layer') || '';
    // A pin belongs to a braid, or a legend, that may no longer be drawn.
    overlay.pinned = null;
    overlay.sourcePinned = null;
    if (overlay.layer === 'forecasts' && !overlay.issues.length && !overlay.issuesLoading) {
      fetchIssues(overlay.entity.name, overlay.aspect, overlay.range);
    }
    if (overlay.layer === 'sources') {
      fetchSources(overlay.entity, overlay.aspect, overlay.range);
      fetchSourceEvents(overlay.entity, overlay.aspect, overlay.range);
    }
    renderOverlayContent();
    return;
  }
  if (action === 'range-chip') {
    var hrs = parseInt(el.getAttribute('data-hours'), 10);
    overlay.range = hrs;
    fetchHistoryRange(overlay.entity.name, overlay.aspect, hrs, overlay.shape);
    if (overlay.layer === 'sources') {
      fetchSources(overlay.entity, overlay.aspect, hrs);
      fetchSourceEvents(overlay.entity, overlay.aspect, hrs);
    }
    // A different window is a different set of issues, and a pin on a
    // forecast that is no longer drawn would be a highlight on nothing.
    if (overlay.layer === 'forecasts') {
      overlay.issues = [];
      overlay.pinned = null;
      fetchIssues(overlay.entity.name, overlay.aspect, hrs);
    }
    renderOverlayContent();
    return;
  }
  if (action === 'overlay-wide') {
    setOverlayWide(!overlayWide());
    return;
  }
  if (action === 'overlay-close') {
    closeOverlay();
    return;
  }
});

document.addEventListener('change', function (e) {
  var el = e.target;
  if (!el.matches) return;

  if (el.matches('[data-action="aspect-select"]')) {
    var chosen;
    try { chosen = JSON.parse(el.value); } catch (err) { return; } // a descriptor value that is not JSON is not a command
    sendCmd(el.getAttribute('data-room'), el.getAttribute('data-entity'), el.getAttribute('data-aspect'), chosen);
    return;
  }
  if (el.matches('[data-action="param-select"]')) {
    sendParam(el.getAttribute('data-unit'), el.getAttribute('data-param'), el.value, function () { scheduleRender(); });
    return;
  }

  if (el.matches('[data-action="slider"]')) {
    var kind = el.getAttribute('data-kind');
    var room = el.getAttribute('data-room');
    var entity = el.getAttribute('data-entity');
    var key = room + '/' + entity + '/' + kind;
    var pct = parseInt(el.value, 10);
    var sendValue;
    if (kind === 'brightness') {
      sendValue = Math.round((pct / 100) * 254);
      sendCmd(room, entity, 'brightness', sendValue);
    } else if (kind === 'color_temp') {
      sendValue = pct; // el.value already the mired value for color_temp
      sendCmd(room, entity, 'color_temp', sendValue);
    }
    delete localState.sliderDrag[key];
    scheduleRender();
    return;
  }
  if (el.matches('[data-action="param-slider"]')) {
    var unit = el.getAttribute('data-unit');
    var param = el.getAttribute('data-param');
    var slideKey = unit + '|' + param;
    var v = el.step === 'any' ? parseFloat(el.value) : parseInt(el.value, 10);
    sendParam(unit, param, v, function () { scheduleRender(); });
    delete localState.sliderDrag[slideKey];
    scheduleRender();
    return;
  }
  if (el.matches('[data-action="aspect-slider"]')) {
    var sRoom = el.getAttribute('data-room');
    var sEntity = el.getAttribute('data-entity');
    var sAspect = el.getAttribute('data-aspect');
    sendCmd(sRoom, sEntity, sAspect, el.step === 'any' ? parseFloat(el.value) : parseInt(el.value, 10));
    delete localState.sliderDrag[sEntity + '|' + sAspect];
    scheduleRender();
    return;
  }
  if (el.matches('[data-action="param-time"]')) {
    var unit2 = el.getAttribute('data-unit');
    var param2 = el.getAttribute('data-param');
    var prevKey = 'home/config/' + unit2 + '/' + param2;
    var prevValue = store.config[prevKey];
    sendParam(unit2, param2, el.value, function () {
      el.value = prevValue !== undefined ? prevValue : el.value;
    });
    return;
  }
  if (el.matches('[data-action="param-text"]')) {
    var unit3 = el.getAttribute('data-unit');
    var param3 = el.getAttribute('data-param');
    var prevKey3 = 'home/config/' + unit3 + '/' + param3;
    var prevValue3 = store.config[prevKey3];
    sendParam(unit3, param3, el.value, function () {
      el.value = prevValue3 !== undefined ? prevValue3 : el.value;
    });
    return;
  }
});

// live drag feedback: keep sliders responsive without re-render clobbering them
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!el.matches) return;

  if (el.matches('[data-action="slider"]')) {
    var kind = el.getAttribute('data-kind');
    var room = el.getAttribute('data-room');
    var entity = el.getAttribute('data-entity');
    var key = room + '/' + entity + '/' + kind;
    var pct = parseInt(el.value, 10);
    localState.sliderDrag[key] = pct;
    var valEl = el.parentElement.querySelector('.sval');
    if (valEl) {
      if (kind === 'brightness') {
        valEl.textContent = pct + '%';
      } else {
        var kelvin = Math.round(1e6 / pct / 100) * 100;
        valEl.textContent = kelvin + ' K';
      }
    }
    return;
  }
  if (el.matches('[data-action="param-slider"]')) {
    var unit = el.getAttribute('data-unit');
    var param = el.getAttribute('data-param');
    var slideKey = unit + '|' + param;
    localState.sliderDrag[slideKey] = el.value;
    var valEl2 = el.parentElement.querySelector('.sval');
    if (valEl2) valEl2.textContent = el.value;
    return;
  }
  if (el.matches('[data-action="aspect-slider"]')) {
    localState.sliderDrag[el.getAttribute('data-entity') + '|' + el.getAttribute('data-aspect')] = el.value;
    var valEl3 = el.parentElement.querySelector('.sval');
    if (valEl3) valEl3.textContent = el.value;
    return;
  }
});

// ---- relative-time ticker ----

setInterval(function () {
  if (currentView() !== 'health') scheduleRender(); // relative times live on every other view
}, 30000);

/* Some commands are never answered by anything: the adapter is deaf, the
 * device is off. "No confirmation" is a real outcome, and the page must
 * not let it pass for success. */
setInterval(function () {
  var expired = logic.expirePending(pending, Date.now());
  expired.forEach(announceOutcome);
  if (expired.length) scheduleRender();
  // An ended command's line goes when its time is up, which no delta will
  // prompt. Only the lines are redrawn, and only when one went: rebuilding
  // the view would replace a button between a finger's press and its
  // release, and the tap would be lost; redrawing them every second would
  // have a screen reader re-announce each one.
  else if (logic.pruneRecent(recent, Date.now())) markPendingControls();
}, 1000);

// ---- boot ----

render();
loadModel();
connectWs();

})();
</script>
