<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>homeostat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 11 L12 3 L21 11 V21 H14 V14 H10 V21 H3 Z' fill='%2318181b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/leaflet.css">
<style>
:root {
  --bg: #f6f6f7; --card: #ffffff; --border: #e4e4e7; --ink: #18181b;
  --secondary: #52525b; --muted: #a1a1aa; --accent: #2a78d6; --accent-tint: rgba(42,120,214,.10);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101012; --card: #1b1b1f; --border: #2a2a30; --ink: #f4f4f5;
    --secondary: #b0b0b8; --muted: #6b6b74; --accent: #3987e5; --accent-tint: rgba(57,135,229,.14);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 13.5px; line-height: 1.5; }
button, input { font-family: inherit; font-size: inherit; }
a { color: inherit; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

#app { display: flex; min-height: 100vh; }

/* nav rail (desktop) */
#rail { width: 210px; flex: 0 0 210px; background: var(--card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 12px; }
#rail .wordmark { font-size: 16px; font-weight: 700; padding: 4px 12px 20px; }
#rail nav { display: flex; flex-direction: column; gap: 2px; }
#rail nav button { text-align: left; border: none; border-left: 3px solid transparent; background: transparent;
  color: var(--secondary); font-size: 13.5px; padding: 10px 12px; border-radius: 0 6px 6px 0; cursor: pointer;
  min-height: 40px; transition: background-color 140ms ease, color 140ms ease; }
#rail nav button:hover { background: var(--accent-tint); }
#rail nav button.active { border-left-color: var(--accent); padding-left: 9px; color: var(--ink); font-weight: 600; }
/* fixed chrome under the nav: Health and Not shown are never views */
#rail .health-pin { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); font-size: 11px;
  display: flex; flex-direction: column; gap: 2px; }
#rail .pin-btn { text-align: left; border: none; border-left: 3px solid transparent; background: transparent; color: var(--secondary);
  padding: 8px 12px; border-radius: 0 6px 6px 0; cursor: pointer; font-size: 11px; transition: background-color 140ms ease; }
#rail .pin-btn:hover { background: var(--accent-tint); }
#rail .pin-btn.active { border-left-color: var(--accent); padding-left: 9px; color: var(--ink); }
#rail .pin-btn .label { color: var(--muted); font-weight: 600; letter-spacing: .08em; font-size: 10.5px;
  text-transform: uppercase; margin-bottom: 6px; }
#rail .pin-btn.active .label { color: var(--accent); }
#rail .pin-btn .row { display: flex; align-items: center; gap: 6px; color: var(--secondary); padding: 2px 0; }

/* main column */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar { display: none; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
#topbar .wordmark { font-size: 15px; font-weight: 700; }
#banner { display: none; background: var(--warning); color: #1c1917; font-size: 12.5px; text-align: center; padding: 6px; }
#banner.show { display: block; }
#view { padding: 24px 24px 96px; max-width: 1100px; width: 100%; }
h1.view-title { font-size: 20px; margin: 0 0 16px; }

/* bottom tabs (mobile) */
#tabs { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
  border-top: 1px solid var(--border); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); z-index: 10; }
#tabs .row { display: flex; }
#tabs button { flex: 1; border: none; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 6px 2px; min-height: 44px; cursor: pointer; }
#tabs button svg { display: block; }
#tabs button .tab-label { font-size: 10px; }
#tabs button.active { color: var(--accent); font-weight: 600; }

@media (max-width: 720px) {
  #rail { display: none; }
  #topbar { display: flex; }
  #tabs { display: block; }
  #view { padding: 16px 16px 96px; }
}

/* toast */
#toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--ink);
  color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0;
  pointer-events: none; transition: opacity 140ms ease; max-width: 90vw; z-index: 20; }
#toast.show { opacity: 1; }

/* a command in flight (issue #94): the tap is acknowledged immediately,
 * and the control stops taking taps until something ends the command —
 * a readback, an arbiter refusal, an adapter's drop, or the timeout */
.cmd-pending { position: relative; opacity: .6; pointer-events: none; }
.cmd-pending::after { content: ''; position: absolute; top: 50%; left: 50%; width: 13px; height: 13px;
  margin: -7px 0 0 -7px; border: 2px solid var(--muted); border-top-color: transparent;
  border-radius: 50%; animation: cmd-spin 700ms linear infinite; }
@keyframes cmd-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .cmd-pending::after { animation: none; border-top-color: var(--muted); opacity: .5; }
}

/* cards / widgets */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.card + .card { margin-top: 16px; }
.card.clickable { cursor: pointer; transition: border-color 140ms ease, box-shadow 140ms ease; }
.card.clickable:hover { border-color: var(--muted); box-shadow: 0 2px 8px rgba(0,0,0,.07); }
.card-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; align-items: start; }
.grid > .span-all { grid-column: 1 / -1; }
.grid > .card + .card { margin-top: 0; } /* the gap is the grid's; the stacked-card rule above is for columns */
.chart-card { height: 120px; margin: 8px 0 4px; }
/* unit card: head, then the manifest's relations as sections */
.unit-card .unit-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin: -4px -8px 4px; padding: 4px 8px; }
.unit-card .unit-name { font-size: 15px; font-weight: 600; }
.unit-card .unit-desc { font-size: 12.5px; color: var(--secondary); margin-top: 1px; }
.unit-card .section-label { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
.unit-card .param-row:first-of-type { border-top: none; }
.muted { color: var(--secondary); }
.faint { color: var(--muted); }

.row-clickable { cursor: pointer; transition: background-color 140ms ease; border-radius: 6px; }
.row-clickable:hover { background-color: var(--accent-tint); }

/* signal tiles */
.big, .stat-value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .big { margin: 6px 0 4px; }
.tile .big.stale { color: var(--muted); text-decoration: line-through dotted; }
.tile .caption { font-size: 12px; color: var(--muted); }

/* charts (sparklines + detail chart) */
.chart-wrap { position: relative; width: 100%; }
.chart-wrap svg { display: block; width: 100%; height: 100%; }
.chart-tile { height: 36px; }
.chart-row { height: 28px; }
.chart-detail { height: 220px; margin: 12px 0 4px; }
.chart-timeline { height: 64px; margin: 12px 0 4px; }
.chart-empty { height: 100%; min-height: 36px; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 12px; }
.chart-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  vector-effect: non-scaling-stroke; }
.chart-area { fill: var(--accent); opacity: .08; stroke: none; }
.chart-dot { fill: var(--accent); }
.chart-grid { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart-crosshair { stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.chart-crosshair-dot { fill: var(--accent); }
.chart-ylabel { position: absolute; right: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }
.chart-ylabel-top { top: 0; }
.chart-ylabel-bottom { bottom: 0; }
.chart-loading { opacity: .5; transition: opacity 140ms ease; }
/* timeline (bool / string history): one band per run */
.tl-on { fill: var(--accent); }
.tl-off { fill: var(--accent); opacity: .12; }
.tl-a { fill: var(--accent); opacity: .55; }
.tl-b { fill: var(--accent); opacity: .25; }

#chart-tooltip { position: fixed; left: 0; top: 0; background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.14); pointer-events: none;
  opacity: 0; transition: opacity 100ms ease; z-index: 50; max-width: 220px; }
#chart-tooltip.show { opacity: 1; }
#chart-tooltip-value { font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; font-size: 13px; }
#chart-tooltip-time { color: var(--secondary); font-size: 12px; margin-top: 2px; }

/* deviations list */
.dev-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 10px 8px; margin: 0 -8px; border-top: 1px solid var(--border); min-height: 40px; }
.dev-row:first-of-type { border-top: none; padding-top: 4px; }
.dev-main .title { font-weight: 600; font-size: 13px; }
.dev-main .detail { font-size: 12px; color: var(--secondary); margin-top: 2px; }
.dev-tag { font-size: 10px; color: var(--muted); white-space: nowrap; margin-top: 2px; }
.dev-btn { border: 1px solid var(--border); background: var(--card); color: var(--secondary);
  border-radius: 14px; padding: 4px 12px; font-size: 12px; white-space: nowrap; cursor: pointer; }
.dev-btn:hover { border-color: var(--muted); color: var(--ink); }
.equilibrium { display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 48px 24px; color: var(--secondary); font-size: 15px; text-align: center; }
.equilibrium .eq-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); opacity: .55; }

/* map (person entities) */
.map-wrap { height: 320px; border-radius: 8px; overflow: hidden; background: var(--bg); }
.map-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
.map-nofix { font-size: 12px; color: var(--secondary); margin-top: 8px; }
.person-marker { position: relative; }
.person-marker-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
  border: 2px solid var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.person-marker-label { position: absolute; left: 16px; top: -5px; white-space: nowrap; font-size: 11px;
  font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px; }

/* room cards */
.room-card { margin-bottom: 16px; }
.room-card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entity-row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 40px; padding: 6px 8px; margin: 0 -8px; border-top: 1px solid var(--border); }
.entity-row:first-of-type { border-top: none; }
.entity-name { font-size: 13px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entity-sub { margin-top: 2px; }
/* a multi-aspect sensor's readings, under its head row */
.entity-row.sensor-reading { min-height: 34px; }
.sensor-reading .entity-name { padding-left: 12px; font-size: 12px; color: var(--secondary); }
.entity-row .muted.stale { color: var(--muted); text-decoration: line-through dotted; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; flex: 0 0 auto; }
.dot-on { background: var(--ink); }
.dot-off { background: transparent; border: 1.4px solid var(--muted); }

/* toggle switch */
.toggle { width: 40px; height: 22px; border-radius: 11px; background: var(--border);
  position: relative; cursor: pointer; flex: 0 0 40px; transition: background-color 140ms ease; }
.toggle .knob { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--card); border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.2);
  transition: left 140ms ease; }
.toggle.on { background: var(--accent); }
.toggle.disabled { opacity: .4; cursor: default; }
.toggle.on .knob { left: 20px; border-color: var(--accent); }

/* slider row */
.slider-row { display: flex; align-items: center; gap: 12px; padding: 6px 0 6px 18px; font-size: 12px; }
.slider-row .slabel { flex: 0 0 70px; color: var(--secondary); }
.slider-row .sval { flex: 0 0 60px; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; width: 100%; height: 2px;
  background: var(--border); border-radius: 1px; outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); cursor: pointer; border: 2px solid var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
  cursor: pointer; border: 2px solid var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
input[type=range]::-moz-range-track { background: var(--border); height: 2px; border-radius: 1px; }

/* climate stepper */
.stepper { display: flex; align-items: center; gap: 6px; }
.step-btn { border: 1px solid var(--border); background: var(--card); color: var(--secondary); border-radius: 6px;
  width: 26px; height: 26px; font-size: 14px; line-height: 1; cursor: pointer; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center; transition: background-color 140ms ease, border-color 140ms ease; }
.step-btn:hover { border-color: var(--muted); }
.step-btn:disabled { opacity: .4; cursor: default; }
.stepper-value { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink); }

/* setpoint controls */
.param-row { padding: 12px 0; border-top: 1px solid var(--border); }
.param-row:first-of-type { border-top: none; }
.param-row.flash-highlight { animation: flash-highlight 1.5s ease; }
@keyframes flash-highlight { from { background: var(--accent-tint); } to { background: transparent; } }
.param-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.param-readonly { font-size: 14px; }
.tier-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 4px; vertical-align: middle; }
.param-head .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.param-caption { font-size: 12px; color: var(--muted); margin-top: 4px; cursor: help; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--border); background: var(--card); color: var(--secondary); border-radius: 14px;
  padding: 6px 12px; font-size: 12px; cursor: pointer; min-height: 32px; transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
.seg button:hover { border-color: var(--muted); }
.seg button.active { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); font-weight: 600; }
input[type=text], input[type=time] { border: 1px solid var(--border); background: var(--card); color: var(--ink);
  border-radius: 6px; padding: 8px 10px; font-size: 13px; }

/* chips (rooms view) */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { border: 1px solid var(--border); background: var(--card); color: var(--secondary); border-radius: 14px;
  padding: 6px 14px; font-size: 12.5px; cursor: pointer; min-height: 32px; transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
.chip:hover { border-color: var(--muted); }
.chip.active { background: var(--accent-tint); color: var(--accent); border-color: var(--accent); font-weight: 600; }

/* health cards */
.health-card { display: flex; flex-direction: column; gap: 4px; }
.health-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.health-head .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-badge { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--secondary); cursor: help; white-space: nowrap; }
.status-glyph { font-size: 12px; width: 14px; text-align: center; }
.status-glyph.status-running { color: var(--good); }
.status-glyph.status-starting { color: var(--muted); }
.status-glyph.status-backoff { color: var(--warning); }
.status-glyph.status-open { color: var(--critical); }
.status-glyph.status-stopped { color: var(--muted); }
.health-meta { font-size: 12px; color: var(--muted); }
.event-feed { margin-top: 10px; }
.event-row { font-size: 12px; padding: 6px 0; border-top: 1px solid var(--border); color: var(--secondary); }
.event-row:first-of-type { border-top: none; }
.event-row .ts { color: var(--muted); margin-right: 6px; cursor: help; }
.badge-arbitrated { font-size: 9px; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--border);
  border-radius: 8px; padding: 2px 6px; margin-left: 6px; }
.badge-motion { font-size: 9px; letter-spacing: .05em; color: var(--accent, #e67); border: 1px solid currentColor;
  border-radius: 8px; padding: 2px 6px; margin-left: 6px; }
.camera-poster { width: 100%; border-radius: 8px; display: block; background: #000; min-height: 80px; }
video-rtc { display: block; width: 100%; min-height: 180px; background: #000; border-radius: 8px; overflow: hidden; }
video-rtc video { width: 100%; display: block; }
.aspect-row { font-size: 12px; color: var(--secondary); padding: 6px 4px; }
.aspect-row.row-clickable { min-height: 40px; display: flex; align-items: center; }
/* described entity on a room card: head line with the first control, readings under it */
.entity-row.described-card { flex-direction: column; align-items: stretch; gap: 4px; }
.described-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
.described-readings { display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 12px; color: var(--muted); }
.described-readings b { font-weight: 500; color: var(--secondary); font-variant-numeric: tabular-nums; }
.described-readings .stale, .described-readings .stale b { color: var(--muted); text-decoration: line-through dotted; }
.described-readings .sep { color: var(--border); }
.described-readings .card-badge { margin-left: auto; }
.described-readings .card-badge .badge-arbitrated { margin-left: 0; }
/* described aspects (docs/design.md, Aspect descriptors): label · value, a control when declared */
.aspect-row.described { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.aspect-row .aspect-label { color: var(--ink); font-size: 13px; }
.aspect-row .aspect-value { color: var(--secondary); font-variant-numeric: tabular-nums; }
.aspect-row .aspect-value.stale { color: var(--muted); text-decoration: line-through dotted; }
.aspect-row .stale-mark { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-left: 6px; }
.group-toggle { background: none; border: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; padding: 0; margin-top: 20px; }
.empty-hint { color: var(--muted); font-size: 12.5px; padding: 8px 0; }
.log-feed { margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
.log-line { padding: 2px 0; white-space: pre-wrap; word-break: break-all; color: var(--secondary); }
.log-line .ts { color: var(--muted); margin-right: 6px; }
.log-line.stderr { color: var(--critical); }

/* stat row (history detail) */
.stat-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.stat-item { flex: 1 1 80px; }
.stat-item .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }

/* detail overlay */
#overlay-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none;
  transition: opacity 140ms ease; z-index: 30; }
#overlay-backdrop.show { opacity: 1; pointer-events: auto; }
#overlay-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100vw;
  background: var(--card); border-left: 1px solid var(--border); box-shadow: -4px 0 24px rgba(0,0,0,.14);
  transform: translateX(100%); transition: transform 200ms ease; z-index: 31;
  display: flex; flex-direction: column; outline: none; }
#overlay-panel.show { transform: translateX(0); }
.overlay-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.overlay-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overlay-close { border: none; background: transparent; color: var(--secondary); font-size: 20px; line-height: 1;
  cursor: pointer; width: 32px; height: 32px; flex: 0 0 auto; border-radius: 6px; transition: background-color 140ms ease; }
.overlay-close:hover { background: var(--bg); }
.overlay-body { padding: 16px; overflow-y: auto; flex: 1 1 auto; }

@media (max-width: 720px) {
  #overlay-panel { top: auto; left: 0; right: 0; width: auto; height: 88vh; border-left: none;
    border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; transform: translateY(100%); }
  #overlay-panel.show { transform: translateY(0); }
}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="wordmark">homeostat</div>
    <nav id="rail-nav"></nav>
    <div class="health-pin" id="health-pin"></div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div class="wordmark">homeostat</div>
    </div>
    <div id="banner">reconnecting&hellip;</div>
    <div id="view"></div>
  </div>
</div>
<nav id="tabs"><div class="row" id="tabs-row"></div></nav>
<div id="toast"></div>

<div id="overlay-backdrop" data-action="overlay-close"></div>
<div id="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title" tabindex="-1">
  <div class="overlay-head">
    <div class="overlay-title" id="overlay-title"></div>
    <button class="overlay-close" id="overlay-close" data-action="overlay-close" aria-label="Close">&times;</button>
  </div>
  <div class="overlay-body" id="overlay-body"></div>
</div>

<div id="chart-tooltip">
  <div id="chart-tooltip-value"></div>
  <div id="chart-tooltip-time"></div>
</div>

<script src="/assets/leaflet.js"></script>
<script src="/assets/protomaps-leaflet.js"></script>
<script src="/assets/dashboard-logic.js"></script>
<script type="module">
  // The vendored go2rtc player (assets/README.md). MSE only: WebRTC can't
  // ride the dashboard's /api/camera proxy (docs/design.md, Cameras).
  import { VideoRTC } from '/assets/video-rtc.js';
  customElements.define('video-rtc', VideoRTC);
</script>
<script>
'use strict';
(function () {

// Tab icons by generated view; a file's own view gets the generic one.
var TAB_ICONS = {
  view: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="9" y1="9.5" x2="9" y2="20"/></svg>',
  notshown: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>',
  now: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 8 12 10 6 14 18 16 12 21 12"/></svg>',
  setpoints: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="4" x2="6" y2="20"/><circle cx="6" cy="9" r="2.2" fill="currentColor" stroke="none"/><line x1="12" y1="4" x2="12" y2="20"/><circle cx="12" cy="16" r="2.2" fill="currentColor" stroke="none"/><line x1="18" y1="4" x2="18" y2="20"/><circle cx="18" cy="11" r="2.2" fill="currentColor" stroke="none"/></svg>',
  rooms: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.4"/></svg>',
  health: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5 C 6 15.8 2.5 12.6 2.5 8.6 C 2.5 5.8 4.7 3.6 7.4 3.6 C 9 3.6 10.6 4.4 12 6 C 13.4 4.4 15 3.6 16.6 3.6 C 19.3 3.6 21.5 5.8 21.5 8.6 C 21.5 12.6 18 15.8 12 20.5 Z"/></svg>'
};
var RANGE_PRESETS = [{ label: '1h', hours: 1 }, { label: '6h', hours: 6 }, { label: '24h', hours: 24 }, { label: '7d', hours: 168 }];
var CHART_VBW = 400; // internal viewBox width used for coordinate math; visual width is CSS 100%

var store = {
  model: { zones: {}, entities: [], units: [] },
  state: {},
  health: {},
  config: {},
  aspects: {},      // entity -> its adapter's aspect descriptor (from discovery)
  events: [],
  lastSeen: {},
  connected: false,
  view: 'now',
  roomsFilter: 'all'
};

/* In-flight commands, keyed room/entity/aspect (issue #94). Deliberately
 * outside `store`: the store is the house's state as the bus reports it,
 * and a pending command is this browser's private business — nothing on
 * the bus knows this tab tapped a button. */
var pending = {};

var localState = {
  sliderDrag: {},   // key -> true while user is dragging
  sparklines: {},   // entity|aspect -> {points:[], window, loaded:bool, loading:bool}
  charts: {}        // entity|aspect|hours -> the same, for chart widgets
};

// detail overlay state (right slide-over / mobile sheet)
var overlay = {
  open: false,
  type: null,        // 'history' | 'entity' | 'unit'
  entity: null,       // for history/entity: entity object
  aspect: null,        // for history: aspect name
  shape: 'chart',      // for history: 'chart' (a number) | 'timeline' (a bool or string)
  shapeSettled: true,  // false while the shape was guessed without a live value
  unit: null,           // for unit: unit name
  range: 24,             // hours, for history
  rangeData: {},          // hours -> {points, window, loaded, loading}
  lastPoints: null,
  log: null,               // for unit: {lines, loaded, loading}
  expanded: {}              // for entity: group -> true when a collapsed section is opened
};

// chartId -> {coords, width, height, aspect} — populated while building chart
// markup, consumed by the pointermove/pointerleave hover wiring.
var chartRegistry = {};

// ---- helpers ----

// The pure decision logic lives in /assets/dashboard-logic.js (tested by
// `node --test tests/js`); this file keeps the DOM wiring.
var logic = window.HomeostatLogic;

function byId(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
var titleCase = logic.titleCase;
var entityKey = logic.entityKey;

function unitsByName() {
  var m = {};
  (store.model.units || []).forEach(function (u) { m[u.name] = u; });
  return m;
}

function findEntity(room, name) {
  var list = store.model.entities || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].room === room && list[i].name === name) return list[i];
  }
  return null;
}

// current value for a given entity/aspect from the state map
function stateValue(room, entity, aspect) {
  return logic.stateValue(store.state, room, entity, aspect);
}

// aspects present in state for an entity (the history title's "· aspect" suffix)
function aspectsFor(entity) {
  var prefix = 'home/state/' + entity.room + '/' + entity.name + '/';
  return Object.keys(store.state).filter(function (k) { return k.indexOf(prefix) === 0; })
    .map(function (k) { return k.slice(prefix.length); });
}

function descriptorField(entity, aspect) {
  var d = store.aspects[entity.name];
  return (d && d.fields && d.fields[aspect]) || null;
}

function unitLabel(unitName) {
  var u = unitsByName()[unitName];
  return u ? u.label : unitName;
}

// ---- networking ----

function loadModel() {
  fetch('/api/model').then(function (r) { return r.json(); }).then(function (m) {
    store.model = m || store.model;
    scheduleRender();
  }).catch(function () { /* keep defaults; page still renders */ });
}

var ws = null;
var wsBackoff = 1000;

function connectWs() {
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    ws = new WebSocket(proto + '//' + location.host + '/ws');
  } catch (e) {
    scheduleReconnect();
    return;
  }
  ws.onopen = function () {
    store.connected = true;
    wsBackoff = 1000;
    updateBanner();
  };
  ws.onclose = function () {
    store.connected = false;
    updateBanner();
    scheduleReconnect();
  };
  ws.onerror = function () {
    try { ws.close(); } catch (e) {}
  };
  ws.onmessage = function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleWsMessage(msg);
  };
}

function scheduleReconnect() {
  setTimeout(function () {
    connectWs();
  }, wsBackoff);
  wsBackoff = Math.min(wsBackoff * 2, 30000);
}

function updateBanner() {
  var b = byId('banner');
  if (!b) return;
  b.classList.toggle('show', !store.connected);
}

function handleWsMessage(msg) {
  var applied = logic.applyMessage(store, msg, Date.now() / 1000);
  if (!applied) return;
  if (applied === 'state') {
    trackLastSeen(msg.key);
    appendSparklinePoint(msg.key, msg.value);
    logic.resolveFromState(pending, msg.key); // stage 4: the device answered
  }
  if (applied === 'event') {
    // stages 2 and 3: the arbiter refused it, or an adapter dropped it
    var outcome = logic.resolveFromEvent(pending, msg.value);
    if (outcome) announceOutcome(outcome);
  }
  scheduleRender();
}

// key like home/state/{room}/{entity}/occupancy -> track lastSeen per
// entity (both presence aspect spellings; see dashboard-logic.js).
function trackLastSeen(key) {
  var pe = logic.presenceEntityFromKey(key);
  if (pe) store.lastSeen[pe] = Date.now();
}

function presenceValue(entity) {
  return logic.presenceValue(store.state, entity);
}

function appendSparklinePoint(key, value) {
  var parts = key.split('/');
  if (parts[0] !== 'home' || parts[1] !== 'state' || parts.length < 5) return;
  if (typeof value !== 'number') return;
  var entity = parts[3], aspect = parts[4];
  var sk = entity + '|' + aspect;
  var s = localState.sparklines[sk];
  if (!s || !s.loaded) return; // only append once history has been fetched
  s.points.push({ ts: new Date().toISOString(), value: value });
  if (s.points.length > 500) s.points.shift();
}

// ---- commands ----

/* A command is a proposal passing through stages, and the page shows
 * which one it is in (issue #94): pending from the tap, then confirmed by
 * readback, held by the arbiter, rejected by the adapter, or unconfirmed
 * when nothing answers. The envelope's id, handed back by /api/cmd, is
 * what ties an event to the command it ended. */
function sendCmd(room, entity, aspect, value) {
  var spec = entitySpec(room, entity);
  fetch('/api/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Homeostat': 'family' },
    body: JSON.stringify({ room: room, entity: entity, aspect: aspect, value: value })
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
    return r.json();
  }).then(function (body) {
    // Stage 1 only: the envelope is on home/cmd, nothing more. An older
    // dashboard unit that returns no id cannot be tracked, and showing a
    // pending state that can never resolve is worse than showing none.
    if (!body || !body.id) return;
    logic.trackCommand(pending, {
      id: body.id, room: room, entity: entity, aspect: aspect, value: value,
      capability: spec ? spec.capability : null
    }, Date.now());
    scheduleRender();
  }).catch(function (e) {
    // Refused before it ever reached the bus: nothing to wait for.
    clearPending(room, entity, aspect);
    toast(errText(e));
    scheduleRender();
  });
}

function entitySpec(room, entity) {
  var entities = (store.model && store.model.entities) || [];
  for (var i = 0; i < entities.length; i++) {
    if (entities[i].room === room && entities[i].name === entity) return entities[i];
  }
  return null;
}

function clearPending(room, entity, aspect) {
  delete pending[logic.pendingKey(room, entity, aspect)];
}

/* What the family is told when a command ends somewhere other than the
 * device. A refusal is deliberately not worded as a failure: the command
 * was well-formed and simply lost to a higher band, and a retry would
 * lose identically. */
function announceOutcome(outcome) {
  if (outcome.outcome === 'held') {
    toast('Held by ' + outcome.by + (outcome.actor ? ' (' + outcome.actor + ')' : ''));
  } else if (outcome.outcome === 'rejected') {
    toast('Rejected: ' + outcome.reason);
  } else if (outcome.outcome === 'unconfirmed') {
    toast('No confirmation from the device');
  }
}

function sendLightsOff() {
  fetch('/api/lights/off', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Homeostat': 'family' }
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
  }).catch(function (e) {
    toast(errText(e));
  });
}

function sendParam(unit, param, value, onError) {
  fetch('/api/param', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Homeostat': 'family' },
    body: JSON.stringify({ unit: unit, param: param, value: value })
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
  }).catch(function (e) {
    toast(errText(e));
    if (onError) onError();
  });
}

function errText(e) {
  var msg = e && e.message ? e.message : String(e);
  try {
    var parsed = JSON.parse(msg);
    if (parsed && parsed.error) return parsed.error;
  } catch (ex) { /* not json */ }
  return msg;
}

var toastTimer = null;
function toast(msg) {
  var el = byId('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

// ---- history fetch ----
//
// The recorder folds the window (docs/design.md, Read path): a line asks
// for one bucket per drawn column, a timeline for the runs of the state.
// The window travels with the points so the chart places them by time.

function fetchHistory(entity, aspect, hours, shape) {
  var win = { from: Date.now() - hours * 3600e3, to: Date.now() };
  var url = '/api/history?entity=' + encodeURIComponent(entity) + '&aspect=' + encodeURIComponent(aspect) + '&hours=' + hours +
    (shape === 'timeline' ? '&changes=1' : '&bucket=' + logic.bucketSeconds(hours, CHART_VBW));
  return fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var pts = [];
      (data.series || []).forEach(function (series) {
        (series.points || []).forEach(function (p) { pts.push(p); });
      });
      return { points: pts, window: win, loaded: true, loading: false };
    })
    .catch(function () {
      return { points: [], window: win, loaded: true, loading: false };
    });
}

// tile/row sparklines: numeric readings, fixed 24h window
function ensureHistory(entity, aspect) {
  var sk = entity + '|' + aspect;
  var s = localState.sparklines[sk];
  if (s && (s.loaded || s.loading)) return;
  localState.sparklines[sk] = { points: [], loaded: false, loading: true };
  fetchHistory(entity, aspect, 24, 'chart').then(function (loaded) {
    localState.sparklines[sk] = loaded;
    scheduleRender();
  });
}

// detail overlay, range-selectable
function fetchHistoryRange(entityName, aspect, hours, shape) {
  var rd = overlay.rangeData[hours];
  if (rd && (rd.loaded || rd.loading)) return;
  overlay.rangeData[hours] = { points: [], loaded: false, loading: true };
  fetchHistory(entityName, aspect, hours, shape).then(function (loaded) {
    if (!overlay.shapeSettled && loaded.points.length) {
      // guessed without a live value: the recorded values have the say
      overlay.shapeSettled = true;
      var actual = logic.historyShape(loaded.points[0].value);
      if (actual !== overlay.shape && overlay.open && overlay.aspect === aspect) {
        overlay.shape = actual;
        overlay.rangeData = {};
        fetchHistoryRange(entityName, aspect, hours, actual);
        return;
      }
    }
    overlay.rangeData[hours] = loaded;
    overlay.lastPoints = loaded.points;
    if (overlay.open && overlay.type === 'history') renderOverlayContent();
  });
}

// ---- log fetch (detail overlay, unit) ----

function fetchUnitLog(unitName) {
  overlay.log = { lines: [], loaded: false, loading: true };
  fetch('/api/logs?unit=' + encodeURIComponent(unitName) + '&lines=100')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      overlay.log = { lines: data || [], loaded: true, loading: false };
      if (overlay.open && overlay.type === 'unit') renderOverlayContent();
    })
    .catch(function () {
      overlay.log = { lines: [], loaded: true, loading: false };
      if (overlay.open && overlay.type === 'unit') renderOverlayContent();
    });
}

// ---- render scheduling ----

var renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function () {
    renderQueued = false;
    render();
  });
}

// ---- nav / shell ----

function healthWorstAndCount() {
  var order = { open: 0, backoff: 1, starting: 2, stopped: 2, running: 3 };
  var worst = null;
  var okCount = 0;
  var total = 0;
  Object.keys(store.health).forEach(function (k) {
    var h = store.health[k] || {};
    total++;
    var status = h.status || 'running';
    if (status === 'running') okCount++;
    var rank = order[status];
    if (rank === undefined) rank = 3;
    if (worst === null || rank < worst.rank) {
      worst = { rank: rank, status: status, key: k };
    }
  });
  return { worst: worst, ok: okCount, total: total };
}

function statusGlyph(status) {
  if (status === 'running') return '●'; // ●
  if (status === 'backoff') return '▲'; // ▲
  if (status === 'open') return '✕'; // ✕
  return '○'; // ○ starting / stopped / unknown
}

function statusChipHtml(status) {
  return '<span class="status-badge"><span class="status-glyph status-' + esc(status) + '">' + statusGlyph(status) + '</span>' + esc(status) + '</span>';
}

function healthTooltip(h) {
  var restarts = (h.restarts !== undefined && h.restarts !== null) ? h.restarts : 0;
  var backoff = (h.backoff_ms !== undefined && h.backoff_ms !== null) ? h.backoff_ms : 0;
  var exitCode = (h.last_exit_code !== undefined && h.last_exit_code !== null) ? h.last_exit_code : 0;
  return 'restarts ' + restarts + ' · backoff ' + backoff + 'ms · exit ' + exitCode;
}

function fmtOrDash(v) {
  return (v === undefined || v === null) ? '—' : String(v);
}

var unitNameFromHealthKey = logic.unitNameFromHealthKey;

// The nav is the file's views (dashboard-logic.js, viewsOf); Health and
// Not shown are fixed chrome below it, never views the file can name.
function currentView() {
  var views = logic.viewsOf(store.model);
  if (store.view === 'health' || store.view === 'notshown') return store.view;
  var named = views.filter(function (v) { return v.name === store.view; })[0];
  return named ? named.name : (views.length ? views[0].name : 'notshown');
}

function renderShell() {
  var views = logic.viewsOf(store.model);
  var current = currentView();
  var unplaced = logic.placement(store.model);
  var notShownCount = unplaced.entities.length + unplaced.params.length;

  var nav = byId('rail-nav');
  nav.innerHTML = views.map(function (v) {
    return '<button data-view="' + esc(v.name) + '" class="' + (current === v.name ? 'active' : '') + '">' + esc(v.label) + '</button>';
  }).join('');

  var tabs = byId('tabs-row');
  var tabHtml = views.map(function (v) {
    return '<button data-view="' + esc(v.name) + '" class="' + (current === v.name ? 'active' : '') + '">' +
      (TAB_ICONS[v.kind] || TAB_ICONS.view) + '<span class="tab-label">' + esc(v.label) + '</span></button>';
  });
  tabHtml.push('<button data-view="health" class="' + (current === 'health' ? 'active' : '') + '">' + TAB_ICONS.health + '<span class="tab-label">Health</span></button>');
  tabHtml.push('<button data-view="notshown" class="' + (current === 'notshown' ? 'active' : '') + '">' + TAB_ICONS.notshown +
    '<span class="tab-label">Not shown' + (notShownCount ? ' · ' + notShownCount : '') + '</span></button>');
  tabs.innerHTML = tabHtml.join('');

  var hw = healthWorstAndCount();
  var pin = byId('health-pin');
  var healthRows;
  if (hw.total === 0) {
    healthRows = '<div class="row faint">no units yet</div>';
  } else {
    var worstLine = hw.worst.status === 'running'
      ? ''
      : '<div class="row"><span class="status-glyph status-' + esc(hw.worst.status) + '">' + statusGlyph(hw.worst.status) + '</span>&nbsp;' +
        esc(titleCase(unitNameFromHealthKey(hw.worst.key))) + ' · ' + esc(hw.worst.status) + '</div>';
    healthRows = worstLine +
      '<div class="row"><span class="status-glyph status-running">●</span> ' + hw.ok + '/' + hw.total + ' ok</div>';
  }
  pin.innerHTML = '<button class="pin-btn' + (current === 'health' ? ' active' : '') + '" data-view="health"><div class="label">Health</div>' + healthRows + '</button>' +
    '<button class="pin-btn' + (current === 'notshown' ? ' active' : '') + '" data-view="notshown"><div class="label">Not shown</div>' +
    '<div class="row">' + (notShownCount
      ? esc(unplaced.entities.length + (unplaced.entities.length === 1 ? ' entity' : ' entities') +
        (unplaced.params.length ? ' · ' + unplaced.params.length + (unplaced.params.length === 1 ? ' setpoint' : ' setpoints') : ''))
      : 'everything is on a view') + '</div></button>';

  updateBanner();
}

document.addEventListener('click', function (e) {
  var btn = e.target.closest('[data-view]');
  if (btn) {
    store.view = btn.getAttribute('data-view');
    renderShell();
    renderView();
  }
});

// ---- charts: geometry + markup ----

// Points sit where their timestamps fall in the window — a gap in the
// record stays a gap — and only fall back to even spacing without one.
// A live point past the window's end (a delta after the fetch) extends it.
function computeChartGeometry(points, width, height, pad, win) {
  var vals = points.map(function (p) { return p.value; }).filter(function (v) { return typeof v === 'number'; });
  if (vals.length < 2) return null;
  var min = Math.min.apply(null, vals);
  var max = Math.max.apply(null, vals);
  var span = (max - min) || 1;
  var n = points.length;
  var times = points.map(function (p) { return Date.parse(p.ts); });
  var from = win ? win.from : times[0];
  var to = Math.max(win ? win.to : times[n - 1], times[n - 1]);
  var byTime = times.every(function (t) { return !isNaN(t); }) && to > from;
  var coords = points.map(function (p, i) {
    var f = byTime ? (times[i] - from) / (to - from) : i / (n - 1);
    var x = pad + f * (width - 2 * pad);
    var y = pad + (1 - (p.value - min) / span) * (height - 2 * pad);
    return { x: x, y: y, value: p.value, ts: p.ts };
  });
  return { coords: coords, min: min, max: max };
}

function chartPathData(coords) {
  return coords.map(function (c, i) {
    return (i === 0 ? 'M ' : 'L ') + c.x.toFixed(1) + ' ' + c.y.toFixed(1);
  }).join(' ');
}

function formatChartValue(aspect, v) {
  if (typeof v !== 'number') return String(v);
  return logic.formatAspect(aspect || '', null, v);
}

function formatChartTime(ts) {
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// Builds a chart's markup (line + optional area/gridlines/y-labels) and
// registers its geometry under chartId for hover/tooltip wiring. Guards
// against sparse/empty history with a "no history yet" placeholder.
function buildChart(chartId, points, opts) {
  opts = opts || {};
  var height = opts.height || 36;
  var pad = opts.pad !== undefined ? opts.pad : 3;
  var sizeClass = opts.sizeClass || 'chart-tile';
  var geo = computeChartGeometry(points || [], CHART_VBW, height, pad, opts.window);
  var inner;
  if (!geo) {
    chartRegistry[chartId] = null;
    inner = '<div class="chart-empty">no history yet</div>';
  } else {
    chartRegistry[chartId] = { coords: geo.coords, width: CHART_VBW, height: height, aspect: opts.aspect };
    var d = chartPathData(geo.coords);
    var last = geo.coords[geo.coords.length - 1];
    var svg = '<svg viewBox="0 0 ' + CHART_VBW + ' ' + height + '" preserveAspectRatio="none">';
    if (opts.gridlines) {
      [pad, height / 2, height - pad].forEach(function (y) {
        svg += '<line class="chart-grid" x1="0" y1="' + y.toFixed(1) + '" x2="' + CHART_VBW + '" y2="' + y.toFixed(1) + '"/>';
      });
    }
    if (opts.area) {
      var areaD = d + ' L ' + last.x.toFixed(1) + ' ' + (height - pad) + ' L ' + geo.coords[0].x.toFixed(1) + ' ' + (height - pad) + ' Z';
      svg += '<path class="chart-area" d="' + areaD + '"/>';
    }
    svg += '<path class="chart-line" d="' + d + '"/>';
    svg += '<circle class="chart-dot" cx="' + last.x.toFixed(1) + '" cy="' + last.y.toFixed(1) + '" r="3"/>';
    svg += '<line class="chart-crosshair" x1="0" y1="0" x2="0" y2="' + height + '" style="display:none;"/>';
    svg += '<circle class="chart-crosshair-dot" cx="0" cy="0" r="3" style="display:none;"/>';
    svg += '</svg>';
    inner = svg;
    if (opts.yLabels) {
      inner += '<div class="chart-ylabel chart-ylabel-top">' + esc(formatChartValue(opts.aspect, geo.max)) + '</div>' +
        '<div class="chart-ylabel chart-ylabel-bottom">' + esc(formatChartValue(opts.aspect, geo.min)) + '</div>';
    }
  }
  return '<div class="chart-wrap ' + sizeClass + '" data-chart-id="' + esc(chartId) + '">' + inner + '</div>';
}

// A timeline: one band per run of a bool or string state over the window
// (dashboard-logic.js, timelineRuns). A boolean is a filled band while
// true and a faint one while false; a string's runs alternate two tints
// so each change reads as an edge, and the tooltip names the value.
function buildTimeline(chartId, points, opts) {
  var height = opts.height || 36;
  var sizeClass = opts.sizeClass || 'chart-tile';
  var runs = logic.timelineRuns(points || [], opts.window.from, opts.window.to);
  var inner;
  if (runs.length === 0) {
    chartRegistry[chartId] = null;
    inner = '<div class="chart-empty">no history yet</div>';
  } else {
    var span = opts.window.to - opts.window.from;
    chartRegistry[chartId] = { runs: runs, window: opts.window, width: CHART_VBW, height: height, aspect: opts.aspect, field: opts.field };
    var svg = '<svg viewBox="0 0 ' + CHART_VBW + ' ' + height + '" preserveAspectRatio="none">';
    runs.forEach(function (r, i) {
      var x = (r.start - opts.window.from) / span * CHART_VBW;
      var w = Math.max(1, (r.end - r.start) / span * CHART_VBW);
      var cls = r.value === true ? 'tl-on' : r.value === false ? 'tl-off' : (i % 2 ? 'tl-b' : 'tl-a');
      svg += '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="2" width="' + w.toFixed(1) + '" height="' + (height - 4) + '"/>';
    });
    svg += '<line class="chart-crosshair" x1="0" y1="0" x2="0" y2="' + height + '" style="display:none;"/>';
    svg += '</svg>';
    inner = svg;
  }
  return '<div class="chart-wrap ' + sizeClass + '" data-chart-id="' + esc(chartId) + '">' + inner + '</div>';
}

function minMaxCaption(points) {
  var vals = (points || []).map(function (p) { return p.value; }).filter(function (v) { return typeof v === 'number'; });
  if (vals.length === 0) return '';
  var min = Math.min.apply(null, vals);
  var max = Math.max.apply(null, vals);
  return min.toFixed(1) + '–' + max.toFixed(1) + ' today';
}

// ---- charts: hover crosshair + tooltip ----

function wireChartInteractions(root) {
  (root || document).querySelectorAll('.chart-wrap[data-chart-id]').forEach(function (wrap) {
    var id = wrap.getAttribute('data-chart-id');
    var reg = chartRegistry[id];
    if (!reg) return;
    if (reg.runs) {
      wrap.addEventListener('pointermove', function (ev) { onTimelinePointerMove(wrap, reg, ev); });
    } else if (reg.coords && reg.coords.length >= 2) {
      wrap.addEventListener('pointermove', function (ev) { onChartPointerMove(wrap, reg, ev); });
    } else return;
    wrap.addEventListener('pointerleave', function () { onChartPointerLeave(wrap); });
  });
}

function onChartPointerMove(wrap, reg, ev) {
  var rect = wrap.getBoundingClientRect();
  if (rect.width === 0) return;
  var fx = (ev.clientX - rect.left) / rect.width;
  fx = Math.max(0, Math.min(1, fx));
  var tx = fx * reg.width;
  var c = reg.coords[0];
  reg.coords.forEach(function (p) { if (Math.abs(p.x - tx) < Math.abs(c.x - tx)) c = p; });
  var svg = wrap.querySelector('svg');
  if (!svg) return;
  var line = svg.querySelector('.chart-crosshair');
  var dot = svg.querySelector('.chart-crosshair-dot');
  line.setAttribute('x1', c.x); line.setAttribute('x2', c.x);
  line.style.display = '';
  dot.setAttribute('cx', c.x); dot.setAttribute('cy', c.y);
  dot.style.display = '';
  var px = rect.left + (c.x / reg.width) * rect.width;
  var py = rect.top + (c.y / reg.height) * rect.height;
  showChartTooltip(px, py, formatChartValue(reg.aspect, c.value), formatChartTime(c.ts));
}

function onTimelinePointerMove(wrap, reg, ev) {
  var rect = wrap.getBoundingClientRect();
  if (rect.width === 0) return;
  var fx = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  var t = reg.window.from + fx * (reg.window.to - reg.window.from);
  var run = null;
  reg.runs.forEach(function (r) { if (t >= r.start && t < r.end) run = r; });
  var line = wrap.querySelector('.chart-crosshair');
  if (!line) return;
  var x = fx * reg.width;
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  line.style.display = '';
  if (!run) { hideChartTooltip(); return; }
  showChartTooltip(ev.clientX, rect.top, logic.formatAspect(reg.aspect || '', reg.field, run.value),
    'since ' + formatChartTime(run.start));
}

function onChartPointerLeave(wrap) {
  var line = wrap.querySelector('.chart-crosshair');
  var dot = wrap.querySelector('.chart-crosshair-dot');
  if (line) line.style.display = 'none';
  if (dot) dot.style.display = 'none';
  hideChartTooltip();
}

function showChartTooltip(x, y, valueText, timeText) {
  var tt = byId('chart-tooltip');
  byId('chart-tooltip-value').textContent = valueText;
  byId('chart-tooltip-time').textContent = timeText;
  tt.classList.add('show');
  var ttRect = tt.getBoundingClientRect();
  var left = x + 12;
  var top = y - ttRect.height - 10;
  if (left + ttRect.width > window.innerWidth - 8) left = x - ttRect.width - 12;
  if (left < 8) left = 8;
  if (top < 8) top = y + 12;
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}

function hideChartTooltip() {
  byId('chart-tooltip').classList.remove('show');
}

// ---- widget: entity capability rows (shared by Rooms and generic use) ----

// Controls render inert when this dashboard's manifest does not grant the
// entity's capability (model.commandable): the server refuses such a
// command anyway, and a live-looking control for it would misreport the
// grant table.
function controlDisabled(entity) { return !entity.commandable; }

function widgetForLight(entity) {
  var on = !!stateValue(entity.room, entity.name, 'on');
  var inert = controlDisabled(entity);
  var html = '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' +
    '<span class="toggle ' + (on ? 'on' : '') + (inert ? ' disabled' : '') + '"' + (inert ? '' : ' data-action="toggle-light"') + ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-value="' + (!on) + '"><span class="knob"></span></span>' +
    '</div>';

  if (entity.features && entity.features.indexOf('brightness') !== -1) {
    var b = stateValue(entity.room, entity.name, 'brightness');
    var bkey = entity.room + '/' + entity.name + '/brightness';
    var pct = typeof b === 'number' ? Math.round((b / 254) * 100) : 0;
    if (localState.sliderDrag[bkey] !== undefined) pct = localState.sliderDrag[bkey];
    html += '<div class="slider-row entity-sub"><span class="slabel">brightness</span>' +
      '<input type="range" min="0" max="100" value="' + pct + '"' + (inert ? ' disabled' : '') + ' data-action="slider" data-kind="brightness" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
      '<span class="sval">' + pct + '%</span></div>';
  }
  if (entity.features && entity.features.indexOf('color_temp') !== -1) {
    var ct = stateValue(entity.room, entity.name, 'color_temp');
    var ctkey = entity.room + '/' + entity.name + '/color_temp';
    var mired = typeof ct === 'number' ? ct : 300;
    if (localState.sliderDrag[ctkey] !== undefined) mired = localState.sliderDrag[ctkey];
    var kelvin = Math.round(1e6 / mired / 100) * 100;
    html += '<div class="slider-row entity-sub"><span class="slabel">color temp</span>' +
      '<input type="range" min="150" max="500" value="' + mired + '"' + (inert ? ' disabled' : '') + ' data-action="slider" data-kind="color_temp" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
      '<span class="sval">' + kelvin + ' K</span></div>';
  }
  return html;
}

function widgetForPresence(entity) {
  var occ = presenceValue(entity);
  var seenKey = entity.room + '/' + entity.name;
  var lastSeen = store.lastSeen[seenKey];
  var label = occ ? 'Motion' : 'Clear';
  var extra = lastSeen ? '<span class="faint" title="' + esc(new Date(lastSeen).toLocaleString()) + '"> &middot; ' + esc(relTime(lastSeen)) + '</span>' : '';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' +
    '<span><span class="status-dot ' + (occ ? 'dot-on' : 'dot-off') + '"></span>' + esc(label) + extra + '</span>' +
    '</div>';
}

function widgetForLock(entity) {
  var locked = !!stateValue(entity.room, entity.name, 'locked');
  var badge = entity.write_mode === 'arbitrated' ? '<span class="badge-arbitrated">ARBITRATED</span>' : '';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + badge + '</span>' +
    '<span class="toggle ' + (locked ? 'on' : '') + (controlDisabled(entity) ? ' disabled' : '') + '"' + (controlDisabled(entity) ? '' : ' data-action="toggle-lock"') + ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-value="' + (!locked) + '"><span class="knob"></span></span>' +
    '</div>';
}

function widgetForClimate(entity) {
  var setpoint = stateValue(entity.room, entity.name, 'setpoint');
  var hasSetpoint = typeof setpoint === 'number';
  var readout = hasSetpoint ? setpoint.toFixed(1) + '°' : '—';
  var indoor = stateValue(entity.room, entity.name, 'indoor_temperature');
  var feed = stateValue(entity.room, entity.name, 'feed_temperature');
  var nowParts = [];
  if (typeof indoor === 'number') nowParts.push(indoor.toFixed(1) + '° now');
  if (typeof feed === 'number') nowParts.push(feed.toFixed(1) + '° feed');
  var badge = entity.write_mode === 'arbitrated' ? '<span class="badge-arbitrated">ARBITRATED</span>' : '';
  var disabledAttr = hasSetpoint && !controlDisabled(entity) ? '' : ' disabled';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + badge + '</span>' +
    '<span style="display:flex;align-items:center;gap:10px;">' +
    (nowParts.length ? '<span class="faint">' + esc(nowParts.join(' · ')) + '</span>' : '') +
    '<span class="stepper">' +
    '<button class="step-btn" data-action="climate-step" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-delta="-0.5"' + disabledAttr + '>&minus;</button>' +
    '<span class="stepper-value">' + esc(readout) + '</span>' +
    '<button class="step-btn" data-action="climate-step" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-delta="0.5"' + disabledAttr + '>+</button>' +
    '</span></span></div>';
}

// A sensor's card: one sparkline row per reading, each tapping through to
// that aspect's history. Which readings, in what order, is the descriptor's
// say (dashboard-logic.js, sensorCardPlan, #56): a thermometer lists
// temperature and humidity, not its link quality. A multi-aspect sensor
// gets a head row with the entity name that opens the entity detail — the
// aspect rows are the only other affordance, and they lead to a chart. The
// overlay, which is that detail, renders the rows without the head.
function widgetForSensor(entity, withHead) {
  var rows = logic.sensorCardPlan(entity, store.state, store.aspects[entity.name]);
  if (rows.length === 0) {
    return '<div class="entity-row"><span class="entity-name">' + esc(entity.label) + '</span><span class="faint">no data</span></div>';
  }
  var multi = rows.length > 1;
  var attrs = ' data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '"';
  var head = multi && withHead !== false
    ? '<div class="entity-row row-clickable" data-action="entity-detail"' + attrs + '>' +
      '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span></div>'
    : '';
  return head + rows.map(function (r) {
    var sk = entity.name + '|' + r.aspect;
    ensureHistory(entity.name, r.aspect); // fetched once (guarded), on first render while visible
    var s = localState.sparklines[sk];
    var sparkHtml = s && s.loaded ? buildChart('room-' + sk, s.points, { height: 28, sizeClass: 'chart-row', aspect: r.aspect, area: true, window: s.window }) : '';
    var name = multi ? r.label : entity.label;
    return '<div class="entity-row row-clickable' + (multi ? ' sensor-reading' : '') + '" data-action="history-detail"' + attrs + ' data-aspect="' + esc(r.aspect) + '">' +
      '<span class="entity-name" title="' + esc(name) + '">' + esc(name) + '</span>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
      (sparkHtml ? '<span style="width:80px;">' + sparkHtml + '</span>' : '') +
      '<span class="muted' + (r.stale ? ' stale' : '') + '">' + esc(r.display) + '</span></span>' +
      '</div>';
  }).join('');
}

function widgetGeneric(entity) {
  var prefix = 'home/state/' + entity.room + '/' + entity.name + '/';
  var rows = [];
  Object.keys(store.state).forEach(function (k) {
    if (k.indexOf(prefix) === 0) {
      var aspect = k.slice(prefix.length);
      rows.push('<div class="aspect-row">' + esc(aspect) + ': ' + esc(logic.formatAspect(aspect, null, store.state[k])) + '</div>');
    }
  });
  if (rows.length === 0) rows.push('<div class="aspect-row faint">no data</div>');
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" style="flex-direction:column;align-items:flex-start;">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' + rows.join('') + '</div>';
}

function widgetForCamera(entity) {
  // The room-card poster (the /api/camera snapshot proxy); the live view
  // lives in the entity detail overlay, opened on tap — never N always-on
  // streams (docs/design.md, Cameras). The poster refreshes at most once
  // a minute via the cache-busting bucket.
  var motion = stateValue(entity.room, entity.name, 'motion');
  var badge = motion === true ? '<span class="badge-motion">MOTION</span>' : '';
  return '<div class="entity-row row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" style="flex-direction:column;align-items:stretch;gap:6px;">' +
    '<span style="display:flex;justify-content:space-between;align-items:center;">' +
    '<span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' + badge + '</span>' +
    '<img class="camera-poster" loading="lazy" alt="" src="/api/camera/' + encodeURIComponent(entity.name) + '/snapshot?t=' + Math.floor(Date.now() / 60000) + '">' +
    '</div>';
}

// The room-card row for an entity whose adapter published an aspect
// descriptor (#32): name and the first family control on one line, the
// headline readings underneath — never the readout-wrapped-around-a-
// stepper row the undescribed climate widget degrades to in a narrow
// column. Which readings are headline is dashboard-logic.js's cardPlan.
function widgetForDescribed(entity) {
  var plan = logic.cardPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity));
  var badge = entity.write_mode === 'arbitrated' ? '<span class="badge-arbitrated">ARBITRATED</span>' : '';
  var control = plan.controls.length ? renderAspectControl(entity, plan.controls[0]) : '';
  var readings = plan.readings.map(function (r) {
    return '<span class="card-reading' + (r.stale ? ' stale' : '') + '" title="' + esc(r.aspect) + '">' +
      esc(r.label) + ' <b>' + esc(r.display) + '</b></span>';
  }).join('<span class="sep">&middot;</span>');
  // The badge rides the readings line: inside the ellipsed name it clips
  // to a stub in a narrow column, and the head line belongs to the control.
  return '<div class="entity-row described-card row-clickable" data-action="entity-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '">' +
    '<div class="described-head"><span class="entity-name" title="' + esc(entity.label) + '">' + esc(entity.label) + '</span>' + control + '</div>' +
    (readings || badge ? '<div class="described-readings">' + readings + (badge ? '<span class="card-badge">' + badge + '</span>' : '') + '</div>' : '') +
    '</div>';
}

function widgetForEntity(entity) {
  var described = !!store.aspects[entity.name];
  if (described && (entity.capability === 'climate' || !BESPOKE_WIDGET[entity.capability])) return widgetForDescribed(entity);
  if (entity.capability === 'light' || entity.capability === 'switch') return widgetForLight(entity);
  if (entity.capability === 'presence') return widgetForPresence(entity);
  if (entity.capability === 'lock') return widgetForLock(entity);
  if (entity.capability === 'climate') return widgetForClimate(entity);
  if (entity.capability === 'sensor') return widgetForSensor(entity);
  if (entity.capability === 'camera') return widgetForCamera(entity);
  return widgetGeneric(entity);
}

var CAP_ORDER = { light: 0, lock: 1, presence: 2, climate: 3, sensor: 4, camera: 5 };
// Capabilities whose card widget is the capability's own (a toggle, a
// sparkline, a poster) rather than the descriptor-driven row.
var BESPOKE_WIDGET = { light: true, switch: true, presence: true, lock: true, sensor: true, camera: true };
function capRank(entity) {
  var r = CAP_ORDER[entity.capability];
  return r === undefined ? 6 : r;
}

// ---- relative time ----

function relTime(ms) {
  var diff = Math.max(0, Date.now() - ms);
  var mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins === 1) return '1 min ago';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins / 60);
  if (hrs === 1) return '1 hr ago';
  return hrs + ' hr ago';
}

// ---- widget: map (person entities) ----
//
// The map is a view over every person entity, not a per-entity row (see
// docs/design.md, "Map and person entities"). Leaflet's map object is
// stateful (pan/zoom, tile cache) and must not be recreated on every
// state-delta render, so its container is a detached DOM node kept in
// mapState and moved into a fresh slot each render, rather than rebuilt
// from an HTML string like the rest of the view.

var mapState = { container: null, map: null, tileLayer: null, markers: {}, circles: {}, fitted: false };

function personEntities() {
  return (store.model.entities || []).filter(function (e) { return e.capability === 'person'; });
}

function personLatLon(entity) {
  var lat = stateValue(entity.room, entity.name, 'lat');
  var lon = stateValue(entity.room, entity.name, 'lon');
  if (typeof lat !== 'number' || typeof lon !== 'number') return null;
  return [lat, lon];
}

function mapThemeName() {
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function personDivIcon(entity) {
  return L.divIcon({
    className: 'person-marker',
    html: '<div class="person-marker-dot"></div><div class="person-marker-label">' + esc(entity.label) + '</div>',
    iconSize: [12, 12],
    iconAnchor: [6, 6]
  });
}

function personPopupHtml(entity) {
  var battery = stateValue(entity.room, entity.name, 'battery');
  var fixedAt = stateValue(entity.room, entity.name, 'fixed_at');
  var parts = [];
  if (typeof battery === 'number') parts.push('battery ' + Math.round(battery) + '%');
  if (typeof fixedAt === 'number') parts.push(relTime(fixedAt * 1000));
  return '<b>' + esc(entity.label) + '</b>' + (parts.length ? '<br>' + esc(parts.join(' · ')) : '');
}

function ensureMap() {
  if (mapState.map) return;
  if (!mapState.container) {
    mapState.container = document.createElement('div');
    mapState.container.id = 'person-map';
    mapState.container.className = 'map-wrap';
  }
  // No default setView: a center/zoom is set only once real fixes exist
  // (updateMapMarkers), so no coordinate is ever hardcoded. Layers added
  // before that point just wait for it (Leaflet defers via whenReady).
  mapState.map = L.map(mapState.container);
  if (store.model.tiles) {
    mapState.tileLayer = protomapsL.leafletLayer({ url: '/tiles.pmtiles', theme: mapThemeName() }).addTo(mapState.map);
  }
}

function updateMapMarkers(persons) {
  var map = mapState.map;
  var bounds = [];
  var seen = {};
  persons.forEach(function (e) {
    var key = e.room + '/' + e.name;
    seen[key] = true;
    var latlon = personLatLon(e);
    if (!latlon) {
      if (mapState.markers[key]) { map.removeLayer(mapState.markers[key]); delete mapState.markers[key]; }
      if (mapState.circles[key]) { map.removeLayer(mapState.circles[key]); delete mapState.circles[key]; }
      return;
    }
    bounds.push(latlon);
    var marker = mapState.markers[key];
    if (!marker) {
      marker = L.marker(latlon, { icon: personDivIcon(e) }).addTo(map);
      mapState.markers[key] = marker;
    } else {
      marker.setLatLng(latlon);
    }
    marker.bindPopup(personPopupHtml(e));

    var accuracy = stateValue(e.room, e.name, 'accuracy');
    var circle = mapState.circles[key];
    if (typeof accuracy === 'number') {
      if (!circle) {
        mapState.circles[key] = L.circle(latlon, { radius: accuracy, color: 'var(--accent)', weight: 1, fillOpacity: .1 }).addTo(map);
      } else {
        circle.setLatLng(latlon);
        circle.setRadius(accuracy);
      }
    } else if (circle) {
      map.removeLayer(circle);
      delete mapState.circles[key];
    }
  });

  Object.keys(mapState.markers).forEach(function (key) {
    if (seen[key]) return;
    map.removeLayer(mapState.markers[key]);
    delete mapState.markers[key];
    if (mapState.circles[key]) { map.removeLayer(mapState.circles[key]); delete mapState.circles[key]; }
  });

  // Fit once, when fixes first appear — repeating this on every later
  // delta would fight anyone panning the map.
  if (bounds.length && !mapState.fitted) {
    if (bounds.length === 1) map.setView(bounds[0], 16);
    else map.fitBounds(bounds, { maxZoom: 16, padding: [24, 24] });
    mapState.fitted = true;
  }
}

function mountMap(persons) {
  var slot = byId('map-slot');
  if (!slot) return;
  ensureMap();
  slot.appendChild(mapState.container);
  updateMapMarkers(persons);
  mapState.map.invalidateSize();
}

function renderMapCard(persons) {
  var noFix = persons.filter(function (e) { return !personLatLon(e); });
  var hint = store.model.tiles ? '' : '<div class="map-hint">no tile extract configured</div>';
  var noFixHtml = noFix.length
    ? '<div class="map-nofix">' + noFix.map(function (e) { return esc(e.label); }).join(', ') + ' &mdash; no fix yet</div>'
    : '';
  return '<div class="card span-all"><div class="card-label">Map</div>' +
    '<div id="map-slot"></div>' + hint + noFixHtml + '</div>';
}

// ---- widgets ----
//
// A view is a list of widgets (dashboard.toml, or the generated views'
// implicit lists), each a card built from what the page already renders.
// The dashboard owns every one of these; a widget places, never draws.

// Signal tiles: one per reading of the entity, or the one reading named.
// Which readings, in what order, is the descriptor's say — the same rows
// as the entity's sensor card (dashboard-logic.js, sensorCardPlan).
function widgetTiles(entity, aspect) {
  var rows = logic.sensorCardPlan(entity, store.state, store.aspects[entity.name]);
  if (aspect) rows = rows.filter(function (r) { return r.aspect === aspect; });
  return rows.map(function (r) {
    var sk = entity.name + '|' + r.aspect;
    ensureHistory(entity.name, r.aspect);
    var s = localState.sparklines[sk];
    var spark = s && s.loaded ? buildChart('tile-' + sk, s.points, { height: 36, sizeClass: 'chart-tile', aspect: r.aspect, area: true, window: s.window }) : '';
    var caption = s && s.loaded ? minMaxCaption(s.points) : '';
    var tileLabel = esc(entity.label) + (rows.length > 1 ? ' &middot; ' + esc(r.label) : '');
    return '<div class="card tile clickable" data-action="history-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-aspect="' + esc(r.aspect) + '">' +
      '<div class="card-label" title="' + esc(entity.label) + '">' + tileLabel.toUpperCase() + '</div>' +
      '<div class="big' + (r.stale ? ' stale' : '') + '">' + esc(r.display) + '</div>' + spark +
      '<div class="caption">' + esc(caption) + '</div></div>';
  }).join('');
}

// One aspect's history over a window, as a card.
function widgetChart(entity, aspect, hours) {
  var key = entity.name + '|' + aspect + '|' + hours;
  var s = localState.charts[key];
  if (!s) {
    localState.charts[key] = { points: [], loaded: false, loading: true };
    fetchHistory(entity.name, aspect, hours, 'chart').then(function (loaded) {
      localState.charts[key] = loaded;
      scheduleRender();
    });
    s = localState.charts[key];
  }
  var field = descriptorField(entity, aspect);
  var value = stateValue(entity.room, entity.name, aspect);
  var chart = s.loaded ? buildChart('chart-' + key, s.points, { height: 120, sizeClass: 'chart-card', aspect: aspect, area: true, gridlines: true, yLabels: true, window: s.window }) : '';
  return '<div class="card tile clickable span-all" data-action="history-detail" data-room="' + esc(entity.room) + '" data-entity="' + esc(entity.name) + '" data-aspect="' + esc(aspect) + '">' +
    '<div class="card-label">' + esc(entity.label + ' · ' + ((field && field.label) || aspect)).toUpperCase() + ' <span class="faint">' + esc(hours >= 48 ? Math.round(hours / 24) + 'd' : hours + 'h') + '</span></div>' +
    '<div class="big">' + esc(logic.formatAspect(aspect, field, value)) + '</div>' + chart + '</div>';
}

// People: the person entities, home or away from their presence aspect;
// failing that, when they were last seen. Motion sensors are rooms'
// business, not people.
function widgetPeople(persons) {
  if (persons.length === 0) return '';
  var pRows = persons.map(function (e) {
    var st = logic.personStatus(store.state, e);
    var detail = st.home === true ? 'Home' : st.home === false ? 'Away'
      : st.seenAt !== undefined ? 'last fix ' + relTime(st.seenAt) : 'no signal';
    return '<div class="row-clickable" data-action="entity-detail" data-room="' + esc(e.room) + '" data-entity="' + esc(e.name) + '" style="display:flex;align-items:center;gap:6px;padding:3px 0;">' +
      '<span class="status-dot ' + (st.home === true ? 'dot-on' : 'dot-off') + '"></span>' +
      '<span>' + esc(e.label) + ' &middot; ' + esc(detail) + '</span></div>';
  }).join('');
  return '<div class="card tile"><div class="card-label">People</div>' + pRows + '</div>';
}

// Out of the ordinary — the rules live in dashboard-logic.js; here each
// record's target maps onto the tap wiring.
function widgetDeviations() {
  var deviations = logic.computeDeviations(
    store.model, store.state, store.health, store.config, store.aspects
  );

  function deviationAttrs(target) {
    if (target.type === 'unit') {
      return 'data-action="unit-detail" data-unit="' + esc(target.unit) + '"';
    }
    if (target.type === 'entity') {
      return 'data-action="entity-detail" data-room="' + esc(target.room) +
        '" data-entity="' + esc(target.entity) + '"';
    }
    if (target.type === 'setpoint') {
      return 'data-action="goto-setpoint" data-unit="' + esc(target.unit) +
        '" data-param="' + esc(target.param) + '"';
    }
    return 'data-action="goto-rooms"';
  }

  var devHtml;
  if (deviations.length === 0) {
    devHtml = '<div class="equilibrium"><span class="eq-dot"></span>In equilibrium.</div>';
  } else {
    devHtml = deviations.map(function (d) {
      return '<div class="dev-row row-clickable" ' + deviationAttrs(d.target) + '>' +
        '<div class="dev-main"><div class="title" title="' + esc(d.title) + '">' + esc(d.title) + '</div>' +
        (d.detail ? '<div class="detail">' + esc(d.detail) + '</div>' : '') + '</div>' +
        (d.button ? '<button class="dev-btn" data-action="' + d.button.action + '">' + esc(d.button.label) + '</button>' : '') +
        '<div class="dev-tag">' + esc(d.tag) + '</div></div>';
    }).join('');
  }
  return '<div class="card span-all"><div class="card-label">Out of the ordinary' + (deviations.length ? ' — ' + deviations.length : '') + '</div>' + devHtml + '</div>';
}

// A unit's family-editable parameters as one card.
function widgetParams(unit) {
  var params = unit.params || {};
  var rows = Object.keys(params).filter(function (p) { return familyEditable(params[p]); })
    .map(function (p) { return renderParamRow(unit.name, p, params[p], true); });
  return '<div class="card"><div class="card-label">' + esc(unit.label) + '</div>' +
    (rows.length ? rows.join('') : '<div class="empty-hint">No family-editable parameters.</div>') + '</div>';
}

// An entity's own row — its control or its readings — as a card.
function widgetEntity(entity) {
  return '<div class="card">' + widgetForEntity(entity) + '</div>';
}

// A unit's card (dashboard-logic.js, unitCardPlan): head, then the
// relations the manifest and the grant table already state. Each section
// is drawn only when it has members; the labels are the page's words, not
// the manifest's, and the card can say nothing the manifest did not.
function widgetUnit(unitName) {
  var plan = logic.unitCardPlan(store.model, unitName);
  if (!plan) return '';
  var u = plan.unit;
  var h = store.health['home/health/' + u.name] || {};
  var status = h.status || 'stopped';
  var html = '<div class="card unit-card">' +
    '<div class="unit-head row-clickable" data-action="unit-detail" data-unit="' + esc(u.name) + '">' +
    '<div><div class="unit-name" title="' + esc(u.label) + '">' + esc(u.label) + '</div>' +
    (u.description ? '<div class="unit-desc">' + esc(u.description) + '</div>' : '') + '</div>' +
    '<span class="status-badge" title="' + esc(healthTooltip(h)) + '"><span class="status-glyph status-' + esc(status) + '">' + statusGlyph(status) + '</span>' + esc(status) + '</span></div>';
  var section = function (label, body) {
    return body ? '<div class="section-label">' + label + '</div>' + body : '';
  };
  // its own card: the param name alone, the unit is the head
  html += section('Setpoints', plan.params.map(function (p) { return renderParamRow(u.name, p, u.params[p], true); }).join(''));
  html += section('Publishes', plan.publishes.map(widgetForEntity).join(''));
  html += section('Drives', plan.drives.map(widgetForEntity).join(''));
  html += section('From', plan.sources.map(function (e) { return widgetForEntity(e); }).join(''));
  return html + '</div>';
}

// The room card: every entity in the room, controls first.
function renderRoomCard(room, ents) {
  var sorted = ents.slice().sort(function (a, b) { return capRank(a) - capRank(b); });
  var title = room === 'global' ? 'House' : titleCase(room);
  return '<div class="card room-card"><h3 title="' + esc(title) + '">' + esc(title) + '</h3>' + sorted.map(widgetForEntity).join('') + '</div>';
}

function entitiesInRoom(room) {
  return (store.model.entities || []).filter(function (e) { return e.room === room; });
}

function unitByName(name) {
  return (store.model.units || []).filter(function (u) { return u.name === name; })[0];
}

// The compositor: a view's widgets, in order, in one grid. The map is
// mounted after the markup lands (Leaflet owns its container).
function renderWidgets(title, widgets) {
  var persons = personEntities();
  var wantMap = false;
  var cards = widgets.map(function (w) {
    if (w.kind === 'tile') {
      var te = findEntityByName(w.entity);
      return te ? widgetTiles(te, w.aspect) : '';
    }
    if (w.kind === 'chart') {
      var ce = findEntityByName(w.entity);
      return ce ? widgetChart(ce, w.aspect, w.hours || 24) : '';
    }
    if (w.kind === 'entity') {
      var ee = findEntityByName(w.entity);
      return ee ? widgetEntity(ee) : '';
    }
    if (w.kind === 'room') return renderRoomCard(w.room, entitiesInRoom(w.room));
    if (w.kind === 'unit') return widgetUnit(w.unit);
    if (w.kind === 'params') {
      var pu = unitByName(w.unit);
