<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>homeostat</title>
<link rel="icon" href="/assets/homeostat-mark.svg">
<link rel="stylesheet" href="/assets/leaflet.css">
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="wordmark"><img src="/assets/homeostat-mark.svg" alt="" width="22" height="22"><span>homeostat</span></div>
    <nav id="rail-nav"></nav>
    <div class="health-pin" id="health-pin"></div>
    <div class="about" id="rail-about"></div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div class="wordmark"><img src="/assets/homeostat-mark.svg" alt="" width="22" height="22"><span>homeostat</span></div>
      <button id="topbar-status" data-action="status-sheet" aria-haspopup="true" aria-expanded="false"></button>
    </div>
    <div id="banner">reconnecting&hellip;</div>
    <div id="view"></div>
  </div>
</div>
<nav id="tabs"><div class="row" id="tabs-row"></div></nav>
<div id="status-sheet" role="dialog" aria-label="Health, Not shown and about"></div>
<div id="toast"></div>

<div id="overlay-backdrop" data-action="overlay-close"></div>
<div id="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title" tabindex="-1">
  <div class="overlay-head">
    <div class="overlay-title" id="overlay-title"></div>
    <div class="overlay-actions">
      <button class="overlay-wide" id="overlay-wide" data-action="overlay-wide"
              aria-label="Full window" title="Full window" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg>
      </button>
      <button class="overlay-close" id="overlay-close" data-action="overlay-close" aria-label="Close">&times;</button>
    </div>
  </div>
  <div class="overlay-body" id="overlay-body">
    <div id="overlay-head"></div>
    <!-- Never replaced: a live player sits here, between the two
         rendered halves, so a re-render cannot tear it out. -->
    <div id="overlay-mount"></div>
    <div id="overlay-rest"></div>
  </div>
</div>

<div id="chart-tooltip">
  <div id="chart-tooltip-value"></div>
  <div id="chart-tooltip-time"></div>
</div>

<script src="/assets/leaflet.js"></script>
<script src="/assets/protomaps-leaflet.js"></script>
<script src="/assets/dashboard-logic.js"></script>
<script type="module">
  // The vendored go2rtc player (assets/README.md). MSE only: WebRTC can't
  // ride the dashboard's /api/camera proxy (docs/design.md#cameras).
  import { VideoRTC } from '/assets/video-rtc.js';
  customElements.define('video-rtc', VideoRTC);
</script>
<script>
'use strict';
(function () {

// Tab icons by generated view; a file's own view gets the generic one.
var TAB_ICONS = {
  view: html`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="2"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="9" y1="9.5" x2="9" y2="20"/></svg>`,
  now: html`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 12 8 12 10 6 14 18 16 12 21 12"/></svg>`,
  setpoints: html`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="4" x2="6" y2="20"/><circle cx="6" cy="9" r="2.2" fill="currentColor" stroke="none"/><line x1="12" y1="4" x2="12" y2="20"/><circle cx="12" cy="16" r="2.2" fill="currentColor" stroke="none"/><line x1="18" y1="4" x2="18" y2="20"/><circle cx="18" cy="11" r="2.2" fill="currentColor" stroke="none"/></svg>`,
  rooms: html`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.4"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.4"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.4"/></svg>`
};
var RANGE_PRESETS = [{ label: '1h', hours: 1 }, { label: '6h', hours: 6 }, { label: '24h', hours: 24 }, { label: '7d', hours: 168 }];
var CHART_VBW = 400; // internal viewBox width used for coordinate math; visual width is CSS 100%
// The newest issues a braid draws. Past this the lines stop being
// separable and the fetch stops being small; the page says how many it
// drew rather than letting the window quietly mean different things.
var BRAID_ISSUES = 40;

var store = {
  model: { zones: {}, entities: [], units: [] },
  state: {},
  forecasts: {},    // home/forecast key -> the house's current belief about its future
  holds: {},        // home/hold/{unit} -> what that arbiter is holding right now
  health: {},
  config: {},
  aspects: {},      // entity -> its adapter's aspect descriptor (from discovery)
  events: [],
  lastSeen: {},
  connected: false,
  view: 'now',
  roomsFilter: 'all'
};

/* In-flight commands, keyed room/entity/aspect. Deliberately outside
 * `store`: the store is the house's state as the bus reports it, and a
 * pending command is this browser's private business — nothing on the
 * bus knows this tab tapped a button. */
var pending = {};

var localState = {
  sliderDrag: {},   // key -> true while user is dragging
  sparklines: {},   // entity|aspect -> {points:[], window, loaded:bool, loading:bool}
  charts: {},       // entity|aspect|hours -> the same, for chart widgets
  relations: {}     // unit -> true while its Drives/From sections are open
};

// detail overlay state (right slide-over / mobile sheet)
var overlay = {
  open: false,
  type: null,        // 'history' | 'entity' | 'unit' | 'text'
  entity: null,       // for history/entity: entity object
  aspect: null,        // for history: aspect name
  shape: 'chart',      // for history: 'chart' (a number) | 'timeline' (a bool or string)
  shapeSettled: true,  // false while the shape was guessed without a live value
  unit: null,           // for unit: unit name
  viewName: null,        // for text: the view whose dashboard.toml block it shows
  range: 24,             // hours, for history
  rangeData: {},          // hours -> {points, window, loaded, loading}
  cmdData: {},             // hours -> the same, for the cmd series (what was asked)
  // What is drawn beside the record: '' (the value and its current
  // belief), 'sources' (the contributors it is derived from) or
  // 'forecasts' (every issue the recorder kept). One at a time — two sets
  // of thin grey lines on one chart read as one set — so one field, not
  // a flag each (docs/design.md#charts-forecasts-and-sources).
  layer: '',
  issues: [],              // decoded stored issues for the current window
  issuesLoading: false,
  sourceData: {},          // "<hours>|<entity>|<aspect>" -> fetched contributor history
  sourceEvents: {},        // same key -> when each source went in or out
  pinned: null,            // the issue time a reader pinned out of the braid
  sourcePinned: null,      // the contributor a reader pinned out of the legend
  lastPoints: null,
  log: null,               // for unit: {lines, loaded, loading}
  expanded: {}              // for entity: group -> true when a collapsed section is opened
};

// chartId -> {coords, width, height, aspect} — populated while building chart
// markup, consumed by the pointermove/pointerleave hover wiring.
var chartRegistry = {};

// ---- helpers ----

// The pure decision logic lives in /assets/dashboard-logic.js (tested by
// `node --test tests/js`); this file keeps the DOM wiring.
var logic = window.HomeostatLogic;

function byId(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* Markup is written with the `html` tag, which escapes by default:
 * html`<b>${name}</b>` escapes every interpolated value unless it is
 * itself markup (another html`` result), and joins an array of either. A
 * forgotten escape is therefore not a way in for a label from the house.
 * All five of & < > " ' are escaped, so a value is safe in text and in a
 * QUOTED attribute alike; an unquoted attribute is not, so every
 * attribute here is quoted. A line break in the template and the
 * indentation after it are dropped, so markup can be laid out over lines
 * without putting whitespace between elements. The result is a Markup,
 * which becomes its text wherever a string is wanted (innerHTML,
 * insertAdjacentHTML) — and is then an ordinary string, so markup is
 * composed by interpolating it, never with `+`. */
function Markup(text) { this.text = text; }
Markup.prototype.toString = function () { return this.text; };

function html(strings) {
  var out = unlaid(strings[0]);
  for (var i = 1; i < strings.length; i++) out += markupOf(arguments[i]) + unlaid(strings[i]);
  return new Markup(out);
}

function unlaid(text) { return text.replace(/\n\s*/g, ''); }

function markupOf(value) {
  if (value instanceof Markup) return value.text;
  if (Array.isArray(value)) return value.map(markupOf).join('');
  return esc(value);
}

var titleCase = logic.titleCase;
var entityKey = logic.entityKey;

function unitsByName() {
  var m = {};
  (store.model.units || []).forEach(function (u) { m[u.name] = u; });
  return m;
}

function findEntity(room, name) {
  var list = store.model.entities || [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].room === room && list[i].name === name) return list[i];
  }
  return null;
}

// current value for a given entity/aspect from the state map
function stateValue(room, entity, aspect) {
  return logic.stateValue(store.state, room, entity, aspect);
}

// aspects present in state for an entity (the history title's "· aspect" suffix)
function aspectsFor(entity) {
  var prefix = 'home/state/' + entity.room + '/' + entity.name + '/';
  return Object.keys(store.state).filter(function (k) { return k.indexOf(prefix) === 0; })
    .map(function (k) { return k.slice(prefix.length); });
}

function descriptorField(entity, aspect) {
  var d = store.aspects[entity.name];
  return (d && d.fields && d.fields[aspect]) || null;
}

function unitLabel(unitName) {
  var u = unitsByName()[unitName];
  return u ? u.label : unitName;
}

// ---- networking ----

function loadModel() {
  fetch('/api/model').then(function (r) { return r.json(); }).then(function (m) {
    store.model = m || store.model;
    scheduleRender();
  }).catch(function () { /* keep defaults; page still renders */ });
}

var ws = null;
var wsBackoff = 1000;

function connectWs() {
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    ws = new WebSocket(proto + '//' + location.host + '/ws');
  } catch (e) {
    scheduleReconnect();
    return;
  }
  ws.onopen = function () {
    store.connected = true;
    wsBackoff = 1000;
    updateBanner();
  };
  ws.onclose = function () {
    store.connected = false;
    updateBanner();
    scheduleReconnect();
  };
  ws.onerror = function () {
    try { ws.close(); } catch (e) {}
  };
  ws.onmessage = function (ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    handleWsMessage(msg);
  };
}

function scheduleReconnect() {
  setTimeout(function () {
    connectWs();
  }, wsBackoff);
  wsBackoff = Math.min(wsBackoff * 2, 30000);
}

function updateBanner() {
  var b = byId('banner');
  if (!b) return;
  b.classList.toggle('show', !store.connected);
}

// The next moment a drawn hold ends, as a single timer: the rows are
// sorted by deadline, so the first is the only one that matters.
var holdTimer = null;
function scheduleHoldExpiry(deviations) {
  var next = deviations
    .filter(function (d) { return d.tag === 'hold' && d.until; })
    .map(function (d) { return d.until; })
    .sort(function (a, b) { return a - b; })[0];
  if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  if (!next) return;
  holdTimer = setTimeout(function () {
    holdTimer = null;
    scheduleRender();
  }, Math.max(250, next - Date.now() + 250));
}

function handleWsMessage(msg) {
  var applied = logic.applyMessage(store, msg, Date.now() / 1000);
  if (!applied) return;
  if (applied === 'state') {
    trackLastSeen(msg.key);
    appendSparklinePoint(msg.key, msg.value);
    var answered = logic.resolveFromState(pending, msg.key, msg.value); // stage 4: the device answered
    if (answered) announceOutcome(answered);
  }
  if (applied === 'event') {
    // stages 2 and 3: the arbiter refused it, or an adapter dropped it
    var outcome = logic.resolveFromEvent(pending, msg.value);
    if (outcome) announceOutcome(outcome);
  }
  scheduleRender();
}

// key like home/state/{room}/{entity}/occupancy -> track lastSeen per
// entity (both presence aspect spellings; see dashboard-logic.js).
function trackLastSeen(key) {
  var pe = logic.presenceEntityFromKey(key);
  if (pe) store.lastSeen[pe] = Date.now();
}

function presenceValue(entity) {
  return logic.presenceValue(store.state, entity);
}

function appendSparklinePoint(key, value) {
  var parts = key.split('/');
  if (parts[0] !== 'home' || parts[1] !== 'state' || parts.length < 5) return;
  if (typeof value !== 'number') return;
  var entity = parts[3], aspect = parts[4];
  var sk = entity + '|' + aspect;
  var s = localState.sparklines[sk];
  if (!s || !s.loaded) return; // only append once history has been fetched
  s.points.push({ ts: new Date().toISOString(), value: value });
  if (s.points.length > 500) s.points.shift();
}

// ---- commands ----

/* A command is a proposal passing through stages, and the page shows
 * which one it is in: asked from the tap, then confirmed by readback,
 * adjusted when the device settled elsewhere, held by the arbiter,
 * rejected by the adapter, unheard when nothing subscribes to its key,
 * or unconfirmed when nothing answers. The envelope's id, handed
 * back by /api/cmd, is what ties an event to the command it ended. The
 * stage is said on the control itself (markPendingControls) and stays
 * said for a while after it ends (`recent`); the toast is only for an
 * outcome whose control is no longer on screen. */
var recent = {};
// key -> timer: a stepper still being tapped (stepCmd)
var drafts = {};
var STEP_SETTLE_MS = 600;
var cmdSeq = 0;

// How far a readback may sit from the request and still be it: the
// brightness scale (0–254) is finer than the percent its control shows.
function cmdTolerance(aspect) {
  return aspect === 'brightness' ? 254 / 200 : 0;
}

function sendCmd(room, entity, aspect, value) {
  var key = logic.pendingKey(room, entity, aspect);
  clearTimeout(drafts[key]);
  delete drafts[key];
  delete recent[key];
  var spec = entitySpec(room, entity);
  var seq = ++cmdSeq;
  logic.trackCommand(pending, {
    room: room, entity: entity, aspect: aspect, value: value, seq: seq, tolerance: cmdTolerance(aspect),
    capability: spec ? spec.capability : null, descriptor: store.aspects[entity],
    before: stateValue(room, entity, aspect)
  }, Date.now(), 'sending');
  scheduleRender();
  fetch('/api/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Homeostat': 'family' },
    body: JSON.stringify({ room: room, entity: entity, aspect: aspect, value: value })
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
    return r.json();
  }).then(function (body) {
    var outcome = logic.commandSent(pending, key, seq, body);
    if (outcome) announceOutcome(outcome);
    scheduleRender();
  }).catch(function (e) {
    // Refused before it ever reached the bus: nothing to wait for.
    var entry = pending[key];
    if (entry && entry.outcome === 'sending' && entry.seq === seq) delete pending[key];
    announceOutcome({ key: key, outcome: 'failed', value: value, reason: errText(e) });
    scheduleRender();
  });
}

/* A stepper's tap. Held as a draft for a moment, so the taps that follow
 * build on it (logic.commandBase) and one command goes out for where they
 * end: three taps of + are one request for +1.5, not three requests each
 * computed from a readback that has not moved yet. */
function stepCmd(room, entity, aspect, value) {
  var key = logic.pendingKey(room, entity, aspect);
  delete recent[key];
  var spec = entitySpec(room, entity);
  logic.trackCommand(pending, {
    room: room, entity: entity, aspect: aspect, value: value, tolerance: cmdTolerance(aspect),
    capability: spec ? spec.capability : null, descriptor: store.aspects[entity],
    before: stateValue(room, entity, aspect)
  }, Date.now(), 'draft');
  clearTimeout(drafts[key]);
  drafts[key] = setTimeout(function () {
    delete drafts[key];
    sendCmd(room, entity, aspect, value);
  }, STEP_SETTLE_MS);
  scheduleRender();
}

// Where a stepper's next step starts: the request in flight, if any.
function stepBase(room, entity, aspect) {
  return logic.commandBase(pending, room, entity, aspect, stateValue(room, entity, aspect));
}

function entitySpec(room, entity) {
  var entities = (store.model && store.model.entities) || [];
  for (var i = 0; i < entities.length; i++) {
    if (entities[i].room === room && entities[i].name === entity) return entities[i];
  }
  return null;
}

// A commanded value in the words its control uses.
function formatCmdValue(room, entity, aspect, value) {
  if (aspect === 'brightness' && typeof value === 'number') return Math.round(value / 254 * 100) + '%';
  if (typeof value === 'boolean' && aspect === 'locked') return value ? 'locked' : 'unlocked';
  if (typeof value === 'boolean' && aspect === 'on') return value ? 'on' : 'off';
  var spec = entitySpec(room, entity);
  var field = spec ? descriptorField(spec, aspect) : null;
  if (!field && aspect === 'setpoint' && typeof value === 'number') return value.toFixed(1) + '°';
  return logic.formatAspect(aspect, field, value);
}

/* What can be said about a command before anything answers it: the unit
 * that owns the device is not running, or the device says it is
 * unavailable. Either makes a long wait likely, and the family is better
 * told now than in twenty seconds. */
function commandWarning(room, entity) {
  var spec = entitySpec(room, entity);
  if (!spec) return '';
  var health = store.health['home/health/' + spec.owner];
  if (health && health.status && health.status !== 'running') {
    return unitLabel(spec.owner) + ' is ' + health.status;
  }
  if (stateValue(room, entity, 'available') === false) return 'the device reports itself unavailable';
  return '';
}

/* The line under a control: the stage its command is in, or how it
 * ended. `tone` is the colour: busy while waiting, ok when the device
 * took it, warn when it settled elsewhere or was held, bad when it went
 * nowhere. A refusal is deliberately not worded as a failure: the
 * command was well-formed and lost to a higher band, and a retry would
 * lose identically. */
function commandStatus(key) {
  var parts = key.split('/');
  var room = parts[0], entity = parts[1], aspect = parts[2];
  var fmt = function (v) { return formatCmdValue(room, entity, aspect, v); };
  var entry = pending[key];
  if (entry) {
    var text = 'Asked ' + fmt(entry.value);
    if (entry.outcome === 'draft') return { tone: 'busy', text: text };
    if (entry.seen !== undefined) text += ' · still ' + fmt(entry.seen);
    else text += ' · waiting for the device';
    var warning = commandWarning(room, entity);
    return warning ? { tone: 'warn', text: text + ' · ' + warning } : { tone: 'busy', text: text };
  }
  var done = logic.recentFor(recent, key, Date.now());
  if (!done) return null;
  return outcomeStatus(done, fmt, room, entity, aspect);
}

function outcomeStatus(done, fmt, room, entity, aspect) {
  if (done.outcome === 'confirmed') return { tone: 'ok', text: '✓ ' + fmt(done.value) };
  if (done.outcome === 'adjusted') {
    return { tone: 'warn', text: 'The device settled on ' + fmt(done.seen) + ' (asked ' + fmt(done.value) + ')' };
  }
  if (done.outcome === 'held') {
    var hold = logic.holdOn(store.holds, room, entity, aspect, Date.now());
    var until = hold && hold.until ? ' until ' + new Date(hold.until).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    return { tone: 'warn', text: 'Held by ' + done.by + (done.actor ? ' (' + done.actor + ')' : '') + until + ' · ' + fmt(done.value) + ' not sent' };
  }
  if (done.outcome === 'rejected') {
    return { tone: 'bad', text: (done.reason === 'device-unavailable' ? 'The device is unavailable' : 'Not taken: ' + done.reason) + ' · ' + fmt(done.value) };
  }
  if (done.outcome === 'unheard') {
    var spec = entitySpec(room, entity);
    return { tone: 'bad', text: 'Nothing is listening' + (spec ? ': ' + unitLabel(spec.owner) + ' is not running' : '') + ' · ' + fmt(done.value) + ' went nowhere' };
  }
  if (done.outcome === 'unconfirmed') {
    return { tone: 'bad', text: 'No answer for ' + fmt(done.value) + (done.seen !== undefined ? ' · still ' + fmt(done.seen) : '') };
  }
  if (done.outcome === 'failed') return { tone: 'bad', text: done.reason };
  return null;
}

/* An ended command is said on its control; the toast is the fallback for
 * one whose control is not on screen any more (the overlay closed, the
 * view changed), and a confirmation needs no fallback. */
function announceOutcome(outcome) {
  logic.noteOutcome(recent, outcome, Date.now());
  if (outcome.outcome === 'confirmed') return;
  var shown = document.querySelector('[data-cmd-status="' + cssEscape(outcome.key) + '"]');
  if (shown) return;
  var parts = outcome.key.split('/');
  var status = outcomeStatus(outcome, function (v) { return formatCmdValue(parts[0], parts[1], parts[2], v); },
    parts[0], parts[1], parts[2]);
  var spec = entitySpec(parts[0], parts[1]);
  if (status) toast((spec ? spec.label + ': ' : '') + status.text);
}

function cssEscape(text) {
  return window.CSS && CSS.escape ? CSS.escape(text) : String(text).replace(/["\\]/g, '\\$&');
}

function sendLightsOff() {
  fetch('/api/lights/off', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Homeostat': 'family' }
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
  }).catch(function (e) {
    toast(errText(e));
  });
}

function sendParam(unit, param, value, onError) {
  fetch('/api/param', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Homeostat': 'family' },
    body: JSON.stringify({ unit: unit, param: param, value: value })
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
  }).catch(function (e) {
    toast(errText(e));
    if (onError) onError();
  });
}

function errText(e) {
  var msg = e && e.message ? e.message : String(e);
  try {
    var parsed = JSON.parse(msg);
    if (parsed && parsed.error) return parsed.error;
  } catch (ex) { /* not json */ }
  return msg;
}

var toastTimer = null;
function toast(msg) {
  var el = byId('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
}

// ---- history fetch ----
//
// The recorder folds the window (docs/design.md#read-path): a line asks
// for one bucket per drawn column, a timeline for the runs of the state.
// The window travels with the points so the chart places them by time.

// `cls` is the recorder's series class: 'state' (the default) is what the
// house did, 'cmd' what was asked of it.
function fetchHistory(entity, aspect, hours, shape, cls) {
  var win = { from: Date.now() - hours * 3600e3, to: Date.now() };
  var url = '/api/history?entity=' + encodeURIComponent(entity) + '&aspect=' + encodeURIComponent(aspect) + '&hours=' + hours +
    (cls ? '&class=' + encodeURIComponent(cls) : '') +
    (shape === 'timeline' ? '&changes=1' : '&bucket=' + logic.bucketSeconds(hours, CHART_VBW));
  return fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var pts = [];
      (data.series || []).forEach(function (series) {
        (series.points || []).forEach(function (p) { pts.push(p); });
      });
      return { points: pts, window: win, loaded: true, loading: false };
    })
    .catch(function () {
      return { points: [], window: win, loaded: true, loading: false };
    });
}

// tile/row sparklines: numeric readings, fixed 24h window
function ensureHistory(entity, aspect) {
  var sk = entity + '|' + aspect;
  var s = localState.sparklines[sk];
  if (s && (s.loaded || s.loading)) return;
  localState.sparklines[sk] = { points: [], loaded: false, loading: true };
  fetchHistory(entity, aspect, 24, 'chart').then(function (loaded) {
    localState.sparklines[sk] = loaded;
    scheduleRender();
  });
}

// detail overlay, range-selectable
function fetchHistoryRange(entityName, aspect, hours, shape) {
  var rd = overlay.rangeData[hours];
  if (rd && (rd.loaded || rd.loading)) return;
  overlay.rangeData[hours] = { points: [], loaded: false, loading: true };
  fetchHistory(entityName, aspect, hours, shape).then(function (loaded) {
    if (!overlay.shapeSettled && loaded.points.length) {
      // guessed without a live value: the recorded values have the say
      overlay.shapeSettled = true;
      var actual = logic.historyShape(loaded.points[0].value);
      if (actual !== overlay.shape && overlay.open && overlay.aspect === aspect) {
        overlay.shape = actual;
        overlay.rangeData = {};
        fetchHistoryRange(entityName, aspect, hours, actual);
        return;
      }
    }
    overlay.rangeData[hours] = loaded;
    overlay.lastPoints = loaded.points;
    if (overlay.open && overlay.type === 'history') renderOverlayContent();
  });
  fetchCommandRange(entityName, aspect, hours);
}

/* What a computed value is derived FROM, over the same window. Fetched
 * only when the reader asks: contributors are diagnosis, and every one is
 * an ordinary entity whose series the recorder already keeps, so this is
 * the same history call the chart above already makes. */
function contributorsOf(entity, aspect) {
  return logic.contributorsFor((store.model && store.model.entities) || [], entity.name, aspect);
}

// A contributor's room, for reading its own `available` aspect.
function contributorRoom(c) {
  var entities = (store.model && store.model.entities) || [];
  for (var i = 0; i < entities.length; i++) {
    if (entities[i].name === c.entity) return entities[i].room;
  }
  return null;
}

function sourceCacheKey(hours, c) {
  return hours + '|' + c.entity + '|' + c.aspect;
}

/* When each source last went in or out of the computation. Declared
 * sources say what MAY contribute; these say what did, so a contributor
 * the fusion has dropped stops reading as if it were still voting
 * (docs/design.md#which-sources-a-computation-actually-used). */
function fetchSourceEvents(entity, aspect, hours) {
  var ck = hours + '|' + entity.name + '|' + aspect;
  var cached = overlay.sourceEvents[ck];
  if (cached && (cached.loaded || cached.loading)) return;
  overlay.sourceEvents[ck] = { events: [], loaded: false, loading: true };
  fetch('/api/source-events?entity=' + encodeURIComponent(entity.name) +
        '&aspect=' + encodeURIComponent(aspect) + '&hours=' + hours)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      overlay.sourceEvents[ck] = {
        events: (data && data.events) || [], loaded: true, loading: false
      };
      if (overlay.open && overlay.type === 'history') renderOverlayContent();
    })
    .catch(function () {
      overlay.sourceEvents[ck] = { events: [], loaded: true, loading: false };
    });
}

function sourceUsageNow(entity, aspect, hours, contributors) {
  var ck = hours + '|' + entity.name + '|' + aspect;
  var d = overlay.sourceEvents[ck];
  return logic.sourceUsage(d && d.loaded ? d.events : [], contributors);
}

function fetchSources(entity, aspect, hours) {
  contributorsOf(entity, aspect).forEach(function (c) {
    var ck = sourceCacheKey(hours, c);
    var cached = overlay.sourceData[ck];
    if (cached && (cached.loaded || cached.loading)) return;
    overlay.sourceData[ck] = { points: [], loaded: false, loading: true };
    fetchHistory(c.entity, c.aspect, hours, 'chart').then(function (loaded) {
      overlay.sourceData[ck] = loaded;
      if (overlay.open && overlay.type === 'history') renderOverlayContent();
    });
  });
}

// The contributors the chart should draw right now: declared, asked for,
// and arrived. One still loading simply is not drawn yet.
function drawnSources(entity, aspect, hours) {
  if (overlay.layer !== 'sources') return null;
  var out = [];
  contributorsOf(entity, aspect).forEach(function (c) {
    var d = overlay.sourceData[sourceCacheKey(hours, c)];
    if (!d || !d.loaded || !d.points.length) return;
    // Carries the contributor's identity and caveat, not just its line:
    // the legend names it, says whether it is still reporting, and shows
    // what is true of THIS source and not of the aspect.
    out.push({
      name: c.name,
      label: c.label,
      entity: c.entity,
      note: c.note,
      points: d.points
    });
  });
  return out.length ? out : null;
}

/* What the house SAID about this window, as against what it now
 * believes: every issue the recorder kept. Fetched only when the reader
 * asks for it — a braid is analysis, and a house with no recorder has
 * none of this while still having a forecast to draw. */
function fetchIssues(entityName, aspect, hours) {
  overlay.issuesLoading = true;
  var url = '/api/forecasts?entity=' + encodeURIComponent(entityName) +
    '&aspect=' + encodeURIComponent(aspect) + '&hours=' + hours + '&limit=' + BRAID_ISSUES;
  fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      overlay.issuesLoading = false;
      if (!overlay.open || overlay.aspect !== aspect) return;
      overlay.issues = logic.decodeIssues(data.issues);
      renderOverlayContent();
    })
    .catch(function () {
      overlay.issuesLoading = false;
      overlay.issues = [];
      if (overlay.open) renderOverlayContent();
    });
}

/* What was asked of this aspect, beside what it did. The recorder types
 * every cmd envelope into its own series
 * (docs/design.md#history-and-the-recorder), and this is where that
 * audit is read. Always fetched rather than gated on whether the page
 * thinks the aspect is commandable: recorded commands are the honest
 * test, and the rules for who may command what live on the server. The strip renders only when the window actually holds
 * commands. */
function fetchCommandRange(entityName, aspect, hours) {
  var cd = overlay.cmdData[hours];
  if (cd && (cd.loaded || cd.loading)) return;
  overlay.cmdData[hours] = { points: [], loaded: false, loading: true };
  // Commands are edges, never a curve: their runs are the shape, whatever
  // the aspect's own readings are drawn as.
  fetchHistory(entityName, aspect, hours, 'timeline', 'cmd').then(function (loaded) {
    overlay.cmdData[hours] = loaded;
    if (overlay.open && overlay.type === 'history' && overlay.aspect === aspect) renderOverlayContent();
  });
}

// ---- log fetch (detail overlay, unit) ----

function fetchUnitLog(unitName) {
  overlay.log = { lines: [], loaded: false, loading: true };
  fetch('/api/logs?unit=' + encodeURIComponent(unitName) + '&lines=100')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      overlay.log = { lines: data || [], loaded: true, loading: false };
      if (overlay.open && overlay.type === 'unit') renderOverlayContent();
    })
    .catch(function () {
      overlay.log = { lines: [], loaded: true, loading: false };
      if (overlay.open && overlay.type === 'unit') renderOverlayContent();
    });
}

// ---- render scheduling ----

var renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function () {
    renderQueued = false;
    render();
  });
}

// ---- nav / shell ----

function healthWorstAndCount() {
  var order = { open: 0, backoff: 1, starting: 2, stopped: 2, running: 3 };
  var worst = null;
  var okCount = 0;
  var total = 0;
  Object.keys(store.health).forEach(function (k) {
    var h = store.health[k] || {};
    total++;
    var status = h.status || 'running';
    if (status === 'running') okCount++;
    var rank = order[status];
    if (rank === undefined) rank = 3;
    if (worst === null || rank < worst.rank) {
      worst = { rank: rank, status: status, key: k };
    }
  });
  return { worst: worst, ok: okCount, total: total };
}

function statusGlyph(status) {
  if (status === 'running') return '●'; // ●
  if (status === 'backoff') return '▲'; // ▲
  if (status === 'open') return '✕'; // ✕
  return '○'; // ○ starting / stopped / unknown
}

function statusChipHtml(status) {
  return html`<span class="status-badge"><span class="status-glyph status-${status}">${statusGlyph(status)}</span>${status}</span>`;
}

function healthTooltip(h) {
  var restarts = (h.restarts !== undefined && h.restarts !== null) ? h.restarts : 0;
  var backoff = (h.backoff_ms !== undefined && h.backoff_ms !== null) ? h.backoff_ms : 0;
  var exitCode = (h.last_exit_code !== undefined && h.last_exit_code !== null) ? h.last_exit_code : 0;
  return 'restarts ' + restarts + ' · backoff ' + backoff + 'ms · exit ' + exitCode;
}

function fmtOrDash(v) {
  return (v === undefined || v === null) ? '—' : String(v);
}

var unitNameFromHealthKey = logic.unitNameFromHealthKey;

// The nav is the file's views (dashboard-logic.js, viewsOf); Health and
// Not shown are fixed chrome below it, never views the file can name.
function currentView() {
  var views = logic.viewsOf(store.model);
  if (store.view === 'health' || store.view === 'notshown') return store.view;
  var named = views.filter(function (v) { return v.name === store.view; })[0];
  return named ? named.name : (views.length ? views[0].name : 'notshown');
}

function renderShell() {
  var views = logic.viewsOf(store.model);
  var current = currentView();
  var unplaced = logic.placement(store.model);
  var notShownCount = unplaced.entities.length + unplaced.params.length;

  var nav = byId('rail-nav');
  nav.innerHTML = html`${views.map(function (v) {
    return html`<button data-view="${v.name}" class="${current === v.name ? 'active' : ''}">${v.label}</button>`;
  })}`;

  // The phone's bottom bar is the house's views and nothing else: every
  // slot there is one the file named. Health and Not shown are behind the
  // top bar's status button instead (renderStatusSheet).
  var tabs = byId('tabs-row');
  var tabHtml = views.map(function (v) {
    return html`<button data-view="${v.name}" class="${current === v.name ? 'active' : ''}">${TAB_ICONS[v.kind] || TAB_ICONS.view}<span class="tab-label">${v.label}</span></button>`;
  });
  // Rebuilding the scroller would reset its scroll position on every
  // render; only the active marks change between renders of the same nav.
  var viewsRow = tabs.querySelector('.tabs-views');
  var same = viewsRow && viewsRow.getAttribute('data-views') === views.map(function (v) { return v.name; }).join('\n');
  if (!same) {
    tabs.innerHTML = html`<div class="tabs-views" data-views="${views.map(function (v) { return v.name; }).join('\n')}">${tabHtml}</div>`;
  } else {
    tabs.querySelectorAll('button[data-view]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-view') === current);
    });
  }
  var activeTab = tabs.querySelector('.tabs-views button.active');
  if (activeTab && activeTab.scrollIntoView) activeTab.scrollIntoView({ block: 'nearest', inline: 'nearest' });

  var hw = healthWorstAndCount();
  var pin = byId('health-pin');
  var healthRows;
  if (hw.total === 0) {
    healthRows = html`<div class="row faint">no units yet</div>`;
  } else {
    var worstLine = hw.worst.status === 'running'
      ? ''
      : html`<div class="row"><span class="status-glyph status-${hw.worst.status}">${statusGlyph(hw.worst.status)}</span>&nbsp;
        ${titleCase(unitNameFromHealthKey(hw.worst.key))} · ${hw.worst.status}</div>`;
    healthRows = html`${worstLine}
      <div class="row"><span class="status-glyph status-running">●</span> ${hw.ok}/${hw.total} ok</div>`;
  }
  var chrome = html`<button class="pin-btn${current === 'health' ? ' active' : ''}" data-view="health"><div class="label">Health</div>${healthRows}</button>
    <button class="pin-btn${current === 'notshown' ? ' active' : ''}" data-view="notshown"><div class="label">Not shown</div>
    <div class="row">${notShownCount
      ? unplaced.entities.length + (unplaced.entities.length === 1 ? ' entity' : ' entities') +
        (unplaced.params.length ? ' · ' + unplaced.params.length + (unplaced.params.length === 1 ? ' setpoint' : ' setpoints') : '')
      : 'everything is on a view'}</div></button>`;
  pin.innerHTML = chrome;
  var about = aboutHtml();
  byId('rail-about').innerHTML = about;

  // The phone: one button in the top bar, the house's health at a glance,
  // opening the same chrome and the same about lines as the rail.
  var statusBtn = byId('topbar-status');
  var glyphStatus = hw.worst ? hw.worst.status : 'running';
  statusBtn.innerHTML = html`<span class="status-glyph status-${glyphStatus}">${statusGlyph(glyphStatus)}</span>
    ${hw.total ? hw.ok + '/' + hw.total : 'health'}${notShownCount ? html`<span class="faint">· ${notShownCount} not shown</span>` : ''}`;
  statusBtn.setAttribute('aria-label', 'Health, Not shown and about');
  statusBtn.classList.toggle('active', current === 'health' || current === 'notshown' || statusSheetOpen);
  statusBtn.setAttribute('aria-expanded', String(statusSheetOpen));
  var sheet = byId('status-sheet');
  sheet.innerHTML = html`${chrome}<div class="about">${about}</div>`;
  sheet.classList.toggle('show', statusSheetOpen);

  updateBanner();
}

var statusSheetOpen = false;

// Where the page is served from (dashboard.py, /api/model `about`) and
// where the project lives.
function aboutHtml() {
  var lines = logic.aboutLines(store.model && store.model.about);
  var link = function (href, text) {
    return html`<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
  };
  return html`${lines.map(function (l) {
    return html`<div>${l.label} ${l.href ? link(l.href, l.text) : l.text}
      ${l.commit ? html` · ${link(l.commitHref, l.commit)}` : ''}
      ${l.note ? html` <span class="about-note">${l.note}</span>` : ''}</div>`;
  })}
    <div class="about-links">${logic.ABOUT_LINKS.map(function (l) { return link(l.href, l.label); })}</div>`;
}

document.addEventListener('click', function (e) {
  var toggle = e.target.closest('[data-action="status-sheet"]');
  var inSheet = e.target.closest('#status-sheet');
  if (toggle) {
    statusSheetOpen = !statusSheetOpen;
    renderShell();
    return;
  }
  if (statusSheetOpen && !inSheet) {
    // A tap outside puts the sheet away and does nothing else: the
    // finger was aiming at the sheet's edge, not at what lies under it.
    statusSheetOpen = false;
    renderShell();
    e.preventDefault();
    e.stopImmediatePropagation();
    return;
  }
  if (statusSheetOpen && e.target.closest('[data-view]')) {
    statusSheetOpen = false; // a pick in the sheet puts it away
    renderShell();
  }
  var btn = e.target.closest('[data-view]');
  if (btn) {
    store.view = btn.getAttribute('data-view');
    renderShell();
    renderView();
  }
});

// ---- charts: geometry + markup ----


function chartPathData(coords) {
  return coords.map(function (c, i) {
    return (i === 0 ? 'M ' : 'L ') + c.x.toFixed(1) + ' ' + c.y.toFixed(1);
  }).join(' ');
}

function formatChartValue(aspect, v) {
  if (typeof v !== 'number') return String(v);
  return logic.formatAspect(aspect || '', null, v);
}

// A stored issue's stroke: paler the older it is, within the accent's
// own hue so the braid still reads as one series' future.
function issueInk(age) {
  // Neutral, and deliberately NOT ramping into the accent: the outcome
  // wears the accent, and a braid that reached it would make its newest
  // line indistinguishable from what actually happened.
  var pale = [214, 218, 216], full = [113, 126, 120];
  var c = pale.map(function (v, i) { return Math.round(v + (full[i] - v) * age); });
  return 'rgb(' + c.join(',') + ')';
}

// dashboard.toml's [[control]] entries, or none. The house's say over a
// control's grain, applied wherever that control is drawn.
function houseControls() {
  return (store.model && store.model.controls) || [];
}

// Every live claim about one aspect's future, one per source.
function forecastsOf(entity, aspect) {
  return logic.forecastsFor(store.forecasts, entity.room, entity.name, aspect);
}

// The claims that are still about the future. A belief whose horizon has
// run out is not drawn as one — the mirror keeps a producer's last word
// for as long as the core lives, and a curve that ends before now says
// nothing about what is ahead
// (docs/design.md#charts-forecasts-and-sources). It stays in the overlay
// under `forecasts`, which is where a spent claim is judged against what
// actually happened.
function liveForecastsOf(entity, aspect) {
  return forecastsOf(entity, aspect).filter(function (b) {
    return !logic.forecastFreshness(b.forecast, Date.now()).expired;
  });
}

// When a drawn belief was issued, said out loud. Without it a claim made
// yesterday reads exactly like one made ten minutes ago.
function issuedCaption(forecast) {
  var f = logic.forecastFreshness(forecast, Date.now());
  if (!f || f.issued === null) return '';
  // A bare clock is only unambiguous within the day it was said: "issued
  // 13:00" on a claim made yesterday reads as this afternoon, which is
  // the misreading this caption exists to prevent. Older than today, the
  // date comes with it.
  var sameDay = new Date(f.issued).toDateString() === new Date(Date.now()).toDateString();
  return 'issued ' + (sameDay ? formatChartClock(f.issued) : formatChartTime(f.issued));
}

// "min 0.38 at 03:00" — where the horizon goes, named at the hour it
// gets there. A flat horizon summarises to nothing and the caption stays
// empty rather than reporting an extreme that is just the current value.
function horizonCaption(aspect, field, forecast, fromTs) {
  var summary = logic.horizonSummary(forecast, fromTs);
  if (!summary) return '';
  var falling = summary.min.t > summary.max.t;
  var point = falling ? summary.min : summary.max;
  return (falling ? 'min ' : 'max ') +
    logic.formatAspect(aspect, field, point.v) + ' at ' + formatChartClock(point.t);
}

// A reading's time, at the precision the window justifies: on an hour of
// history the recorder's buckets are seconds wide, so minutes alone hide
// the thing the reader opened the chart to see. `spanMs` is the charted
// window; without one the time is the day and the minute.
function formatChartTime(ts, spanMs) {
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var fmt = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
  if (spanMs && spanMs <= 3 * 3600e3) fmt.second = '2-digit';
  return d.toLocaleString([], fmt);
}

// The same instant with the date dropped — the far end of a run, which
// the near end has already dated.
function formatChartClock(ts, spanMs) {
  var d = new Date(ts);
  if (isNaN(d.getTime())) return '';
  var fmt = { hour: '2-digit', minute: '2-digit' };
  if (spanMs && spanMs <= 3 * 3600e3) fmt.second = '2-digit';
  return d.toLocaleTimeString([], fmt);
}

// Builds a chart's markup (line + optional area/gridlines/y-labels) and
// registers its geometry under chartId for hover/tooltip wiring. Guards
// against sparse/empty history with a "no history yet" placeholder.
function buildChart(chartId, points, opts) {
  opts = opts || {};
  var height = opts.height || 36;
  var pad = opts.pad !== undefined ? opts.pad : 3;
  var sizeClass = opts.sizeClass || 'chart-tile';
  var geo = logic.chartGeometry(points || [], CHART_VBW, height, pad, opts.window, opts.forecast, opts.issues, opts.contributors);
  var inner;
  if (!geo) {
    chartRegistry[chartId] = null;
    inner = html`<div class="chart-empty">no history yet</div>`;
  } else {
    // The forecast's points join the hover registry, so a scrub reads
    // straight across the now-rule and "what will it be at 03:00" is the
    // same gesture as "what was it at 03:00".
    chartRegistry[chartId] = {
      coords: geo.forecast
        ? geo.coords.concat.apply(geo.coords, geo.forecast.map(function (f) { return f.coords; }))
        : geo.coords,
      issues: geo.issues || null,
      contributors: geo.contributors || null,
      actual: geo.coords,
      width: CHART_VBW, height: height, aspect: opts.aspect, window: opts.window
    };
    var d = chartPathData(geo.coords);
    // A forecast alone is enough to draw, so the recorded past can be
    // empty here — a detail overlay renders before its history arrives,
    // and a house that has a horizon but no recorder never has one.
    var last = geo.coords.length ? geo.coords[geo.coords.length - 1] : null;
    var marks = [];
    if (opts.gridlines) {
      [pad, height / 2, height - pad].forEach(function (y) {
        marks.push(html`<line class="chart-grid" x1="0" y1="${y.toFixed(1)}" x2="${CHART_VBW}" y2="${y.toFixed(1)}"/>`);
      });
    }
    // An area fill is for ONE series. Its baseline here is the smallest
    // value drawn, not zero and not any reference the reader chose, so
    // the filled area measures nothing — harmless while it is the only
    // mark and a slab the moment it is not, with a hard vertical cliff
    // where the record stops and the forecast takes over. A second
    // series (a horizon, a braid, a contributor) turns this into a line
    // chart, and a line chart carries its own shape.
    var alone = !(geo.forecast || geo.issues || geo.contributors);
    if (opts.area && last && alone) {
      var areaD = d + ' L ' + last.x.toFixed(1) + ' ' + (height - pad) + ' L ' + geo.coords[0].x.toFixed(1) + ' ' + (height - pad) + ' Z';
      marks.push(html`<path class="chart-area" d="${areaD}"/>`);
    }
    if (geo.issues) {
      geo.issues.forEach(function (f, n) {
        var d2 = chartPathData(f.coords);
        var pinned = opts.pinned !== undefined && opts.pinned !== null && f.issued === opts.pinned;
        marks.push(html`<path class="chart-issue-hit" data-issue="${n}" d="${d2}"/>`);
        marks.push(html`<path class="chart-issue${pinned ? ' pinned' : ''}" data-issue="${n}" d="${d2}" stroke="${pinned ? '' : issueInk(f.age)}"/>`);
      });
    }
    if (geo.contributors) {
      geo.contributors.forEach(function (c) {
        marks.push(html`<path class="chart-contributor" data-source="${c.name}" d="${chartPathData(c.coords)}"/>`);
      });
    }
    marks.push(html`<path class="chart-line" d="${d}"/>`);
    if (geo.forecast && geo.forecast.length) {
      // Dashed, and starting from the last recorded point so the eye
      // follows one line: the change in stroke is what says "from here
      // on this is a belief, not a record". With several sources each
      // gets its own line from that same point — they are claims about
      // one future, and which is which is read from the legend and the
      // scrub, not from a colour none of them can own.
      geo.forecast.forEach(function (f) {
        // Joined to the last record ONLY when it continues from there.
        // A claim that starts earlier already spans the now-rule under
        // its own steam, and anchoring it to the record would make the
        // path run backwards from the present to reach its own first
        // point — a straight dashed line into the past that no source
        // ever drew.
        var head = f.coords[0];
        var joined = last && head && last.x <= head.x ? [last].concat(f.coords) : f.coords;
        marks.push(html`<path class="chart-forecast${f.stale ? ' stale' : ''}" data-source="${f.source}" d="${chartPathData(joined)}"/>`);
      });
    }
    if (geo.nowX !== undefined) {
      marks.push(html`<line class="chart-now" x1="${geo.nowX.toFixed(1)}" y1="0" x2="${geo.nowX.toFixed(1)}" y2="${height}"/>`);
    }
    // The dot marks the latest RECORDED value, so there is none to mark
    // when nothing has been recorded.
    var dot = last
      ? html`<div class="chart-dot" style="left:${(last.x / CHART_VBW * 100).toFixed(2)}%; top:${(last.y / height * 100).toFixed(2)}%;"></div>`
      : '';
    inner = html`<svg viewBox="0 0 ${CHART_VBW} ${height}" preserveAspectRatio="none">${marks}
      <line class="chart-crosshair" x1="0" y1="0" x2="0" y2="${height}" style="display:none;"/></svg>
      ${dot}<div class="chart-crosshair-dot" style="display:none;"></div>
      ${opts.yLabels ? html`<div class="chart-ylabel chart-ylabel-top">${formatChartValue(opts.aspect, geo.max)}</div>
        <div class="chart-ylabel chart-ylabel-bottom">${formatChartValue(opts.aspect, geo.min)}</div>` : ''}`;
  }
  // A chart with no time axis leaves the reader to guess how far back it
  // goes; the range chip says "24h" but never where the window starts or
  // ends, and with a horizon drawn the right edge is not even now. The
  // middle slot names the now-rule when one is drawn, which is the only
  // instant on the axis a reader has to find rather than read.
  var axis = '';
  if (opts.yLabels && geo && geo.from && geo.to > geo.from) {
    var span = geo.to - geo.from;
    // The near end dates the axis; the far end only needs the clock,
    // unless it falls on another day.
    var sameDay = new Date(geo.from).toDateString() === new Date(geo.to).toDateString();
    var nowPct = geo.nowX === undefined ? null : (geo.nowX / CHART_VBW) * 100;
    // Crowded against either end it would collide with the label there,
    // and the rule itself already says where now is.
    var nowLabel = nowPct !== null && nowPct > 14 && nowPct < 86
      ? html`<span class="chart-xnow" style="left:${nowPct.toFixed(1)}%">now</span>`
      : '';
    axis = html`<div class="chart-xaxis">
      <span>${formatChartTime(geo.from, span)}</span>${nowLabel}
      <span>${sameDay ? formatChartClock(geo.to, span) : formatChartTime(geo.to, span)}</span>
      </div>`;
  }
  return html`<div class="chart-wrap ${sizeClass}" data-chart-id="${chartId}">${inner}</div>${axis}`;
}

// A timeline: one band per run of a bool or string state over the window
// (dashboard-logic.js, timelineRuns). A boolean is a filled band while
// true and a faint one while false; a string's runs alternate two tints
// so each change reads as an edge, and the tooltip names the value.
function buildTimeline(chartId, points, opts) {
  var height = opts.height || 36;
  var sizeClass = opts.sizeClass || 'chart-tile';
  var runs = logic.timelineRuns(points || [], opts.window.from, opts.window.to);
  var inner;
  if (runs.length === 0) {
    chartRegistry[chartId] = null;
    inner = html`<div class="chart-empty">no history yet</div>`;
  } else {
    var span = opts.window.to - opts.window.from;
    chartRegistry[chartId] = { runs: runs, window: opts.window, width: CHART_VBW, height: height, aspect: opts.aspect, field: opts.field };
    var bands = runs.map(function (r, i) {
      var x = (r.start - opts.window.from) / span * CHART_VBW;
      var w = Math.max(1, (r.end - r.start) / span * CHART_VBW);
      var cls = r.value === true ? 'tl-on' : r.value === false ? 'tl-off' : (i % 2 ? 'tl-b' : 'tl-a');
      return html`<rect class="${cls}" x="${x.toFixed(1)}" y="2" width="${w.toFixed(1)}" height="${height - 4}"/>`;
    });
    inner = html`<svg viewBox="0 0 ${CHART_VBW} ${height}" preserveAspectRatio="none">${bands}
      <line class="chart-crosshair" x1="0" y1="0" x2="0" y2="${height}" style="display:none;"/></svg>`;
  }
  return html`<div class="chart-wrap ${sizeClass}" data-chart-id="${chartId}">${inner}</div>`;
}

function minMaxCaption(points) {
  var vals = (points || []).map(function (p) { return p.value; }).filter(function (v) { return typeof v === 'number'; });
  if (vals.length === 0) return '';
  var min = Math.min.apply(null, vals);
  var max = Math.max.apply(null, vals);
  return min.toFixed(1) + '–' + max.toFixed(1) + ' today';
}

// ---- charts: hover crosshair + tooltip ----

function wireChartInteractions(root) {
  (root || document).querySelectorAll('.chart-wrap[data-chart-id]').forEach(function (wrap) {
    var id = wrap.getAttribute('data-chart-id');
    var reg = chartRegistry[id];
    if (!reg) return;
    var onMove;
    if (reg.runs) onMove = onTimelinePointerMove;
    else if (reg.coords && reg.coords.length >= 2) onMove = onChartPointerMove;
    else return;

    // A chart inside a card that taps through to something else keeps
    // hover-only reading: claiming the press there would fight the tap
    // the card exists for. The charts a reader actually scrubs — the
    // detail overlay's — sit in no such card.
    if (!wrap.closest('[data-action]')) {
      wrap.classList.add('scrubbable');
      var down = null;
      wrap.addEventListener('pointerdown', function (ev) {
        // A touch has no position until it moves, so the press itself has
        // to read, or a tap would show nothing and only a drag would work.
        // Capture keeps a finger that wanders off a 64px strip scrubbing
        // instead of dropping the gesture mid-read.
        if (wrap.setPointerCapture) wrap.setPointerCapture(ev.pointerId);
        down = { x: ev.clientX, y: ev.clientY };
        onMove(wrap, reg, ev);
      });
      // A tap pins the line under it; a drag is a scrub and pins nothing.
      // The two arrive as the same pointer sequence, so the only thing
      // separating them is how far the pointer travelled.
      wrap.addEventListener('pointerup', function (ev) {
        var moved = down && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > TAP_SLOP;
        down = null;
        if (moved || !reg.issues) return;
        var rect = wrap.getBoundingClientRect();
        if (!rect.width) return;
        var near = nearestIssue(
          reg, rect,
          ((ev.clientX - rect.left) / rect.width) * reg.width,
          ((ev.clientY - rect.top) / rect.height) * reg.height
        );
        overlay.pinned = near && overlay.pinned !== near.issue.issued ? near.issue.issued : null;
        renderOverlayContent();
      });
    }
    wrap.addEventListener('pointermove', function (ev) { onMove(wrap, reg, ev); });
    // pointerleave never fires for a lifted finger, and a gesture the
    // scroller claims arrives as pointercancel: either one would leave
    // the crosshair and the tooltip stranded on screen.
    wrap.addEventListener('pointerup', function () { onChartPointerLeave(wrap); });
    wrap.addEventListener('pointercancel', function () { onChartPointerLeave(wrap); });
    wrap.addEventListener('pointerleave', function () { onChartPointerLeave(wrap); });
  });
}

/* Which drawn issue the pointer is nearest, in BOTH dimensions. The
 * nearest point by x alone is right for one series and meaningless for a
 * braid: x alone picks whichever line happens to have a sample closest
 * horizontally, ignoring that the pointer may be nowhere near it. */
function nearestIssue(reg, rect, tx, ty) {
  if (!reg.issues || !reg.issues.length) return null;
  // Distance is measured in SCREEN pixels, not viewBox units. The
  // viewBox is stretched to the wrapper, so its x and y units are
  // nothing like the same size — at the full-window chart one x unit is
  // six times a y unit — and a circle of "nearness" in viewBox space is
  // a thin ellipse to the reader, who then cannot hit the line they are
  // pointing at.
  var sx = rect.width / reg.width, sy = rect.height / reg.height;
  var best = null, bestD = Infinity;
  reg.issues.forEach(function (f, n) {
    f.coords.forEach(function (p) {
      var dx = (p.x - tx) * sx, dy = (p.y - ty) * sy;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = { index: n, issue: f, point: p }; }
    });
  });
  // Far from every line is not a selection: a scrub across empty chart
  // should not drag a highlight along with it.
  return bestD <= NEAR_ISSUE * NEAR_ISSUE ? best : null;
}
// CSS pixels — what the reader sees, and roughly a fingertip.
var NEAR_ISSUE = 26;
// Pointer travel, in CSS pixels, past which a press is a scrub and not a
// tap. A thumb never holds perfectly still, so zero would mean nothing
// was ever tappable.
var TAP_SLOP = 8;

function onChartPointerMove(wrap, reg, ev) {
  var rect = wrap.getBoundingClientRect();
  if (rect.width === 0) return;
  var fx = (ev.clientX - rect.left) / rect.width;
  fx = Math.max(0, Math.min(1, fx));
  var tx = fx * reg.width;
  var svg = wrap.querySelector('svg');
  if (!svg) return;
  if (reg.issues) {
    onBraidPointerMove(wrap, reg, ev, rect, tx);
    return;
  }
  var c = reg.coords[0];
  reg.coords.forEach(function (p) { if (Math.abs(p.x - tx) < Math.abs(c.x - tx)) c = p; });
  var line = svg.querySelector('.chart-crosshair');
  var dot = wrap.querySelector('.chart-crosshair-dot');
  line.setAttribute('x1', c.x); line.setAttribute('x2', c.x);
  line.style.display = '';
  if (dot) {
    dot.style.left = (c.x / reg.width * 100).toFixed(2) + '%';
    dot.style.top = (c.y / reg.height * 100).toFixed(2) + '%';
    dot.style.display = '';
  }
  var px = rect.left + (c.x / reg.width) * rect.width;
  var py = rect.top + (c.y / reg.height) * rect.height;
  var span = reg.window ? reg.window.to - reg.window.from : 0;
  showChartTooltip(px, py, formatChartValue(reg.aspect, c.value), formatChartTime(c.ts, span));
  sourcesColumn(reg, tx);
}

/* Every source's reading at the instant under the pointer, written under
 * the chart. The tooltip is about the value the house believes; this is
 * about where that belief came from, which is the question the sources
 * were drawn to answer. */
function sourcesColumn(reg, tx) {
  var el = byId('sources-column');
  if (!el) return;
  if (!reg.contributors || tx === null) { el.textContent = ''; return; }
  var field = descriptorField(overlay.entity, overlay.aspect);
  var parts = [];
  reg.contributors.forEach(function (c) {
    var near = null;
    c.coords.forEach(function (p) {
      if (!near || Math.abs(p.x - tx) < Math.abs(near.x - tx)) near = p;
    });
    if (near) parts.push(c.label + ' ' + logic.formatAspect(overlay.aspect, field, near.value));
  });
  el.textContent = parts.join(' \u00b7 ');
}

/* Scrubbing a braid reads two things at once: the issue under the
 * pointer (highlighted, and named in the tooltip) and the whole column
 * at that instant (how many forecasts spoke about it, and how far apart
 * they were) — which is the one slice that cannot share this chart's
 * axis, delivered by the gesture rather than by a second control. */
function onBraidPointerMove(wrap, reg, ev, rect, tx) {
  var ty = ((ev.clientY - rect.top) / rect.height) * reg.height;
  var near = nearestIssue(reg, rect, tx, ty);
  wrap.querySelectorAll('.chart-issue').forEach(function (el) {
    el.classList.toggle('hovered', !!near && el.getAttribute('data-issue') === String(near.index));
  });
  var line = wrap.querySelector('.chart-crosshair');
  if (line) { line.setAttribute('x1', tx); line.setAttribute('x2', tx); line.style.display = ''; }
  var when = reg.window ? reg.window.from + (tx / reg.width) * (reg.window.to - reg.window.from) : null;
  var span = reg.window ? reg.window.to - reg.window.from : 0;
  if (!near) { hideChartTooltip(); braidColumn(reg, when); return; }
  var dot = wrap.querySelector('.chart-crosshair-dot');
  if (dot) {
    dot.style.left = (near.point.x / reg.width * 100).toFixed(2) + '%';
    dot.style.top = (near.point.y / reg.height * 100).toFixed(2) + '%';
    dot.style.display = '';
  }
  showChartTooltip(
    rect.left + (near.point.x / reg.width) * rect.width,
    rect.top + (near.point.y / reg.height) * rect.height,
    formatChartValue(reg.aspect, near.point.value),
    (near.issue.source ? logic.sourceLabel(near.issue.source) + ' \u00b7 ' : '') +
      'issued ' + formatChartTime(near.issue.issued, span) + ' \u2014 for ' +
      formatChartClock(near.point.ts, span)
  );
  braidColumn(reg, when);
}

// The column reading, written under the chart rather than into the
// tooltip: the tooltip is about one forecast, this is about all of them.
function braidColumn(reg, when) {
  var el = byId('braid-column');
  if (!el) return;
  var col = when === null ? null : logic.columnAt(overlay.issues || [], when);
  if (!col) { el.textContent = ''; return; }
  var field = descriptorField(overlay.entity, overlay.aspect);
  el.textContent = formatChartClock(when) + ' \u00b7 ' + col.count + ' forecast' +
    (col.count === 1 ? '' : 's') + ' \u00b7 ' +
    logic.formatAspect(overlay.aspect, field, col.min) + ' to ' +
    logic.formatAspect(overlay.aspect, field, col.max);
}

function onTimelinePointerMove(wrap, reg, ev) {
  var rect = wrap.getBoundingClientRect();
  if (rect.width === 0) return;
  var fx = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  var t = reg.window.from + fx * (reg.window.to - reg.window.from);
  var run = null;
  reg.runs.forEach(function (r) { if (t >= r.start && t < r.end) run = r; });
  var line = wrap.querySelector('.chart-crosshair');
  if (!line) return;
  var x = fx * reg.width;
  line.setAttribute('x1', x); line.setAttribute('x2', x);
  line.style.display = '';
  if (!run) { hideChartTooltip(); return; }
  // A run's two edges and how long it held: "since 14:32" alone could not
  // say whether a state lasted a minute or all afternoon, which is most
  // of what a timeline is read for. The last run has no end yet.
  var span = reg.window.to - reg.window.from;
  var ongoing = run.end >= reg.window.to;
  var when = ongoing
    ? 'since ' + formatChartTime(run.start, span)
    : formatChartTime(run.start, span) + ' → ' + formatChartClock(run.end, span);
  showChartTooltip(ev.clientX, rect.top, logic.formatAspect(reg.aspect || '', reg.field, run.value),
    when + ' · ' + fmtDuration(run.end - run.start));
}

function onChartPointerLeave(wrap) {
  var line = wrap.querySelector('.chart-crosshair');
  var dot = wrap.querySelector('.chart-crosshair-dot');
  if (line) line.style.display = 'none';
  if (dot) dot.style.display = 'none';
  hideChartTooltip();
  var col = byId('sources-column');
  if (col) col.textContent = '';
}

function showChartTooltip(x, y, valueText, timeText) {
  var tt = byId('chart-tooltip');
  byId('chart-tooltip-value').textContent = valueText;
  byId('chart-tooltip-time').textContent = timeText;
  tt.classList.add('show');
  var ttRect = tt.getBoundingClientRect();
  var left = x + 12;
  var top = y - ttRect.height - 10;
  if (left + ttRect.width > window.innerWidth - 8) left = x - ttRect.width - 12;
  if (left < 8) left = 8;
  if (top < 8) top = y + 12;
  tt.style.left = left + 'px';
  tt.style.top = top + 'px';
}

function hideChartTooltip() {
  byId('chart-tooltip').classList.remove('show');
}

// ---- widget: entity capability rows (shared by Rooms and generic use) ----

// Controls render inert when this dashboard's manifest does not grant the
// entity's capability (model.commandable): the server refuses such a
// command anyway, and a live-looking control for it would misreport the
// grant table.
function controlDisabled(entity) { return !entity.commandable; }

function widgetForLight(entity) {
  var on = !!stateValue(entity.room, entity.name, 'on');
  var inert = controlDisabled(entity);
  var rows = [html`<div class="entity-row row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <span class="entity-name" title="${entity.label}">${entity.label}</span>
    <span class="toggle ${on ? 'on' : ''}${inert ? ' disabled' : ''}"${inert ? '' : html` data-action="toggle-light"`} data-room="${entity.room}" data-entity="${entity.name}" data-value="${!on}"><span class="knob"></span></span>
    </div>`];

  if (entity.features && entity.features.indexOf('brightness') !== -1) {
    var b = stateValue(entity.room, entity.name, 'brightness');
    var bkey = entity.room + '/' + entity.name + '/brightness';
    var pct = typeof b === 'number' ? Math.round((b / 254) * 100) : 0;
    if (localState.sliderDrag[bkey] !== undefined) pct = localState.sliderDrag[bkey];
    var nudgeAttrs = html` data-room="${entity.room}" data-entity="${entity.name}"${inert || typeof b !== 'number' ? html` disabled` : ''}`;
    // This is a percent the house may want in fives; the bespoke light
    // controls read the same [[control]] entries as every other slider.
    var bstep = logic.declaredStep(houseControls(), { entity: entity.name, aspect: 'brightness' });
    rows.push(html`<div class="slider-row entity-sub"><span class="slabel">brightness</span>
      <button class="step-btn" data-action="brightness-step"${nudgeAttrs} data-delta="${-(bstep || 10)}" aria-label="dimmer">&minus;</button>
      <input type="range" min="0" max="100"${bstep ? html` step="${bstep}"` : ''} value="${pct}"${inert ? html` disabled` : ''} data-action="slider" data-kind="brightness" data-room="${entity.room}" data-entity="${entity.name}">
      <span class="sval">${pct}%</span>
      <button class="step-btn" data-action="brightness-step"${nudgeAttrs} data-delta="${bstep || 10}" aria-label="brighter">+</button></div>`);
  }
  if (entity.features && entity.features.indexOf('color_temp') !== -1) {
    var ct = stateValue(entity.room, entity.name, 'color_temp');
    var ctkey = entity.room + '/' + entity.name + '/color_temp';
    var mired = typeof ct === 'number' ? ct : 300;
    if (localState.sliderDrag[ctkey] !== undefined) mired = localState.sliderDrag[ctkey];
    var kelvin = Math.round(1e6 / mired / 100) * 100;
    rows.push(html`<div class="slider-row entity-sub"><span class="slabel">color temp</span>
      <input type="range" min="150" max="500" value="${mired}"${inert ? html` disabled` : ''} data-action="slider" data-kind="color_temp" data-room="${entity.room}" data-entity="${entity.name}">
      <span class="sval">${kelvin} K</span></div>`);
  }
  return html`${rows}`;
}

function widgetForPresence(entity) {
  var occ = presenceValue(entity);
  var seenKey = entity.room + '/' + entity.name;
  var lastSeen = store.lastSeen[seenKey];
  var label = occ ? 'Motion' : 'Clear';
  var extra = lastSeen ? html`<span class="faint" title="${new Date(lastSeen).toLocaleString()}"> &middot; ${relTime(lastSeen)}</span>` : '';
  return html`<div class="entity-row row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <span class="entity-name" title="${entity.label}">${entity.label}</span>
    <span><span class="status-dot ${occ ? 'dot-on' : 'dot-off'}"></span>${label}${extra}</span>
    </div>`;
}

function widgetForLock(entity) {
  var locked = !!stateValue(entity.room, entity.name, 'locked');
  var badge = entity.write_mode === 'arbitrated' ? html`<span class="badge-arbitrated">ARBITRATED</span>` : '';
  return html`<div class="entity-row row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <span class="entity-name" title="${entity.label}">${entity.label}${badge}</span>
    <span class="toggle ${locked ? 'on' : ''}${controlDisabled(entity) ? ' disabled' : ''}"${controlDisabled(entity) ? '' : html` data-action="toggle-lock"`} data-room="${entity.room}" data-entity="${entity.name}" data-value="${!locked}"><span class="knob"></span></span>
    </div>`;
}

function widgetForClimate(entity, big) {
  var setpoint = stateValue(entity.room, entity.name, 'setpoint');
  var hasSetpoint = typeof setpoint === 'number';
  var readout = hasSetpoint ? setpoint.toFixed(1) + '°' : '—';
  var indoor = stateValue(entity.room, entity.name, 'indoor_temperature');
  var feed = stateValue(entity.room, entity.name, 'feed_temperature');
  var nowParts = [];
  if (typeof indoor === 'number') nowParts.push(indoor.toFixed(1) + '° now');
  if (typeof feed === 'number') nowParts.push(feed.toFixed(1) + '° feed');
  var badge = entity.write_mode === 'arbitrated' ? html`<span class="badge-arbitrated">ARBITRATED</span>` : '';
  var disabled = !(hasSetpoint && !controlDisabled(entity));
  if (big) {
    // the overlay and the dial widget: the vocabulary's setpoint on a
    // dial, bounds the capability's usual (the adapter enforces its own)
    return renderDial('climate-step', html` data-room="${entity.room}" data-entity="${entity.name}"`, {
      value: setpoint, display: readout, min: 5, max: 30, step: 0.5,
      disabled: disabled, current: nowParts.join(' · ')
    });
  }
  var disabledAttr = disabled ? html` disabled` : '';
  return html`<div class="entity-row row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <span class="entity-name" title="${entity.label}">${entity.label}${badge}</span>
    <span style="display:flex;align-items:center;gap:10px;">
    ${nowParts.length ? html`<span class="faint">${nowParts.join(' · ')}</span>` : ''}
    <span class="stepper">
    <button class="step-btn" data-action="climate-step" data-room="${entity.room}" data-entity="${entity.name}" data-delta="-0.5"${disabledAttr}>&minus;</button>
    <span class="stepper-value">${readout}</span>
    <button class="step-btn" data-action="climate-step" data-room="${entity.room}" data-entity="${entity.name}" data-delta="0.5"${disabledAttr}>+</button>
    </span></span></div>`;
}

// A sensor's card: one sparkline row per reading, each tapping through to
// that aspect's history. Which readings, in what order, is the descriptor's
// say (dashboard-logic.js, sensorCardPlan): a thermometer lists
// temperature and humidity, not its link quality. A multi-aspect sensor
// gets a head row with the entity name that opens the entity detail — the
// aspect rows are the only other affordance, and they lead to a chart. The
// overlay, which is that detail, renders the rows without the head.
function widgetForSensor(entity, withHead) {
  var rows = logic.sensorCardPlan(entity, store.state, store.aspects[entity.name]);
  if (rows.length === 0) {
    return html`<div class="entity-row"><span class="entity-name">${entity.label}</span><span class="faint">no data</span></div>`;
  }
  var multi = rows.length > 1;
  var attrs = html` data-room="${entity.room}" data-entity="${entity.name}"`;
  var head = multi && withHead !== false
    ? html`<div class="entity-row row-clickable" data-action="entity-detail"${attrs}>
      <span class="entity-name" title="${entity.label}">${entity.label}</span></div>`
    : '';
  return html`${head}${rows.map(function (r) {
    var sk = entity.name + '|' + r.aspect;
    ensureHistory(entity.name, r.aspect); // fetched once (guarded), on first render while visible
    var s = localState.sparklines[sk];
    var spark = s && s.loaded ? buildChart('room-' + sk, s.points, { height: 28, sizeClass: 'chart-row', aspect: r.aspect, area: true, window: s.window }) : null;
    var name = multi ? r.label : entity.label;
    return html`<div class="entity-row row-clickable${multi ? ' sensor-reading' : ''}" data-action="history-detail"${attrs} data-aspect="${r.aspect}">
      <span class="entity-name" title="${name}">${name}</span>
      <span style="display:flex;align-items:center;gap:8px;">
      ${spark ? html`<span style="width:80px;">${spark}</span>` : ''}
      <span class="muted${r.stale ? ' stale' : ''}">${r.display}</span></span>
      </div>`;
  })}`;
}

function widgetGeneric(entity) {
  var prefix = 'home/state/' + entity.room + '/' + entity.name + '/';
  var rows = [];
  Object.keys(store.state).forEach(function (k) {
    if (k.indexOf(prefix) === 0) {
      var aspect = k.slice(prefix.length);
      rows.push(html`<div class="aspect-row">${aspect}: ${logic.formatAspect(aspect, null, store.state[k])}</div>`);
    }
  });
  if (rows.length === 0) rows.push(html`<div class="aspect-row faint">no data</div>`);
  return html`<div class="entity-row row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}" style="flex-direction:column;align-items:flex-start;">
    <span class="entity-name" title="${entity.label}">${entity.label}</span>${rows}</div>`;
}

function widgetForCamera(entity) {
  // No poster: a still frame means transcoding H.264 to JPEG, which is a
  // transcoder in the image for a thumbnail (docs/design.md#cameras —
  // the plane split is a pure remux). A failing <img> renders as a black
  // rectangle indistinguishable from a dark room, which is worse than
  // saying plainly the picture is a tap away. Motion still reads here,
  // from the event plane, which is the part that matters at a glance. The
  // live view opens in the detail overlay — never N always-on streams.
  var motion = stateValue(entity.room, entity.name, 'motion');
  var badge = motion === true ? html`<span class="badge-motion">MOTION</span>` : '';
  return html`<div class="entity-row row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}" style="flex-direction:column;align-items:stretch;gap:6px;">
    <span style="display:flex;justify-content:space-between;align-items:center;">
    <span class="entity-name" title="${entity.label}">${entity.label}</span>${badge}</span>
    <span class="camera-tap">&#9654; tap to view</span>
    </div>`;
}

// The room-card row for an entity whose adapter published an aspect
// descriptor: name and the first family control on one line, the headline
// readings underneath — never the readout-wrapped-around-a-stepper row
// the undescribed climate widget degrades to in a narrow column. Which
// readings are headline is dashboard-logic.js's cardPlan.
function widgetForDescribed(entity) {
  var plan = logic.cardPlan(entity, store.state, store.aspects[entity.name], !controlDisabled(entity), houseControls());
  var badge = entity.write_mode === 'arbitrated' ? html`<span class="badge-arbitrated">ARBITRATED</span>` : '';
  var control = plan.controls.length ? renderAspectControl(entity, plan.controls[0]) : '';
  var readings = plan.readings.map(function (r, i) {
    return html`${i ? html`<span class="sep">&middot;</span>` : ''}<span class="card-reading${r.stale ? ' stale' : ''}" title="${r.aspect}">
      ${r.label} <b>${r.display}</b></span>`;
  });
  // The badge rides the readings line: inside the ellipsed name it clips
  // to a stub in a narrow column, and the head line belongs to the control.
  return html`<div class="entity-row described-card row-clickable" data-action="entity-detail" data-room="${entity.room}" data-entity="${entity.name}">
    <div class="described-head"><span class="entity-name" title="${entity.label}">${entity.label}</span>${control}</div>
    ${readings.length || badge ? html`<div class="described-readings">${readings}${badge ? html`<span class="card-badge">${badge}</span>` : ''}</div>` : ''}
    </div>`;
}

function widgetForEntity(entity) {
  var described = !!store.aspects[entity.name];
  if (described && (entity.capability === 'climate' || !BESPOKE_WIDGET[entity.capability])) return widgetForDescribed(entity);
  if (entity.capability === 'light' || entity.capability === 'switch') return widgetForLight(entity);
  if (entity.capability === 'presence') return widgetForPresence(entity);
  if (entity.capability === 'lock') return widgetForLock(entity);
  if (entity.capability === 'climate') return widgetForClimate(entity);
  if (entity.capability === 'sensor') return widgetForSensor(entity);
  if (entity.capability === 'camera') return widgetForCamera(entity);
  return widgetGeneric(entity);
}

var CAP_ORDER = { light: 0, lock: 1, presence: 2, climate: 3, sensor: 4, camera: 5 };
// Capabilities whose card widget is the capability's own (a toggle, a
// sparkline, a poster) rather than the descriptor-driven row.
var BESPOKE_WIDGET = { light: true, switch: true, presence: true, lock: true, sensor: true, camera: true };
function capRank(entity) {
  var r = CAP_ORDER[entity.capability];
  return r === undefined ? 6 : r;
}

// ---- relative time ----

function relTime(ms) {
  var diff = Math.max(0, Date.now() - ms);
  var mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins === 1) return '1 min ago';
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins / 60);
  if (hrs === 1) return '1 hr ago';
  return hrs + ' hr ago';
}

// ---- widget: map (person entities) ----
//
// The map is a view over every person entity, not a per-entity row (see
// docs/design.md#map-and-people). Leaflet's map object is
// stateful (pan/zoom, tile cache) and must not be recreated on every
// state-delta render, so its container is a detached DOM node kept in
// mapState and moved into a fresh slot each render, rather than rebuilt
// from an HTML string like the rest of the view.

var mapState = { container: null, map: null, tileLayer: null, markers: {}, circles: {}, fitted: false };

function personEntities() {
  return (store.model.entities || []).filter(function (e) { return e.capability === 'person'; });
}

function personLatLon(entity) {
  var lat = stateValue(entity.room, entity.name, 'lat');
  var lon = stateValue(entity.room, entity.name, 'lon');
  if (typeof lat !== 'number' || typeof lon !== 'number') return null;
  return [lat, lon];
}

function mapThemeName() {
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

function personDivIcon(entity) {
  return L.divIcon({
    className: 'person-marker',
    // Leaflet takes a string here (and a popup's content below), not markup
    html: String(html`<div class="person-marker-dot"></div><div class="person-marker-label">${entity.label}</div>`),
    iconSize: [12, 12],
    iconAnchor: [6, 6]
  });
}

function personPopupHtml(entity) {
  var battery = stateValue(entity.room, entity.name, 'battery');
  var fixedAt = stateValue(entity.room, entity.name, 'fixed_at');
  var parts = [];
  if (typeof battery === 'number') parts.push('battery ' + Math.round(battery) + '%');
  if (typeof fixedAt === 'number') parts.push(relTime(fixedAt * 1000));
  return String(html`<b>${entity.label}</b>${parts.length ? html`<br>${parts.join(' · ')}` : ''}`);
}

function ensureMap() {
  if (mapState.map) return;
  if (!mapState.container) {
    mapState.container = document.createElement('div');
    mapState.container.id = 'person-map';
    mapState.container.className = 'map-wrap';
  }
  // No default setView: a center/zoom is set only once real fixes exist
  // (updateMapMarkers), so no coordinate is ever hardcoded. Layers added
  // before that point just wait for it (Leaflet defers via whenReady).
  mapState.map = L.map(mapState.container);
  if (store.model.tiles) {
    mapState.tileLayer = protomapsL.leafletLayer({ url: '/tiles.pmtiles', theme: mapThemeName() }).addTo(mapState.map);
  }
}

function updateMapMarkers(persons) {
  var map = mapState.map;
  var bounds = [];
  var seen = {};
  persons.forEach(function (e) {
    var key = e.room + '/' + e.name;
    seen[key] = true;
    var latlon = personLatLon(e);
    if (!latlon) {
      if (mapState.markers[key]) { map.removeLayer(mapState.markers[key]); delete mapState.markers[key]; }
      if (mapState.circles[key]) { map.removeLayer(mapState.circles[key]); delete mapState.circles[key]; }
      return;
    }
    bounds.push(latlon);
    var marker = mapState.markers[key];
    if (!marker) {
