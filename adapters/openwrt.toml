schema = 1

[unit]
name = "openwrt"
kind = "adapter"
description = "OpenWrt routers: the WAN link and which devices are on the WiFi"

[runtime]
command = "uv run units/openwrt.py"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_OPENWRT"]

# The path of the routers' credentials file, kept outside the repo.
[discovery]
mode = "static"
endpoint = "${HOMEOSTAT_OPENWRT}"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
discovery = { key = "home/discovery/openwrt" }

# Queried once at start: the trackers' last `sighted`, so a restart does
# not give a fresh fix to every device a router still lists.
[bus.subscribes]
sighted = "home/state/person/*/sighted"

[params.poll_interval_s]
type = "int"
default = 30
constraint = { min = 1, max = 3600 }
editable_by = "owner"

# How long a device may be missing from every router before its tracker
# reads as not sighted. It also covers an access point's reboot.
[params.away_delay_s]
type = "int"
default = 180
constraint = { min = 0, max = 3600 }
editable_by = "family"

[entities]
dir = "entities/openwrt/"
