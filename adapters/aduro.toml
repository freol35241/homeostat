schema = 1

[unit]
name = "aduro"
kind = "adapter"
description = "Aduro pellet burners through the aduro2mqtt bridge"

[runtime]
command = "uv run units/aduro.py"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_MQTT_CREDENTIALS"]

[discovery]
mode = "static"
endpoint = "mqtt://mosquitto:1883"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
discovery = { key = "home/discovery/aduro" }

[bus.subscribes]
commands = "home/cmd/{room}/{entity}/**"
arbiter_commands = "home/arbiter/{room}/{entity}/**"

# How long a stove may stay silent before its entities read as
# unavailable.
[params.availability_timeout_s]
type = "float"
default = 300.0
editable_by = "owner"

[entities]
dir = "entities/aduro/"
