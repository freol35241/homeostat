schema = 1

[unit]
name = "zigbee2mqtt"
kind = "adapter"
description = "Zigbee2MQTT bridge"

[runtime]
command = "uv run units/zigbee2mqtt.py"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_MQTT_CREDENTIALS"]

# The path is the bridge's base topic, default zigbee2mqtt.
[discovery]
mode = "static"
endpoint = "mqtt://mosquitto:1883"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }
discovery = { key = "home/discovery/zigbee2mqtt" }

[bus.subscribes]
commands = "home/cmd/{room}/{entity}/**"
arbiter_commands = "home/arbiter/{room}/{entity}/**"

# How long to wait at startup for the bridge's device inventory.
[params.inventory_timeout_s]
type = "float"
default = 30.0
constraint = { min = 1 }
editable_by = "owner"

[entities]
dir = "entities/zigbee2mqtt/"
