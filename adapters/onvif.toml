schema = 1

[unit]
name = "onvif"
kind = "adapter"
description = "Motion events from ONVIF cameras"

[runtime]
command = "uv run units/onvif.py"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_CAMERAS"]

# Every adapter declares [discovery]. This one addresses cameras through
# the HOMEOSTAT_CAMERAS file and does not browse.
[discovery]
mode = "mdns"
service = "_onvif._tcp"

[bus.publishes]
state = { key = "home/state/{room}/{entity}/**" }

[params.resubscribe_after_s]
type = "int"
default = 40
constraint = { min = 1, max = 50 }
editable_by = "owner"

[entities]
dir = "entities/onvif/"
