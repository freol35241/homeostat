# The scripts run on 3.11 or later, like everything else here; ruff
# cannot read that from a script that has no PEP 723 header.
[per-file-target-version]
"scripts/*.py" = "py311"

[lint]
# pydocstyle (NumPy convention), bugbear, pyupgrade, simplify, return.
extend-select = ["D", "B", "UP", "SIM", "RET"]
ignore = [
    # A unit's callbacks run on a foreign library's thread (paho-mqtt,
    # aioesphomeapi, zenoh) or off untrusted device/network input; the
    # deliberate pattern throughout is to catch broadly, log, and keep the
    # unit's liveliness token valid rather than let one bad input or one
    # library's quirk kill it. Each site names why in its own comment.
    "BLE001",
    # ValueError is this codebase's uniform "malformed input" sentinel —
    # parse_cmd_envelope and its callers raise/catch it regardless of
    # which specific check failed (missing key, wrong type). Following
    # this rule's suggestion (TypeError) would go uncaught at every one
    # of those call sites.
    "TRY004",
]

[lint.pydocstyle]
convention = "numpy"

[lint.per-file-ignores]
# Adapters and scripts/ are scripts: their contract is the module docstring, and their
# functions and methods are documented where a reader needs it, not by rule.
"adapters/*.py" = ["D102", "D103", "D107"]
"scripts/*.py" = ["D102", "D103", "D107"]
# A test's name says what it pins.
"sdk/python/tests/**" = ["D"]
"tests/**" = ["D"]
