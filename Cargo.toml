[package]
name = "homeostat"
version = "0.18.0"
edition = "2021"
description = "A household regulator. Text-first home automation core."
license = "Apache-2.0"
default-run = "homeostat"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive"] }
# "unstable" for the matching-status API the integration tests use to
# synchronize on subscriber-interest propagation.
zenoh = { version = "1.10", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "sync", "io-util"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
libc = "0.2.186"
schemars = "1"

[dev-dependencies]
rumqttc = "0.25.1"
# "bundled" so the recorder tests can assert on the store without a system
# libsqlite3; the recorder itself uses Python's stdlib sqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }

# Pedantic lints chosen for what they catch here: unclear docs, lossy
# casts, needless allocation and clones, and unidiomatic control flow. CI
# denies warnings, so each one listed is enforced.
[lints.clippy]
cast_lossless = "warn"
cast_possible_wrap = "warn"
doc_markdown = "warn"
duration_suboptimal_units = "warn"
format_collect = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
items_after_statements = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
needless_continue = "warn"
redundant_closure_for_method_calls = "warn"
ref_option = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
stable_sort_primitive = "warn"
uninlined_format_args = "warn"
