name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  # Build provenance attestations (Sigstore, via GitHub's OIDC identity)
  # for the image and the tarballs.
  id-token: write
  attestations: write

# Third-party actions are pinned to a commit; the comment is the tag that
# commit carried when pinned, for dependabot and for humans.

jobs:
  # Native builds on both architectures — no cross toolchain, no QEMU.
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: stable
      - run: cargo build --release --locked --bin homeostat
      - name: Package
        run: |
          tar czf "homeostat-$GITHUB_REF_NAME-${{ matrix.target }}.tar.gz" \
            -C target/release homeostat \
            -C "$GITHUB_WORKSPACE" LICENSE README.md
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: homeostat-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: homeostat-*.tar.gz

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # QEMU only emulates the runtime stage's apt/uv steps; the Rust
      # builder stage cross-compiles natively (see Dockerfile).
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Attests the multi-arch index digest — the one `docker pull` by tag
      # resolves to — and pushes the attestation to the registry next to it.
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
      - run: sha256sum homeostat-*.tar.gz > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A semver prerelease (v0.14.0-rc1) must not become the repo's
          # "Latest" release: that is what the front page offers and what a
          # house reads when choosing a version to pin, and an rc is by
          # definition not the thing to hand someone who asks for current.
          # The hyphen is semver's own prerelease marker, so the tag says it.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" homeostat-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            $prerelease \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Container image: \`docker pull ghcr.io/$GITHUB_REPOSITORY:${GITHUB_REF_NAME#v}\`"
