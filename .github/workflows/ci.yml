name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to a commit. The trailing comment is the
# tag that commit carried when it was pinned. Dependabot reads it, and so do
# people.
jobs:
  test:
    runs-on: ubuntu-latest
    # The tests run on the Debian release the image ships, pinned, so a new
    # hosted runner image does not change the toolchain, mosquitto or Python
    # under them. Steps run as root in the container.
    container: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    # Line tables keep file and line in panic backtraces at under half the
    # size of full debug info, which the runner's free disk needs.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The image is bare. Checkout needs git for the full history, the Rust
      # toolchain action needs curl, the cache wants zstd, and
      # scripts/smoke_bare.sh needs python3.
      - name: Install the build and test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl zstd build-essential pkg-config \
            python3 nodejs mosquitto
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync_starter.sh --check reads adapters/ at the tag the starter
          # pins. A shallow checkout has no tags.
          fetch-depth: 0
      # The workspace belongs to the runner's uid, not root's, and git
      # refuses to read a repository another user owns.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # `stable` is a moving branch of this action. With the commit pinned,
      # the toolchain is named explicitly instead, as its README describes.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            sdk/python/pyproject.toml
            adapters/*.py
            adapters/*.py.lock
            tests/*.py.lock
            tests/fixtures/house_*/units/*.py.lock
      # Each check is its own step, so the log shows which one failed.
      # scripts/check.sh holds the commands and the tool versions.
      - name: Pre-warm the Python units' uv environments
        run: scripts/prewarm.sh
      - run: scripts/check.sh fmt
      - run: scripts/check.sh clippy
      - run: scripts/check.sh cargo-test
      - run: scripts/check.sh sdk
      - run: scripts/check.sh pyright
      - run: scripts/check.sh adapters
      - run: scripts/check.sh ruff
      - run: scripts/check.sh js
      - run: scripts/check.sh starter
      - run: scripts/check.sh smoke-bare

  # The dashboard page in a real browser against canned fixtures
  # (tests/browser/README.md). It is a separate job because it is the only
  # one that needs a browser. A failure here fails the build.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/browser/run.py.lock
      - name: Install Chromium
        run: scripts/install_browser.sh
      - run: scripts/check.sh browser

  # Known vulnerabilities in Cargo.lock, against the RustSec database.
  # Accepted transitive ones are listed, with reasons, in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Build the container image and check that the supervisor boots a real
  # house inside it. scripts/smoke_image.sh lists what the smoke test
  # asserts.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The runner's own architecture, loaded into the daemon for the smoke
      # tests (`load:` cannot take a multi-platform build).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: homeostat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke_image.sh homeostat:smoke
      - run: scripts/smoke_starter.sh homeostat:smoke
      # The same house against its simulated devices (starter-house/demo):
      # every device's state reaches the store, and a command round-trips.
      - run: scripts/smoke_demo.sh homeostat:smoke
      # Build both release architectures, so a cross-compile failure or an
      # arm64-only runtime-stage failure shows up here and not on the
      # release tag. Nothing is pushed. The amd64 half comes from the cache
      # above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
