name: CI

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to a commit. The trailing comment is the
# tag that commit carried when it was pinned. Dependabot reads it, and so do
# people.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # sync_starter.sh --check reads adapters/ at the tag the starter
          # pins. A shallow checkout has no tags.
          fetch-depth: 0
      # `stable` is a moving branch of this action. With the commit pinned,
      # the toolchain is named explicitly instead, as its README describes.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            sdk/python/pyproject.toml
            adapters/*.py
            adapters/*.py.lock
            tests/*.py.lock
            tests/fixtures/house_*/units/*.py.lock
      - name: Install mosquitto
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mosquitto
      # Resolve dependencies up front so the first run does not eat into
      # test timeouts. The tests run against the lockfile committed next to
      # each script. With --locked, a script edited past its lock fails here
      # instead of re-resolving.
      - name: Pre-warm the Python units' uv environments
        run: |
          for script in adapters/*.py tests/fake_*.py tests/fixtures/house_*/units/*.py; do
            uv sync --locked --script "$script"
          done
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The SDK's bus-free helpers (sdk/python/tests), with stdlib unittest.
      # paho is not an SDK dependency. homeostat.mqtt is an optional module,
      # and the MQTT adapters bring their own paho for it. Its message guard
      # is tested here, so the runner needs paho.
      - run: uv run --no-project --with-editable sdk/python --with 'paho-mqtt>=2,<3' python -m unittest discover sdk/python/tests
      # The SDK ships py.typed, so units type-check against it. This checks
      # that its annotations hold.
      - run: uv run --no-project --with-editable sdk/python --with 'paho-mqtt>=2,<3' --with pyright==1.1.414 pyright sdk/python/homeostat
      # The adapters' logic, unit by unit, without a bus or a process.
      - run: uv run --no-project --with-editable sdk/python --with 'paho-mqtt>=2,<3' python -m unittest discover tests/adapters
      - run: uvx ruff@0.16.7 check adapters sdk scripts tests/adapters tests/browser
      # The dashboard's decision logic (adapters/assets/dashboard-logic.js)
      # and its html tag, with Node's built-in runner and no packages. The
      # shell expands the glob, because newer Node treats a bare directory
      # argument as a module path and fails with MODULE_NOT_FOUND.
      - run: node --test tests/js/*.test.js
      # examples/starter-house ships generated copies of adapters/. This
      # fails when a copy is edited by hand or a release does not
      # regenerate them.
      - run: scripts/sync_starter.sh --check
      # Run without Docker: install the binary and the SDK wheel on this
      # bare runner, the way a release's tarball and wheel are installed.
      # scripts/smoke_bare.sh lists what it asserts.
      - run: uv build --wheel sdk/python -o "$RUNNER_TEMP/wheels"
      - run: cargo build --bin homeostat
      - run: scripts/smoke_bare.sh target/debug/homeostat "$RUNNER_TEMP/wheels"

  # The dashboard page in a real browser against canned fixtures
  # (tests/browser/README.md). It is a separate job because it is the only
  # one that needs a browser. A failure here fails the build.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/browser/run.py.lock
      - name: Install Chromium
        run: scripts/install_browser.sh
      - run: uv run --script tests/browser/run.py

  # Known vulnerabilities in Cargo.lock, against the RustSec database.
  # Accepted transitive ones are listed, with reasons, in .cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # master
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Build the container image and check that the supervisor boots a real
  # house inside it. scripts/smoke_image.sh lists what the smoke test
  # asserts.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The runner's own architecture, loaded into the daemon for the smoke
      # tests (`load:` cannot take a multi-platform build).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: homeostat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke_image.sh homeostat:smoke
      - run: scripts/smoke_starter.sh homeostat:smoke
      # The same house against its simulated devices (starter-house/demo):
      # every device's state reaches the store, and a command round-trips.
      - run: scripts/smoke_demo.sh homeostat:smoke
      # Build both release architectures, so a cross-compile failure or an
      # arm64-only runtime-stage failure shows up here and not on the
      # release tag. Nothing is pushed. The amd64 half comes from the cache
      # above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
