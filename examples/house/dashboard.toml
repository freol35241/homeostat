# The family surface's views (docs/design.md, Dashboard: views are text).
# Each [[view]] is a nav entry; without this file the dashboard renders
# its generated views. Health and "Not shown" — everything no view places
# — stay reachable from the rail whatever is written here.
schema = 1

[[view]]
name = "now"
widgets = [
  { kind = "tile", entity = "outdoor_temp" },            # the outdoor reading, big, with today's range
  { kind = "tile", entity = "downstairs_temperature" },
  { kind = "people" },
  { kind = "deviations" },
]

[[view]]
name = "outdoors"
widgets = [
  # a group is one card over its members: the reading, then its day
  { kind = "group", label = "Outdoor", widgets = [
    { kind = "tile", entity = "outdoor_temp" },
    { kind = "chart", entity = "outdoor_temp", aspect = "temperature", hours = 24 },
  ] },
]

[[view]]
name = "downstairs"
widgets = [
  { kind = "unit", unit = "evening_lights" },           # its setpoint, and the lights it drives
  { kind = "unit", unit = "fused_temperature" },        # what it publishes, and what it reads
  # Opening this chart's detail overlay offers "with sources": the two
  # thermometers it is fused from, drawn beside it (docs/design.md, Sources).
  { kind = "chart", entity = "downstairs_temperature", aspect = "temperature", hours = 24 },
  { kind = "room", room = "kitchen" },
  { kind = "room", room = "livingroom" },
  { kind = "room", room = "hallway" },
]

[[view]]
name = "setpoints"
kind = "setpoints"

# How coarse a control is, keyed by what it controls rather than by the
# widget that places it — so the same grain applies on the room card, on a
# view and in the detail overlay. Without an entry the dashboard derives
# one (a twentieth of the range), which is a guess the house may know
# better than. A slider is the one control a finger moves by accident.
[[control]]
entity = "livingroom_lamp"
aspect = "brightness"
step = 5

[[control]]
unit = "intrusion"
param = "cooldown_minutes"
step = 5
