schema = 1

# No `id`: this value is computed, so it has no adapter-native address
# and none needs to be made up.
[entity]
capability = "sensor"
features = ["temperature"]
room = "global"

[naming]
sv = "temperaturen där nere"
en = "downstairs temperature"
aliases = []

[write_policy]
mode = "exclusive"
owner = "fused_temperature"

# The readings this value is derived from (docs/design.md#sources). They
# are declared because they cannot be inferred: the unit subscribes to a
# zone-wide expression, and a subscription does not say which readings
# feed which published aspect. The history overlay draws them beside the
# fused line.
[sources.kitchen]
entity = "kitchen_temp"
aspect = "temperature"
note = "south-facing; reads high on a sunny afternoon"
precision = 0.5

[sources.livingroom]
entity = "livingroom_temp"
aspect = "temperature"
