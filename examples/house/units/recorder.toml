schema = 1

[unit]
name = "recorder"
kind = "service"
description = "Writes home/state/** to the time-series store"

[runtime]
command = "uv run units/recorder.py"
restart = "always"

[discovery]
mode = "static"
endpoint = "sqlite:data/history.db"

# Retention: rows older than the window are purged hourly; 0 keeps them
# forever. Events are the audit trail — the smaller table and the one
# worth keeping longest — so the two windows are separate.
[params.retain_samples_days]
type = "float"
default = 0
constraint = { min = 0 }
editable_by = "owner"

[params.retain_events_days]
type = "float"
default = 0
constraint = { min = 0 }
editable_by = "owner"

[bus.subscribes]
state = "home/state/**"
cmd = "home/cmd/**"
health = "home/health/**"
config = "home/config/**"

[bus.publishes]
history = { key = "home/history/**" }
