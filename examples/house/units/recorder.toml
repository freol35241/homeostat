schema = 1

[unit]
name = "recorder"
kind = "service"
description = "Writes home/state/** to the time-series store"

[runtime]
command = "uv run units/recorder.py"
restart = "always"

[discovery]
mode = "static"
endpoint = "sqlite:data/history.db"

# Retention: rows older than the window are purged hourly; 0 keeps them
# forever. Events are the audit trail — the smaller table and the one
# worth keeping longest — so the two windows are separate.
[params.retain_samples_days]
type = "float"
default = 0
constraint = { min = 0 }
editable_by = "owner"

# Superseded issues are what grows: every re-issue of a horizon is kept
# so a forecast can be checked against what actually happened, which is
# the whole reason to store one. Measured on issue time.
[params.retain_forecasts_days]
type = "float"
default = 0
constraint = { min = 0 }
editable_by = "owner"

[params.retain_events_days]
type = "float"
default = 0
constraint = { min = 0 }
editable_by = "owner"

# A disk returning corrupt data is silent in SQLite until a read hits it:
# PRAGMA integrity_check on this schedule, reported as a health event.
# 0 disables.
[params.integrity_check_hours]
type = "float"
default = 24
constraint = { min = 0 }
editable_by = "owner"

# Archiving moves, retention deletes: a month that closed more than this
# many months ago is sealed into archive/<store>-YYYY-MM.db beside the
# store (a plain SQLite file with the store's schema) and leaves this
# file, so the file the recorder writes stays one window deep and nothing
# is lost. 0 never archives.
[params.archive_after_months]
type = "int"
default = 0
constraint = { min = 0 }
editable_by = "owner"

# Archives are kept forever unless this is set: then a whole archive file
# goes once its month closed more than this many months ago. It never
# touches the hot file, which the retain_*_days windows govern. 0 keeps
# every archive.
[params.retain_archives_months]
type = "int"
default = 0
constraint = { min = 0 }
editable_by = "owner"

[bus.subscribes]
state = "home/state/**"
# A series' future, stored beside its past. Recording forecasts is a
# house's choice — drop this line and the class is simply not kept.
forecast = "home/forecast/**"
cmd = "home/cmd/**"
health = "home/health/**"
config = "home/config/**"

[bus.publishes]
history = { key = "home/history/**" }
