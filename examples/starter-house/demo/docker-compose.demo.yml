# The starter house with simulated devices in place of the hardware — see
# demo/README.md. Layered over the house's own compose file:
#
#   docker compose -f docker-compose.yml -f demo/docker-compose.demo.yml up -d
#
# (demo/up.sh does exactly that.) Every homeostat adapter runs unchanged;
# only what is on the far side of them is simulated.
services:
  # No coordinator stick in a demo: zigbee2mqtt only starts when the
  # `hardware` profile is asked for. The simulator plays its part on the
  # broker instead — the bridge inventory, the devices and their commands.
  zigbee2mqtt:
    profiles: ["hardware"]

  simulator:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./demo:/demo:ro
    command: ["uv", "run", "--script", "/demo/simulator.py"]

  homeostat:
    environment:
      # The porch switch is an ESPHome device the simulator serves; an mDNS
      # name would not cross the compose network, so the adapter is told
      # its address (units/esphome.toml, HOMEOSTAT_ESPHOME_DEVICES).
      HOMEOSTAT_ESPHOME_DEVICES: /house/demo/esphome-devices.toml
