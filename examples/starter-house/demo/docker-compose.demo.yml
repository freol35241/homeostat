# The starter house with simulated devices in place of the hardware (see
# demo/README.md). It is layered over the house's own compose file:
#
#   docker compose -f docker-compose.yml -f demo/docker-compose.demo.yml up -d
#
# demo/up.sh runs that command. Every homeostat adapter runs unchanged;
# only the devices on the far side of them are simulated.
services:
  # A demo has no coordinator stick, so zigbee2mqtt starts only under the
  # `hardware` profile. The simulator takes its place on the broker: it
  # publishes the bridge inventory and the devices, and obeys commands.
  zigbee2mqtt:
    profiles: ["hardware"]

  simulator:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./demo:/demo:ro
    command: ["uv", "run", "--script", "/demo/simulator.py"]

  homeostat:
    environment:
      # The simulator serves the porch switch as an ESPHome device. An mDNS
      # name does not resolve across the compose network, so the adapter
      # is given its address (units/esphome.toml, HOMEOSTAT_ESPHOME_DEVICES).
      HOMEOSTAT_ESPHOME_DEVICES: /house/demo/esphome-devices.toml
