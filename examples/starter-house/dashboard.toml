# The family surface's views (docs/design.md#views-are-text).
# Each [[view]] is a nav entry, in this order. A widget places something
# the house already has, and the dashboard decides how to draw it. Without
# this file the dashboard renders its generated views (Now, Setpoints,
# Rooms). Health and "Not shown" (everything no view places) stay
# reachable from the rail whatever this file says. `homeostat plan`
# refuses a typo.
schema = 1

[[view]]
name = "now"
widgets = [
  { kind = "tile", entity = "heatpump", aspect = "indoor_temperature" },
  { kind = "people" },
  { kind = "deviations" },
  { kind = "map" },
]

[[view]]
name = "heating"
widgets = [
  { kind = "dial", entity = "heatpump" },                                   # the indoor target, on a dial
  { kind = "chart", entity = "heatpump", aspect = "indoor_temperature", hours = 24 },
  { kind = "chart", entity = "heatpump", aspect = "GT2", hours = 168 },                # outdoor, a week
]

[[view]]
name = "downstairs"
widgets = [
  { kind = "unit", unit = "evening_lights" },     # its off time, and the lights it drives
  { kind = "room", room = "livingroom" },
  { kind = "room", room = "hallway" },
  { kind = "room", room = "porch" },
]

# The step a control moves in. It is keyed by what the control sets, so a
# brightness slider moves in the same steps on the room card and in the
# detail overlay. Without an entry the dashboard derives one from the
# range. `homeostat plan` refuses a control that names nothing.
[[control]]
entity = "livingroom_lamp"
aspect = "brightness"
step = 5
