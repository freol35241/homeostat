schema = 1

[unit]
name = "dashboard"
kind = "service"
# The model is a view over the WHOLE house, so any entity or manifest
# change is a change to this unit (docs/design.md, change detection).
inputs = "house"
description = "Family web dashboard: generated views over state, setpoints and health"

[runtime]
command = "uv run units/dashboard.py --port 8600"
restart = "always"
shutdown_grace_s = 5
env = ["HOMEOSTAT_DASHBOARD_PORT", "HOMEOSTAT_DASHBOARD_TILES", "HOMEOSTAT_DASHBOARD_HOSTS", "HOMEOSTAT_GO2RTC"]

[bus.subscribes]
state = "home/state/**"
health = "home/health/**"
config = "home/config/*/*"

[bus.publishes]
lights = { key = "home/cmd/**", capability = "light", priority = "manual" }
locks = { key = "home/cmd/**", capability = "lock", priority = "manual" }
switches = { key = "home/cmd/**", capability = "switch", priority = "manual" }
climate = { key = "home/cmd/**", capability = "climate", priority = "manual" }
