schema = 1

[unit]
name = "persons"
kind = "automation"
description = "Computes each person from the trackers that person carries"

[runtime]
command = "uv run units/persons.py"
restart = "on-failure"
shutdown_grace_s = 5

[bus.subscribes]
# Every tracker lives in the pseudo-room `person`.
trackers = "home/state/person/*/*"

[bus.publishes]
person = { key = "home/state/{room}/{entity}/*" }

# A fix less accurate than this does not move the person on the map.
[params.max_accuracy_m]
type = "float"
default = 500
constraint = { min = 1 }
editable_by = "owner"

[naming]
sv = "personer"
en = "persons"
aliases = []

[entities]
dir = "entities/persons/"
