# Two listeners with different trust levels. per_listener_settings keeps
# their settings independent.
#
# 1883 is inside the compose network only; no ports: mapping publishes
# it. It is anonymous, with full access and no ACL. zigbee2mqtt and the
# homeostat adapters are already inside the trust boundary, and anything
# else that can reach a compose-internal port is already on the host,
# which is trusted. The unpublished bus port 7447 in docker-compose.yml
# rests on the same reasoning.
#
# 1884 is published to the LAN for devices that cannot join a VPN (the
# IVT490 heat-pump interface) and for OwnTracks phones. It requires
# credentials, and the ACL confines each one to its own topic tree, so a
# leaked device password reaches only that device's topics and not
# zigbee2mqtt/#.
#
# The password file starts empty, so nobody can connect, and stays out
# of your house repo. Add users with mosquitto_passwd (see the README).

per_listener_settings true

listener 1883
listener_allow_anonymous true

listener 1884
listener_allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
